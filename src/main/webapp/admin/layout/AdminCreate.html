    <script>
        $(function () {

            $('#example2').DataTable({
                "paging": true,
                "lengthChange": false, // 關閉每頁筆數選項
                "searching": false,    // 關閉搜索框
                "ordering": true,
                "info": true,          // 顯示資訊文字
                "autoWidth": true,
                "responsive": true,

                // **【關鍵修正】使用 dom 屬性強制分頁 (p) 靠右 (col-md-7)**
                // 結構: 表格本體(t) / 新的一行: [資訊(i) - 左 5 欄] [分頁(p) - 右 7 欄]
                "dom": '<"row"<"col-sm-12"t>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7 d-flex justify-content-end"p>>'
            });

            $('form').on('submit', function (e) {
                e.preventDefault();
				
             // ----------- Email 驗證函式 -----------
                function isValidEmail(email) {
                    const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    return regex.test(email);
                }

                // ----------- 密碼驗證共用函式 -----------
                function validatePassword() {
                    let pwd = $('#password').val().trim();

                    if (pwd.length < 8) {
                        alert('密碼不得小於 8 碼');
                        return false;
                    }
                    if (!/[0-9]/.test(pwd)) {
                        alert('密碼必須包含數字');
                        return false;
                    }
                    if (!/[A-Za-z]/.test(pwd)) {
                        alert('密碼必須包含英文字母');
                        return false;
                    }
                    return true;
                }

                
                const data = {
                    name: $('#name').val().trim(),
                    email: $('#email').val().trim(),
                    password: $('#password').val().trim(),
                    phone: $('#phone').val().trim(),
                    role: $('#role').val(),
                };
                
                const email = $('#email').val().trim();
                const pwd = $('#password').val().trim();

                if (email === '') {
                    e.preventDefault();
                    alert('Email不得為空白');
                    return;
                }

                // Email 格式不正確
                if (!isValidEmail(email)) {
                    e.preventDefault();
                    alert('Email 格式不正確');
                    return;
                }

             // ----------- 密碼驗證-----------
                if (!validatePassword()) {
                    return; 
                }

                $.ajax({
                    url: '/pet/AdminServlet?action=create',
                    method: 'POST',
                    data: data,
                    dataType: 'json',
                    success: function (res) {
                    	console.log('成功!');
                    	window.location.href = 
                            `AdminCreateDone.jsp?` +
                            `id=${res.adminId}` +
                            `&name=${res.name}` +
                            `&email=${res.email}` +
                            `&phone=${res.phone}` +
                            `&role=${res.role}`; // 新增後跳至新增成功頁面
                    },
                    error: function (xhr) {
                        console.error(xhr.responseText);
                        alert('新增失敗，請檢查資料');
                    }
                });
                
            });
        });
    </script>
