spring.application.name=demo

#Tomcat Server Port Setting:
server.port=8081

#static-resources location setting
spring.web.resources.static-locations=/WEB-INF/resources/, classpath:/static/
spring.mvc.static-path-pattern=/**

#ContextPath Setting 
#server.servlet.context-path=/Wonderland

#Thymeleaf Setting
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

#SQL Server Setting
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=petDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=seren
spring.datasource.password=1234

#MySQL Setting
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://localhost:3306/LeonPower?serverTimeZone=UTC
#spring.datasource.username=seren
#spring.datasource.password=1234

#Redis Setting
spring.data.redis.host = 127.0.0.1
spring.data.redis.port = 6379
spring.data.redis.password = 
spring.data.redis.database = 1
# Redis 超時設定 (當 Redis 掛掉時，快速 fallback 到 SQL)
spring.data.redis.timeout = 2000ms
spring.data.redis.connect-timeout = 2000ms
spring.data.redis.lettuce.pool.enabled = false

#MongoDB Setting (Audit Logging) 
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=petAuditDB

# 正式部屬後不需要這些（使用同域名）
# 允許 Cookie 跨站傳送 (Cloudflare Tunnel 需要)
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

#Spring Data JPA Setting
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.hibernate.ddl-auto=update

#Multipart File Setting
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

app.upload.dir=C:/pet_uploads/

