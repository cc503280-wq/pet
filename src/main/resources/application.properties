spring.application.name=demo

#Tomcat Server Port Setting:
server.port=8081

#static-resources location setting
spring.web.resources.static-locations=/WEB-INF/resources/, classpath:/static/
spring.mvc.static-path-pattern=/**

#ContextPath Setting 
#server.servlet.context-path=/Wonderland

#Thymeleaf Setting
spring.thymeleaf.prefix=/WEB-INF/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

#SQL Server Setting
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=petDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=seren
spring.datasource.password=1234

#MySQL Setting
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://localhost:3306/LeonPower?serverTimeZone=UTC
#spring.datasource.username=seren
#spring.datasource.password=1234

#Spring Data JPA Setting
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.hibernate.ddl-auto=update

#Multipart File Setting
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
