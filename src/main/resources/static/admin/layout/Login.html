<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            transition: 0.3s;
        }

        .login-container input[type="text"]:focus,
        .login-container input[type="password"]:focus {
            border-color: #5c9bde;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background-color: #5c9bde;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-container button:hover {
            background-color: #3687cd;
        }

        .remember {
            display: flex;
            align-items: center;
            margin-top: 10px;
            font-size: 14px;
            color: #333;
        }

        .remember input[type="checkbox"] {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .remember label {
            cursor: pointer;
        }

        #alertEmail,
        #alertPassword {
            color: red;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2>管理員登入</h2>
        <div id="alertEmail"></div>
        <div id="alertPassword"></div>
        <form id="loginForm">
            <input type="text" id="email" placeholder="請輸入 Email" autocomplete="off" required>
            <input type="password" id="password" placeholder="請輸入密碼" autocomplete="off">
            <div class="remember">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">記住帳號</label>
            </div>
            <button type="submit" id="login">登入</button>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
    $(function () {
        // 1. 頁面載入時檢查 localStorage (記住帳號功能維持不變)
        const savedEmail = localStorage.getItem('savedEmail');
        if (savedEmail) {
            $('#email').val(savedEmail);
            $('#rememberMe').prop('checked', true);
        }

        // ----------- Email 格式驗證 -----------
        function isValidEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        $('#loginForm').on('submit', function (e) {
            e.preventDefault();
            
            const email = $('#email').val().trim();
            const pwd = $('#password').val().trim();
            const remember = $('#rememberMe').prop('checked');

            // 2. 前端驗證
            if (email === '') {
                $('#alertEmail').text('Email不得為空白');
                return;
            }

            if (!isValidEmail(email)) {
                $('#alertEmail').text('Email 格式不正確');
                return;
            } else {
                $('#alertEmail').text('');
            }

            if (pwd === '') {
                $('#alertPassword').text('密碼不得為空白');
                return;
            } else {
                $('#alertPassword').text('');
            }

            // 3. 處理「記住帳號」 (localStorage)
            if (remember) {
                localStorage.setItem('savedEmail', email);
            } else {
                localStorage.removeItem('savedEmail');
            }

            // 4. 準備登入資料 (JSON)
            const loginData = {
                email: email,
                password: pwd
            };

            // 5. 發送 AJAX 至 Spring Boot Controller
            $.ajax({
                url: '/auth/login',         
                type: 'POST',
                contentType: 'application/json', 
                data: JSON.stringify(loginData),  
                dataType: 'json',
                success: function (response) {
                    // 假設後端成功回傳物件包含 { "adminId": 1, "name": "王小明", "role": "admin" }
                    if (response && response.role) {
                        // 登入前先清空舊的 session 資料
                        sessionStorage.clear();
                        
                        // 儲存新的登入資訊
                        sessionStorage.setItem('role', response.role);
                        sessionStorage.setItem('adminName', response.name);
                        sessionStorage.setItem('adminId', response.adminId);
                        
                        // 跳轉至首頁 
                        window.location.href = 'Home.html';
                    } else {
                        $('#alertPassword').text('帳號或密碼錯誤');
                    }
                },
                error: function (xhr) {
                    // 根據後端回傳的 HttpStatus (如 401) 顯示錯誤
                    if (xhr.status === 401) {
                        $('#alertPassword').text('帳號密碼錯誤或帳號已被停用');
                    } else {
                        alert('系統連線失敗，請稍後再試');
                    }
                }
            });
        });
    });
    </script>
    </script>

</body>

</html>
