<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>系統監控儀表板 | 管理中心</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../../dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../dist/css/admin-custom.css">

    <style>
        :root {
            --primary-color: #be8754;
            --secondary-color: #ffc20f;
            --dark-color: #6a2614;
            --light-color: #fbf7ea;
            --body-color: #5a4530;
        }

        body {
            color: var(--body-color);
            background-color: var(--light-color);
            font-family: 'Quicksand', sans-serif;
        }

        h1, h2, h3, h4, h5, h6, .card-title {
            color: var(--dark-color) !important;
            font-weight: 700;
        }

        .main-header {
            background-color: var(--primary-color) !important;
            border-bottom: none;
            height: 57px;
        }

        .main-sidebar {
            background-color: var(--primary-color) !important;
        }

        .brand-link {
            display: flex;
            justify-content: center !important;
            align-items: center;
            height: 57px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            background-color: var(--primary-color) !important;
        }

        .nav-sidebar>.nav-item>.nav-link { color: #fff !important; }
        .nav-sidebar>.nav-item>.nav-link:hover { background-color: rgba(255, 255, 255, 0.2) !important; }
        .nav-sidebar>.nav-item>.nav-link.active { background-color: var(--secondary-color) !important; color: var(--dark-color) !important; font-weight: bold; }
        .nav-treeview>.nav-item>.nav-link { color: #fff !important; }
        .nav-treeview>.nav-item>.nav-link:hover,
        .nav-treeview>.nav-item>.nav-link.active { background-color: var(--secondary-color) !important; color: var(--dark-color) !important; font-weight: bold; }

        .content-wrapper { background-color: var(--light-color) !important; }

        .btn-theme-action { background-color: var(--dark-color) !important; color: #fff !important; border: none; }
        .btn-theme-action:hover { background-color: #501e0f !important; color: var(--secondary-color) !important; }

        .card { background-color: #fff; border: none; box-shadow: 0 0 10px rgba(0, 0, 0, 0.05); }
        .card-primary.card-outline { border-top: 3px solid var(--primary-color) !important; }
        .card-success.card-outline { border-top: 3px solid var(--secondary-color) !important; }
        .card-danger.card-outline { border-top: 3px solid var(--dark-color) !important; }
        .card-info.card-outline { border-top: 3px solid #17a2b8 !important; }

        .chart-container { position: relative; height: 250px; width: 100%; }
        
        /* 統計卡片 */
        .stat-card {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            color: #fff;
        }
        .stat-card .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
        }
        .stat-card .stat-label {
            font-size: 1rem;
            opacity: 0.9;
        }
        .stat-card.bg-success { background: linear-gradient(135deg, #28a745, #20c997) !important; }
        .stat-card.bg-danger { background: linear-gradient(135deg, #dc3545, #f86384) !important; }
        .stat-card.bg-warning { background: linear-gradient(135deg, #ffc107, #ffda6a) !important; color: #333 !important; }
        .stat-card.bg-info { background: linear-gradient(135deg, #17a2b8, #3dd5f3) !important; }
        
        /* 表格樣式 */
        .table-hover tbody tr:hover { background-color: rgba(190, 135, 84, 0.1); }
        .badge-login { background-color: #28a745; }
        .badge-logout { background-color: #6c757d; }
        .badge-check_in { background-color: #17a2b8; }
        .badge-complete { background-color: #ffc107; color: #333; }
        
        /* 載入動畫 */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
        
        /* 刷新按鈕 */
        .refresh-btn {
            cursor: pointer;
            transition: transform 0.3s;
        }
        .refresh-btn:hover {
            transform: rotate(180deg);
        }
    </style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
    <div class="wrapper">

        <!-- Content -->
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="d-flex justify-content-between align-items-center">
                        <h1><i class="fas fa-tachometer-alt mr-2"></i>系統監控儀表板</h1>
                        <button class="btn btn-theme-action" onclick="refreshAll()">
                            <i class="fas fa-sync-alt refresh-btn"></i> 刷新數據
                        </button>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    <!-- 統計卡片 -->
                    <div class="row">
                        <div class="col-lg-3 col-6">
                            <div class="stat-card bg-success">
                                <div class="stat-number" id="totalExecutions">-</div>
                                <div class="stat-label"><i class="fas fa-server mr-1"></i> 總執行次數</div>
                            </div>
                        </div>
                        <div class="col-lg-3 col-6">
                            <div class="stat-card bg-info">
                                <div class="stat-number" id="successRate">-</div>
                                <div class="stat-label"><i class="fas fa-check-circle mr-1"></i> 成功率</div>
                            </div>
                        </div>
                        <div class="col-lg-3 col-6">
                            <div class="stat-card bg-warning">
                                <div class="stat-number" id="avgResponseTime">-</div>
                                <div class="stat-label"><i class="fas fa-clock mr-1"></i> 平均回應時間(ms)</div>
                            </div>
                        </div>
                        <div class="col-lg-3 col-6">
                            <div class="stat-card bg-danger">
                                <div class="stat-number" id="requestsLastHour">-</div>
                                <div class="stat-label"><i class="fas fa-bolt mr-1"></i> 最近一小時請求</div>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-4">
                        <!-- 美容師操作統計 -->
                        <div class="col-md-6">
                            <div class="card card-outline card-primary">
                                <div class="card-header">
                                    <h3 class="card-title"><i class="fas fa-user-tie mr-1"></i> 美容師操作統計</h3>
                                </div>
                                <div class="card-body">
                                    <div class="chart-container"><canvas id="groomerActivityChart"></canvas></div>
                                </div>
                            </div>
                        </div>
                        <!-- 慢速方法排行 -->
                        <div class="col-md-6">
                            <div class="card card-outline card-danger">
                                <div class="card-header">
                                    <h3 class="card-title"><i class="fas fa-exclamation-triangle mr-1"></i> 慢速方法 TOP 5</h3>
                                </div>
                                <div class="card-body">
                                    <div class="chart-container"><canvas id="slowMethodsChart"></canvas></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-4">
                        <!-- 最近操作日誌 -->
                        <div class="col-12">
                            <div class="card card-outline card-success">
                                <div class="card-header">
                                    <h3 class="card-title"><i class="fas fa-history mr-1"></i> 最近操作日誌</h3>
                                    <div class="card-tools">
                                        <select id="actionTypeFilter" class="form-control form-control-sm" style="width: 150px;">
                                            <option value="">全部類型</option>
                                            <option value="LOGIN">登入</option>
                                            <option value="LOGOUT">登出</option>
                                            <option value="CHECK_IN">報到</option>
                                            <option value="COMPLETE">完成</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="card-body table-responsive p-0" style="max-height: 400px;">
                                    <table class="table table-hover table-striped">
                                        <thead class="sticky-top bg-white">
                                            <tr>
                                                <th>時間</th>
                                                <th>美容師</th>
                                                <th>操作類型</th>
                                                <th>對象</th>
                                                <th>IP 位址</th>
                                                <th>描述</th>
                                            </tr>
                                        </thead>
                                        <tbody id="actionLogTable">
                                            <tr><td colspan="6" class="text-center">載入中...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-4">
                        <!-- 最近錯誤 -->
                        <div class="col-12">
                            <div class="card card-outline card-info">
                                <div class="card-header">
                                    <h3 class="card-title"><i class="fas fa-bug mr-1"></i> 最近錯誤記錄</h3>
                                </div>
                                <div class="card-body">
                                    <div id="recentErrors">載入中...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="main-footer">
            <strong>Copyright &copy; 2026 Pet Admin Project.</strong>
        </footer>
    </div>

    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../dist/js/adminlte.min.js"></script>
    <script src="../../dist/js/admin-layout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const themeColors = {
            primary: '#be8754',
            secondary: '#ffc20f',
            dark: '#6a2614',
            success: '#28a745',
            info: '#17a2b8',
            warning: '#ffc107',
            danger: '#dc3545'
        };

        let groomerChart = null;
        let slowMethodsChart = null;

        $(function() {
            refreshAll();
            
            // 篩選器事件
            $('#actionTypeFilter').change(function() {
                loadActionLogs($(this).val());
            });
        });

        function refreshAll() {
            loadSystemHealth();
            loadGroomerActivity();
            loadSlowMethods();
            loadActionLogs();
        }

        // ========== 系統健康度 ==========
        async function loadSystemHealth() {
            try {
                const res = await $.getJSON('/api/reports/system-health');
                
                $('#totalExecutions').text(res.totalExecutions || 0);
                $('#successRate').text(res.successRate || '0%');
                $('#avgResponseTime').text(res.avgResponseTimeMs || 0);
                $('#requestsLastHour').text(res.requestsLastHour || 0);
                
                // 最近錯誤
                const errorsHtml = renderErrors(res.recentErrors || []);
                $('#recentErrors').html(errorsHtml);
                
            } catch (e) {
                console.error('loadSystemHealth error:', e);
            }
        }

        function renderErrors(errors) {
            if (!errors || errors.length === 0) {
                return '<div class="text-success"><i class="fas fa-check-circle mr-2"></i>目前沒有錯誤記錄，系統運作正常！</div>';
            }
            
            let html = '<div class="list-group">';
            errors.forEach(err => {
                html += `
                    <div class="list-group-item list-group-item-danger">
                        <div class="d-flex justify-content-between">
                            <strong>${err.method || 'N/A'}</strong>
                            <small>${err.time || ''}</small>
                        </div>
                        <div class="text-muted">${err.error || '未知錯誤'}</div>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }

        // ========== 美容師操作統計圖表 ==========
        async function loadGroomerActivity() {
            try {
                const res = await $.getJSON('/api/reports/groomer-activity');
                
                const labels = res.map(r => {
                    const id = r.groomerId || '-';
                    const name = r.groomerName || '未知';
                    return `${id}: ${name}`;
                });
                const loginData = res.map(r => r.loginCount || 0);
                const checkInData = res.map(r => r.checkInCount || 0);
                const completeData = res.map(r => r.completeCount || 0);
                
                const ctx = document.getElementById('groomerActivityChart');
                
                if (groomerChart) {
                    groomerChart.data.labels = labels;
                    groomerChart.data.datasets[0].data = loginData;
                    groomerChart.data.datasets[1].data = checkInData;
                    groomerChart.data.datasets[2].data = completeData;
                    groomerChart.update();
                } else {
                    groomerChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [
                                { label: '登入次數', data: loginData, backgroundColor: themeColors.success },
                                { label: '報到次數', data: checkInData, backgroundColor: themeColors.info },
                                { label: '完成次數', data: completeData, backgroundColor: themeColors.warning }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'top' } }
                        }
                    });
                }
            } catch (e) {
                console.error('loadGroomerActivity error:', e);
            }
        }

        // ========== 慢速方法圖表 ==========
        async function loadSlowMethods() {
            try {
                const res = await $.getJSON('/api/reports/slow-methods?top=5');
                
                const labels = res.map(r => r.method.split('.').pop()); // 只顯示方法名
                const data = res.map(r => r.avgTimeMs);
                
                const ctx = document.getElementById('slowMethodsChart');
                
                if (slowMethodsChart) {
                    slowMethodsChart.data.labels = labels;
                    slowMethodsChart.data.datasets[0].data = data;
                    slowMethodsChart.update();
                } else {
                    slowMethodsChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: '平均執行時間 (ms)',
                                data: data,
                                backgroundColor: [
                                    themeColors.danger,
                                    themeColors.warning,
                                    themeColors.primary,
                                    themeColors.info,
                                    themeColors.success
                                ]
                            }]
                        },
                        options: {
                            indexAxis: 'y',
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } }
                        }
                    });
                }
            } catch (e) {
                console.error('loadSlowMethods error:', e);
            }
        }

        // ========== 操作日誌表格 ==========
        async function loadActionLogs(actionType = '') {
            try {
                let url = '/api/audit/actions';
                if (actionType) {
                    url = `/api/audit/actions/type/${actionType}`;
                }
                
                const res = await $.getJSON(url);
                const tbody = $('#actionLogTable');
                tbody.empty();
                
                if (!res || res.length === 0) {
                    tbody.html('<tr><td colspan="6" class="text-center text-muted">尚無操作日誌</td></tr>');
                    return;
                }
                
                // 按時間倒序排列，取最近 50 筆
                const sorted = res.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 50);
                
                sorted.forEach(log => {
                    const time = log.timestamp ? log.timestamp.replace('T', ' ').substring(0, 19) : '-';
                    const groomerId = log.groomerId || '-';
                    const groomerName = log.groomerName || '未知';
                    const groomer = `${groomerId}: ${groomerName}`;
                    const actionBadge = getActionBadge(log.actionType);
                    const ip = log.ipAddress || '-';
                    const desc = log.details?.description || '-';
                    
                    // 組合對象資訊（會員/預約）
                    let target = '-';
                    if (log.actionType === 'CHECK_IN' || log.actionType === 'COMPLETE') {
                        const memberId = log.targetMemberId || log.details?.memberId || '-';
                        const memberName = log.targetMemberName || log.details?.memberName || '未知';
                        const petName = log.details?.petName || '';
                        const appointmentId = log.targetAppointmentId || log.details?.appointmentId || '-';
                        target = `會員: ${memberName} (#${memberId})`;
                        if (petName) target += `<br><small class="text-muted">寵物: ${petName}, 預約#${appointmentId}</small>`;
                    }
                    
                    tbody.append(`
                        <tr>
                            <td>${time}</td>
                            <td>${groomer}</td>
                            <td>${actionBadge}</td>
                            <td>${target}</td>
                            <td><code>${ip}</code></td>
                            <td>${desc}</td>
                        </tr>
                    `);
                });
            } catch (e) {
                console.error('loadActionLogs error:', e);
                $('#actionLogTable').html('<tr><td colspan="6" class="text-center text-danger">載入失敗</td></tr>');
            }
        }

        function getActionBadge(actionType) {
            const badges = {
                'LOGIN': '<span class="badge badge-login">登入</span>',
                'LOGOUT': '<span class="badge badge-logout">登出</span>',
                'CHECK_IN': '<span class="badge badge-check_in">報到</span>',
                'COMPLETE': '<span class="badge badge-complete">完成</span>'
            };
            return badges[actionType] || `<span class="badge badge-secondary">${actionType}</span>`;
        }
    </script>
</body>

</html>
