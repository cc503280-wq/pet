<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>會員基本資料 | 管理中心</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../../dist/css/adminlte.min.css">
    
    <link rel="stylesheet" href="../../plugins/datatables-bs4/css/dataTables.bootstrap4.min.css">
    <link rel="stylesheet" href="../../plugins/datatables-responsive/css/responsive.bootstrap4.min.css">
    
    <link rel="stylesheet" href="../../dist/css/admin-custom.css">

    <style>
        /* --- 頁面專屬樣式 --- */
        .box1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .disabled-btn {
            pointer-events: none !important;
            opacity: 0.5;
            cursor: not-allowed !important;
        }
        
        /* DataTable 置中與放大 */
        #example2 td, #example2 th {
            text-align: center !important;
            vertical-align: middle !important;
            font-size: 1.15rem !important; /* 放大表格文字 */
            padding: 12px 8px; /* 增加一點舒適的間距 */
        }

        /* --- 簡報模式：全域放大設定 --- */
        body {
            font-size: 1.1rem; /* 基礎字體放大 */
        }

        h1 {
            font-size: 2.2rem; /* 標題放大 */
        }

        .card-title {
            font-size: 1.4rem !important; /* 卡片標題放大 */
        }

        /* 輸入框與下拉選單放大 */
        .form-control, .custom-select {
            font-size: 1.1rem !important;
            height: calc(2.5rem + 2px) !important; /* 增加高度好點擊 */
        }

        /* 按鈕放大 */
        .btn-sm {
            font-size: 1rem !important;
            padding: 6px 12px !important;
        }

        /* 狀態標籤放大 */
        .badge {
            font-size: 1rem !important;
            padding: 6px 10px !important;
        }

        /* 表格分頁按鈕放大 */
        .page-link {
            font-size: 1.1rem !important;
            padding: 8px 12px !important;
        }
    </style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
    <div class="wrapper">
        
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-12 box1">
                            <h1>會員管理</h1>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-12">
                            <div class="card card-outline card-primary">
                                <div class="card-header d-flex align-items-center">
                                    <h3 class="card-title">會員列表</h3>

                                    <div class="d-flex align-items-center ml-auto">
                                        <a href="MemberCreate.html" class="btn btn-theme-action btn-sm mr-2 btn-add">
                                            <i class="fas fa-plus mr-1"></i> 新增資料
                                        </a>
                                        <div class="input-group input-group-sm mr-2" style="width: 160px;"> <select id="statusSelect" class="form-control">
                                                <option value="all">查詢全部</option>
                                                <option value="active">查詢啟用中</option>
                                                <option value="disabled">查詢停用</option>
                                            </select>
                                        </div>

                                        <div class="input-group input-group-sm mr-2" style="width: 160px;"> <input id="idSearchInput" type="text" class="form-control" placeholder="依ID查詢">
                                            <div class="input-group-append">
                                                <button id="idSearchBtn" type="button" class="btn btn-default">
                                                    <i class="fas fa-search"></i>
                                                </button>
                                            </div>
                                        </div>

                                        <div class="input-group input-group-sm" style="width: 160px;"> <input id="fuzzySearchInput" type="text" class="form-control" placeholder="依姓名查詢">
                                            <div class="input-group-append">
                                                <button id="fuzzySearchBtn" type="button" class="btn btn-default">
                                                    <i class="fas fa-search"></i>
                                                </button>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                                <div class="card-body">
                                    <table id="example2" class="table table-bordered table-hover">
                                        <thead>
                                            <tr>
                                                <th style="width: 5%">ID</th>
                                                <th style="width: 8%">大頭貼</th>
                                                <th style="width: 15%">Email</th>
                                                <th style="width: 10%">姓名</th>
                                                <th style="width: 5%">性別</th>
                                                <th style="width: 10%">生日</th>
                                                <th style="width: 10%">電話</th>
                                                <th>地址</th>
                                                <th style="width: 8%">會員幣</th>
                                                <th style="width: 8%">狀態</th>
                                                <th style="width: 12%" class="text-center">變更</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            </tbody>
                                    </table>
                                </div>
                                </div>
                            </div>
                    </div>
                </div>
            </section>
            </div>
        </div>
    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    
    <script src="../../plugins/datatables/jquery.dataTables.min.js"></script>
    <script src="../../plugins/datatables-bs4/js/dataTables.bootstrap4.min.js"></script>
    <script src="../../plugins/datatables-responsive/js/dataTables.responsive.min.js"></script>
    <script src="../../plugins/datatables-responsive/js/responsive.bootstrap4.min.js"></script>
    
    <script src="../../dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script src="../../dist/js/admin-layout.js"></script>

    <script>
        $(function () {
            // 1. 初始化 DataTable
            const dataTableConfig = {
                "paging": true,
                "lengthChange": false,
                "searching": false,
                "ordering": true,
                "info": true,
                "autoWidth": false,
                "responsive": true,
                "language": { "url": "https://cdn.datatables.net/plug-ins/1.11.3/i18n/zh_Hant.json" },
                "dom": '<"row"<"col-sm-12"t>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7 d-flex justify-content-end"p>>'
            };

            $('#example2').DataTable(dataTableConfig);

            function clearOthers(currentId) {
                if (currentId !== 'statusSelect') $('#statusSelect').val('all');
                if (currentId !== 'idSearchInput') $('#idSearchInput').val('');
                if (currentId !== 'fuzzySearchInput') $('#fuzzySearchInput').val('');
            }
            
            // 2. 查詢全部、啟用中、停用
            $('#statusSelect').on('change', function () {
                const status = $(this).val();
                clearOthers('statusSelect');
                loadMembersByStatus(status);
            });

            function loadMembersByStatus(status = 'all') {
                const url = (status === 'all') ? '/members' : `/members?status=${status}`;
                $.ajax({
                    url: url,
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        renderTable(data);
                    },
                    error: function (xhr) {
                        Swal.fire('錯誤', '資料載入失敗', 'error');
                    }
                });
            }

            // 3. 依 ID 查詢
            $('#idSearchBtn').on('click', function (e) {
                e.preventDefault();
                const id = $('#idSearchInput').val().trim();
                if (!id) return Swal.fire('提示', '請輸入 ID', 'info');

                clearOthers('idSearchInput');
                $.ajax({
                    url: `/members/${id}`,
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        if (data) {
                            renderTable([data]);
                        } else {
                            Swal.fire('提示', '查無此會員', 'info');
                        }
                    },
                    error: function () {
                        Swal.fire('提示', '查無此會員', 'info');
                    }
                });
            });

            // 4. 模糊查詢
            $('#fuzzySearchBtn').on('click', function (e) {
                e.preventDefault();
                const name = $('#fuzzySearchInput').val().trim();
                if (!name) return Swal.fire('提示', '請輸入姓名', 'info');

                clearOthers('fuzzySearchInput');
                $.ajax({
                    url: `/members/search`,
                    method: 'GET',
                    data: { name: name },
                    dataType: 'json',
                    success: function (data) {
                        renderTable(data);
                    }
                });
            });

            // 5. 修改按鈕
            $(document).on('click', '.btn-edit', function (e) {
                e.preventDefault();
                const id = $(this).data("id");
                window.location.href = `MemberUpdate.html?memberId=${id}`;
            });

            // 6. 停用啟用 (SweetAlert 版)
            $(document).on('click', '.btn-toggle-status', function (e) {
                e.preventDefault();
                const id = $(this).data('id');
                const currentStatus = $(this).data('status');
                const actionText = currentStatus === 'active' ? '停用' : '啟用';

                Swal.fire({
                    title: `確定要${actionText}嗎？`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#be8754',
                    cancelButtonColor: '#d33',
                    confirmButtonText: '確定',
                    cancelButtonText: '取消'
                }).then((result) => {
                    if (result.isConfirmed) {
                        $.ajax({
                            url: `/members/${id}/toggle`,
                            method: 'PATCH',
                            success: function (success) {
                                if (success) {
                                    Swal.fire('成功', '狀態已更新', 'success');
                                    const status = $('#statusSelect').val();
                                    loadMembersByStatus(status);
                                } else {
                                    Swal.fire('失敗', '操作失敗', 'error');
                                }
                            },
                            error: function (xhr) {
                                Swal.fire('錯誤', '連線異常', 'error');
                            }
                        });
                    }
                });
            });

            // 7. 更新表格 (Render)
            function renderTable(list) {
                const table = $('#example2');
                if ($.fn.DataTable.isDataTable(table)) {
                    table.DataTable().clear().destroy();
                }
                const tbody = $('#example2 tbody');
                tbody.empty();

                if (!list || list.length === 0) {
                    table.DataTable(dataTableConfig);
                    return;
                }

                list.forEach(item => {
                    const actionText = item.status === 'active' ? '停用' : '啟用';
                    const btnClass = item.status === 'active' ? 'btn-danger' : 'btn-success'; 
                    // 放大圖片
                    const picUrl = item.picture ? item.picture : '../../dist/img/default-150x150.png';

                    tbody.append(`
                    <tr>
                        <td>${item.memberId}</td>
                        <td>
                            <img src="${picUrl}" 
                                 alt="avatar" 
                                 class="shadow-sm"
                                 style="width:50px; height:50px; border-radius:50%; object-fit:cover; border: 2px solid #fff;">
                        </td>
                        <td>${item.email}</td>
                        <td>${item.name}</td>
                        <td>${item.gender}</td>
                        <td>${item.birthday || ''}</td>
                        <td>${item.phone || ''}</td>
                        <td>${item.address || ''}</td>
                        <td>${item.points}</td>
                        <td>
                            <span class="badge ${item.status === 'active' ? 'badge-success' : 'badge-secondary'}">
                                ${item.status}
                            </span>
                        </td>
                        <td class="text-center">
                            <button class="btn btn-info btn-sm btn-edit mr-1" data-id="${item.memberId}">
                                <i class="fas fa-pencil-alt"></i> 修改
                            </button>
                            <button class="btn ${btnClass} btn-sm btn-toggle-status" data-id="${item.memberId}" data-status="${item.status}">
                                <i class="fas fa-power-off"></i> ${actionText}
                            </button>
                        </td>
                    </tr>
                `);
                });

                table.DataTable(dataTableConfig);
            }

            loadMembersByStatus('all');
        });
    </script>
</body>

</html>
