    <script>
        $(function () {
            // 1. 從 sessionStorage 取得剛新增成功的資料
            const dataString = sessionStorage.getItem('lastCreatedCoupon');
            
            if (!dataString) {
                alert("查無新增資料，將回列表頁");
                window.location.href = 'CouponQueryAll.html';
                return;
            }

            const data = JSON.parse(dataString);

            // 2. 填充資料
            $('#res-couponId').text(data.couponId);
            $('#res-code').text(data.code);
            
            // 折扣類型顯示優化
            const typeText = data.discountType === 'percent' ? '百分比折扣' : '固定金額折扣';
            $('#res-discountType').text(typeText);
            
            // 折扣值顯示 (若是百分比則顯示例如 0.8)
            $('#res-discountValue').text(data.discountValue);
            
            // 發放量顯示
            $('#res-totalAmount').text(data.isLimited === 1 ? data.totalAmount : '不限量');
            
            $('#res-minPurchase').text(data.minPurchase);
            $('#res-issueStartAt').text(data.issueStartAt);
            $('#res-issueEndAt').text(data.issueEndAt);
            $('#res-useStartAt').text(data.useStartAt);
            $('#res-useEndAt').text(data.useEndAt);
        });
    </script>
