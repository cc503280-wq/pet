<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>會員收藏清單 | 管理中心</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../../dist/css/adminlte.min.css">
    
    <link rel="stylesheet" href="../../plugins/datatables-bs4/css/dataTables.bootstrap4.min.css">
    <link rel="stylesheet" href="../../plugins/datatables-responsive/css/responsive.bootstrap4.min.css">
    
    <link rel="stylesheet" href="../../dist/css/admin-custom.css">

    <style>
        .box1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .disabled-btn {
            pointer-events: none !important;
            opacity: 0.5;
            cursor: not-allowed !important;
        }
        
        /* 一般表格設定 (移除強制不換行，允許自然斷行，因為欄位很少) */
        #example2 td, #example2 th {
            vertical-align: middle !important;
            text-align: center !important;
        }
    </style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
    <div class="wrapper">
        
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-12 box1">
                            <h1>會員管理</h1>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-12">
                            <div class="card card-outline card-primary">
                                <div class="card-header d-flex flex-wrap align-items-center">
                                    <h3 class="card-title me-auto mb-2 mb-md-0">會員收藏列表</h3>

                                    <div class="d-flex flex-wrap align-items-center ml-auto" style="gap: 0.5rem;">
                                        <a href="FavoritesQueryAll.html" class="btn btn-theme-action btn-sm mr-2">
                                            <i class="fas fa-sync-alt"></i> 查詢全部
                                        </a>

                                        <div class="input-group mr-2" style="width: 180px;">
                                            <input id="memberIdInput" type="text" class="form-control" placeholder="依會員ID">
                                            <div class="input-group-append">
                                                <button id="memberIdSearchBtn" class="btn btn-default">
                                                    <i class="fas fa-search"></i>
                                                </button>
                                            </div>
                                        </div>

                                        <div class="input-group mr-2" style="width: 180px;">
                                            <input id="productIdInput" type="text" class="form-control" placeholder="依商品ID">
                                            <div class="input-group-append">
                                                <button id="productIdSearchBtn" class="btn btn-default">
                                                    <i class="fas fa-search"></i>
                                                </button>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                                <div class="card-body">
                                    <table id="example2" class="table table-bordered table-hover">
                                        <thead>
                                            <tr>
                                                <th style="width: 10%">收藏ID</th>
                                                <th style="width: 15%">會員ID</th>
                                                <th style="width: 15%">商品ID</th>
                                                <th style="width: 40%">商品名稱</th>
                                                <th style="width: 20%">商品價格</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    
    <script src="../../plugins/datatables/jquery.dataTables.min.js"></script>
    <script src="../../plugins/datatables-bs4/js/dataTables.bootstrap4.min.js"></script>
    <script src="../../plugins/datatables-responsive/js/dataTables.responsive.min.js"></script>
    <script src="../../plugins/datatables-responsive/js/responsive.bootstrap4.min.js"></script>
    
    <script src="../../dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script src="../../dist/js/admin-layout.js"></script>

    <script>
        $(function () {
            // 初始化 DataTable (無捲軸，自動適應)
            const dataTableConfig = {
                "paging": true,
                "lengthChange": false,
                "searching": false,
                "ordering": true,
                "info": true,
                "autoWidth": false, // 關閉自動寬度，由 CSS 控制
                "responsive": true, // 開啟響應式
                "language": { "url": "https://cdn.datatables.net/plug-ins/1.11.3/i18n/zh_Hant.json" },
                "dom": '<"row"<"col-sm-12"t>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7 d-flex justify-content-end"p>>'
            };

            $('#example2').DataTable(dataTableConfig);

            function clearOthers(currentId) {
                if (currentId !== 'productIdInput') $('#productIdInput').val('');
                if (currentId !== 'memberIdInput') $('#memberIdInput').val('');
            }
            
            // 依商品 ID 查詢
            $('#productIdSearchBtn').on('click', function (e) {
                e.preventDefault();
                const productId = $('#productIdInput').val().trim();
                if (!productId) return Swal.fire('提示', '請輸入商品 ID', 'info');

                clearOthers('productIdInput');
                $.ajax({
                    url: `/favorites/product/${productId}`,
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        renderTable(data);
                    },
                    error: function (xhr) {
                        Swal.fire('錯誤', '查詢商品收藏失敗', 'error');
                    }
                });
            });

            // 依會員 ID 查詢
            $('#memberIdSearchBtn').on('click', function (e) {
                e.preventDefault();
                const memberId = $('#memberIdInput').val().trim();
                if (!memberId) return Swal.fire('提示', '請輸入會員 ID', 'info');

                clearOthers('memberIdInput');
                $.ajax({
                    url: `/favorites/member/${memberId}`,
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        renderTable(data);
                    },
                    error: function (xhr) {
                        Swal.fire('提示', xhr.responseText || '查無收藏資料', 'info');
                    }
                });
            });

            // 更新表格
            function renderTable(list) {
                const table = $('#example2');
                if ($.fn.DataTable.isDataTable(table)) {
                    table.DataTable().clear().destroy();
                }
                const tbody = $('#example2 tbody');
                tbody.empty();

                // 確保是陣列
                const dataList = Array.isArray(list) ? list : (list ? [list] : []);

                dataList.forEach(item => {
                    tbody.append(`
                        <tr>
                            <td>${item.favoriteId}</td>
                            <td>${item.memberId}</td>
                            <td>${item.productId}</td>
                            <td class="text-left" style="text-align: left !important;">${item.productName}</td> <td>NT$ ${item.price}</td>
                        </tr>
                    `);
                });

                table.DataTable(dataTableConfig);
            }

            // 頁面載入就查詢全部
            function loadAllFavorites() {
                $.ajax({
                    url: '/favorites',
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        renderTable(data);
                    },
                    error: function (xhr) {
                        console.error(xhr.responseText);
                        Swal.fire('錯誤', '無法載入收藏列表', 'error');
                    }
                });
            }

            loadAllFavorites();
        });
    </script>
</body>

</html>
