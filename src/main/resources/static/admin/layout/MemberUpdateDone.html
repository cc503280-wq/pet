<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MemberUpdateDone</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../../dist/css/adminlte.min.css">
    
    <style type="text/css">
        .brand-link { display: flex; align-items: center; justify-content: flex-start; padding: 0.5rem 1rem; }
        .sidebar-collapse .brand-link { justify-content: center; }
        .brand-link i { width: 1.5rem; text-align: center; }
        .sidebar-collapse .brand-text { display: none; }
        .box1 { display: flex; justify-content: space-between; align-items: center; }
        .form-control-static { padding-top: 7px; margin-bottom: 0; font-weight: 500; }
        .box2 { display: flex; justify-content: center; align-items: center; }
    </style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
    <div class="wrapper">
        <nav class="main-header navbar navbar-expand navbar-white navbar-light">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
                </li>
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a href="../../AdminLogoutServlet" class="btn btn-secondary btn-sm"><i class="fas fa-sign-out-alt"></i> 登出</a>
                </li>
            </ul>
        </nav>

        <aside class="main-sidebar sidebar-dark-primary elevation-4">
            <a href="../../index3.html" class="brand-link">
                <i class="fas fa-paw" style="color: #FFD43B; font-size: 1.5rem;"></i>
                <span class="brand-text font-weight-light"></span>
            </a>
            </aside>

        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-12 box1">
                            <h1>會員管理</h1>
                            <a href="MemberQueryAll.html" class="btn btn-secondary btn-sm">回列表</a>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid d-flex justify-content-center">
                    <div class="row w-100 box2">
                        <div class="col-md-6">
                            <div class="card card-info">
                                <div class="card-header">
                                    <h3 class="card-title">修改資料檢視</h3>
                                </div>
                                
                                <div class="alert alert-success mx-4 mt-3 py-2">
                                    <i class="icon fas fa-check-circle"></i>
                                    <strong>修改成功!</strong>
                                </div>

                                <div class="card-body">
                                    <div class="form-group row justify-content-center mb-4">
                                        <img id="show-picture" src="https://via.placeholder.com/120" alt="大頭貼" class="rounded-circle" 
                                            style="width:120px; height:120px; object-fit:cover; border:2px solid #FFD43B;">
                                    </div>

                                    <div class="form-group row">
                                        <label class="col-sm-4 col-form-label text-right">ID:</label>
                                        <div class="col-sm-8"><p id="show-id" class="form-control-static">-</p></div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-sm-4 col-form-label text-right">姓名:</label>
                                        <div class="col-sm-8"><p id="show-name" class="form-control-static">-</p></div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-sm-4 col-form-label text-right">性別:</label>
                                        <div class="col-sm-8"><p id="show-gender" class="form-control-static">-</p></div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-sm-4 col-form-label text-right">生日:</label>
                                        <div class="col-sm-8"><p id="show-birthday" class="form-control-static">-</p></div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-sm-4 col-form-label text-right">Email:</label>
                                        <div class="col-sm-8"><p id="show-email" class="form-control-static">-</p></div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-sm-4 col-form-label text-right">電話:</label>
                                        <div class="col-sm-8"><p id="show-phone" class="form-control-static">-</p></div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-sm-4 col-form-label text-right">地址:</label>
                                        <div class="col-sm-8"><p id="show-address" class="form-control-static">-</p></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../dist/js/adminlte.min.js"></script>

    <script>
        $(function () {
            // 從 sessionStorage 取得修改後的資料
            const memberData = sessionStorage.getItem('updatedMember');

            if (memberData) {
                const member = JSON.parse(memberData);

                // 填入資料
                $('#show-id').text(member.memberId);
                $('#show-name').text(member.name);
                $('#show-gender').text(member.gender === 'M' ? '男' : '女');
                $('#show-birthday').text(member.birthday || '未設定');
                $('#show-email').text(member.email);
                $('#show-phone').text(member.phone || '無');
                $('#show-address').text(member.address || '無');

                // 處理大頭貼
                if (member.picture) {
                    $('#show-picture').attr('src', member.picture);
                }
            } else {
                // 如果沒資料就踢回列表
                alert('查無更新紀錄');
                window.location.href = 'MemberQueryAll.html';
            }
        });
    </script>
</body>
</html>
