<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>會員寵物資料 | 管理中心</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../../dist/css/adminlte.min.css">
    
    <link rel="stylesheet" href="../../plugins/datatables-bs4/css/dataTables.bootstrap4.min.css">
    <link rel="stylesheet" href="../../plugins/datatables-responsive/css/responsive.bootstrap4.min.css">
    
    <link rel="stylesheet" href="../../dist/css/admin-custom.css">

    <style>
        /* --- 頁面專屬樣式 --- */
        .box1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .disabled-btn {
            pointer-events: none !important;
            opacity: 0.5;
            cursor: not-allowed !important;
        }
        
        /* DataTable 置中與放大 */
        #example2 td, #example2 th {
            text-align: center !important;
            vertical-align: middle !important;
            font-size: 1.15rem !important; /* 放大表格文字 */
            padding: 12px 8px; /* 增加舒適間距 */
        }

        /* --- 簡報模式：全域放大設定 --- */
        body { font-size: 1.1rem; }
        h1 { font-size: 2.2rem; }
        .card-title { font-size: 1.4rem !important; }

        /* 輸入框與下拉選單放大 */
        .form-control, .custom-select {
            font-size: 1.1rem !important;
            height: calc(2.5rem + 2px) !important;
        }

        /* 按鈕放大 */
        .btn-sm {
            font-size: 1rem !important;
            padding: 6px 12px !important;
        }

        /* 表格分頁按鈕放大 */
        .page-link {
            font-size: 1.1rem !important;
            padding: 8px 12px !important;
        }
    </style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
    <div class="wrapper">
        
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-12 box1">
                            <h1>會員管理</h1>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-12">
                            <div class="card card-outline card-primary">
                                <div class="card-header d-flex flex-wrap align-items-center"> <h3 class="card-title me-auto mb-2 mb-md-0">寵物列表</h3>

                                    <div class="d-flex flex-wrap align-items-center ml-auto" style="gap: 0.5rem;">
                                        <a href="MemberPetQueryAll.html" class="btn btn-theme-action btn-sm mr-2">
                                            <i class="fas fa-sync-alt"></i> 查詢全部
                                        </a>
                                        
                                        <div class="input-group input-group-sm mr-2" style="width: 170px;">
                                            <input id="petIdInput" type="text" class="form-control" placeholder="依寵物ID">
                                            <div class="input-group-append">
                                                <button id="petIdSearchBtn" class="btn btn-default">
                                                    <i class="fas fa-search"></i>
                                                </button>
                                            </div>
                                        </div>
                                        
                                        <div class="input-group input-group-sm mr-2" style="width: 170px;">
                                            <input id="memberIdInput" type="text" class="form-control" placeholder="依會員ID">
                                            <div class="input-group-append">
                                                <button id="memberIdSearchBtn" class="btn btn-default">
                                                    <i class="fas fa-search"></i>
                                                </button>
                                            </div>
                                        </div>
                                        
                                        <div class="input-group input-group-sm mr-2" style="width: 130px;">
                                            <select id="typeSelect" class="form-control">
                                                <option value="">所有種類</option>
                                                <option value="狗">狗</option>
                                                <option value="貓">貓</option>
                                                <option value="其他">其他</option>
                                            </select>
                                        </div>

                                        <div class="input-group input-group-sm mr-2" style="width: 130px;">
                                            <select id="ageSelect" class="form-control">
                                                <option value="">所有年齡</option>
                                                <option value="幼年">幼年</option>
                                                <option value="成年">成年</option>
                                                <option value="老年">老年</option>
                                            </select>
                                        </div>

                                        <div class="input-group input-group-sm mr-2" style="width: 130px;">
                                            <select id="sizeSelect" class="form-control">
                                                <option value="">所有體型</option>
                                                <option value="小型">小型</option>
                                                <option value="中型">中型</option>
                                                <option value="大型">大型</option>
                                            </select>
                                        </div>

                                        <button id="searchBtn" class="btn btn-default btn-sm">
                                            <i class="fas fa-filter"></i> 篩選
                                        </button>

                                    </div>
                                </div>
                                <div class="card-body">
                                    <table id="example2" class="table table-bordered table-hover">
                                        <thead>
                                            <tr>
                                                <th style="width: 10%">寵物ID</th>
                                                <th style="width: 10%">會員ID</th>
                                                <th style="width: 20%">寵物名</th>
                                                <th style="width: 15%">種類</th>
                                                <th style="width: 15%">品種</th>
                                                <th style="width: 15%">年齡</th>
                                                <th style="width: 15%">體型</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            </tbody>
                                    </table>
                                </div>
                                </div>
                            </div>
                    </div>
                </div>
            </section>
            </div>
        </div>
    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    
    <script src="../../plugins/datatables/jquery.dataTables.min.js"></script>
    <script src="../../plugins/datatables-bs4/js/dataTables.bootstrap4.min.js"></script>
    <script src="../../plugins/datatables-responsive/js/dataTables.responsive.min.js"></script>
    <script src="../../plugins/datatables-responsive/js/responsive.bootstrap4.min.js"></script>
    
    <script src="../../dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script src="../../dist/js/admin-layout.js"></script>

    <script>
        $(function () {
            // 1. 初始化 DataTable (加入中文語系與禁止自動寬度)
            const dataTableConfig = {
                "paging": true,
                "lengthChange": false,
                "searching": false,
                "ordering": true,
                "info": true,
                "autoWidth": false, 
                "responsive": true,
                "language": { "url": "https://cdn.datatables.net/plug-ins/1.11.3/i18n/zh_Hant.json" },
                "dom": '<"row"<"col-sm-12"t>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7 d-flex justify-content-end"p>>'
            };

            $('#example2').DataTable(dataTableConfig);

            // 清空其他搜尋欄位的函式 (邏輯保留)
            function clearOthers(currentGroup) {
                if (currentGroup !== 'petId') $('#petIdInput').val('');
                if (currentGroup !== 'memberId') $('#memberIdInput').val('');
                if (currentGroup !== 'filters') {
                    $('#typeSelect').val('');
                    $('#ageSelect').val('');
                    $('#sizeSelect').val('');
                }
            }
            
            // 2. 寵物 ID 查詢
            $('#petIdSearchBtn').on('click', function (e) {
                e.preventDefault();
                const petId = $('#petIdInput').val().trim();
                if (!petId) return Swal.fire('提示', '請輸入寵物 ID', 'info');

                clearOthers('petId');
                $.ajax({
                    url: `/memberPets/${petId}`,
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        if (data) {
                            renderTable([data]);
                        } else {
                            Swal.fire('提示', '查無此寵物', 'info');
                            renderTable([]);
                        }
                    },
                    error: function (xhr) {
                        Swal.fire('錯誤', '查詢出錯', 'error');
                    }
                });
            });

            // 3. 會員 ID 查詢
            $('#memberIdSearchBtn').on('click', function (e) {
                e.preventDefault();
                const memberId = $('#memberIdInput').val().trim();
                if (!memberId) return Swal.fire('提示', '請輸入會員 ID', 'info');

                clearOthers('memberId');
                $.ajax({
                    url: `/memberPets/member/${memberId}`,
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        renderTable(data);
                    },
                    error: function (xhr) {
                        Swal.fire('錯誤', '查詢會員寵物失敗', 'error');
                    }
                });
            });

            // 4. 複合條件查詢
            $('#searchBtn').on('click', function () {
                clearOthers('filters');
                $.ajax({
                    url: '/memberPets/search',
                    method: 'GET',
                    data: {
                        petType: $('#typeSelect').val(),
                        petAge: $('#ageSelect').val(),
                        petSize: $('#sizeSelect').val()
                    },
                    success: function (data) {
                        renderTable(data);
                    },
                    error: function (xhr) {
                        Swal.fire('錯誤', '條件查詢失敗', 'error');
                    }
                });
            });

            // 5. 更新表格 (Render)
            function renderTable(list) {
                const table = $('#example2');
                if ($.fn.DataTable.isDataTable(table)) {
                    table.DataTable().clear().destroy();
                }
                const tbody = $('#example2 tbody');
                tbody.empty();

                if (list && list.length > 0) {
                    list.forEach(item => {
                        tbody.append(`
                            <tr>
                                <td>${item.petId}</td>
                                <td>${item.member ? item.member.memberId : '無'}</td>
                                <td>${item.petName}</td>
                                <td>
                                    <span class="badge badge-info" style="font-size: 1rem;">${item.petType}</span>
                                </td>
                                <td>${item.petBreed}</td>
                                <td>${item.petAge}</td>
                                <td>${item.petSize}</td>
                            </tr>
                        `);
                    });
                }

                table.DataTable(dataTableConfig);
            }

            // 6. 頁面載入就查詢全部
            function loadAllPets() {
                $.ajax({
                    url: '/memberPets',
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        renderTable(data);
                    },
                    error: function (xhr) {
                        console.error("載入全部寵物失敗");
                    }
                });
            }

            loadAllPets();
        });
    </script>
</body>

</html>
