<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新增完成 | 管理中心</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../../dist/css/adminlte.min.css">
    
    <link rel="stylesheet" href="../../dist/css/admin-custom.css">

    <style>
        /* 標題區塊排版 */
        .box1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 成功頁面專屬樣式 */
        .success-icon {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 1rem;
        }
        
        .data-row {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .data-row:last-child {
            border-bottom: none;
        }
        
        .data-label {
            font-weight: 600;
            color: #6c757d;
        }
        
        .data-value {
            font-weight: 500;
            color: #343a40;
        }
    </style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
    <div class="wrapper">
        
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-12 box1">
                            <h1>新增管理員</h1>
                            <a href="AdminQueryAll.html" class="btn btn-default btn-sm shadow-sm border">
                                <i class="fas fa-arrow-left mr-1"></i> 回列表
                            </a>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    <div class="row justify-content-center"> 
                        <div class="col-md-6"> 
                            
                            <div class="card card-outline card-success shadow-lg">
                                <div class="card-body text-center pt-5 pb-5"> <div class="mb-4">
                                        <i class="fas fa-check-circle success-icon"></i>
                                        <h3 class="text-success font-weight-bold">新增成功！</h3>
                                        <p class="text-muted">該管理員帳號已建立完成。</p>
                                    </div>

                                    <div class="text-left bg-light p-4 rounded mb-5 mx-auto" style="max-width: 400px;">
                                        <div class="row data-row">
                                            <div class="col-4 data-label">ID</div>
                                            <div class="col-8 data-value" id="showAdminId">Loading...</div>
                                        </div>
                                        <div class="row data-row">
                                            <div class="col-4 data-label">姓名</div>
                                            <div class="col-8 data-value" id="showName">Loading...</div>
                                        </div>
                                        <div class="row data-row">
                                            <div class="col-4 data-label">Email</div>
                                            <div class="col-8 data-value" id="showEmail">Loading...</div>
                                        </div>
                                        <div class="row data-row">
                                            <div class="col-4 data-label">電話</div>
                                            <div class="col-8 data-value" id="showPhone">Loading...</div>
                                        </div>
                                        <div class="row data-row">
                                            <div class="col-4 data-label">權限</div>
                                            <div class="col-8 data-value">
                                                <span id="showRoleBadge" class="badge badge-primary">Admin</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <a href="AdminCreate.html" class="btn btn-theme-action px-5 shadow-sm">
                                            <i class="fas fa-plus mr-1"></i> 繼續新增
                                        </a>
                                    </div>

                                </div>
                            </div>
                            
                        </div>
                    </div>
                </div>
            </section>
        </div>

    </div>

    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    
    <script src="../../dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script src="../../dist/js/admin-layout.js"></script>

    <script>
        $(function () {
            const newAdminData = sessionStorage.getItem('newAdmin');

            if (newAdminData) {
                const admin = JSON.parse(newAdminData);

                // 填入資料
                $('#showAdminId').text(admin.adminId);
                $('#showName').text(admin.name);
                $('#showEmail').text(admin.email);
                $('#showPhone').text(admin.phone || '未填寫');
                
                // 權限徽章處理
                const roleText = (admin.role === 'super_admin') ? '超級管理員' : '一般管理員';
                const roleClass = (admin.role === 'super_admin') ? 'badge-danger' : 'badge-primary';
                
                $('#showRoleBadge')
                    .text(roleText)
                    .removeClass('badge-primary')
                    .addClass(roleClass);

            } else {
                Swal.fire({
                    icon: 'warning',
                    title: '無資料',
                    text: '查無新增資料，將導回列表頁。',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'AdminQueryAll.html';
                });
            }
        });
    </script>
</body>

</html>
