        display: flex;

      }
      /* 收起 sidebar 時，icon 置中 */

        justify-content: center;
      }

      /* 調整 icon 與文字間距 */

        width: 1.5rem;
        /* 固定寬度讓文字距離固定 */

      }

      /* 收起 sidebar 時文字隱藏 */

      .box1 {

      }

        background-color: green;

      .remove-btn {

      .btn:disabled {

        opacity: 0.6;

      /* DataTable 所有欄位水平 + 垂直置中 */

      #example2 th {

      .badge-start { background-color: #007bff; }

    <!-- InsertModal -->
    <div class="modal fade" id="Modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">新增美容師</h5>
            <button
              type="button"
              class="close"
              data-dismiss="modal"
              aria-label="Close"
            >
              <span>&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <form id="Form">
              <input type="hidden" id="modalGroomerId" />

              <div class="form-group">
                <label>美容師名稱</label>
                <input
                  type="text"
                  class="form-control"
                  id="modalGroomerName"
                  required
                />
              </div>

              <div class="form-group">
                <label>電話</label>
                <input
                  type="tel"
                  class="form-control"
                  id="modalGroomerPhone"
                  required
                />
              </div>

              <div class="form-group">
                <label>E-mail</label>
                <input
                  type="email"
                  class="form-control"
                  id="modalGroomerEmail"
                  required
                />
              </div>

              <div class="form-group">
                <label>密碼</label>
                <input
                  type="password"
                  class="form-control"
                  id="modalGroomerPassword"
                  required
                />
              </div>

              <div class="form-group row">
                <label class="col-sm-2 col-form-label">入職日期</label>
                <div class="form-group col-md-6">
                  <input class="form-control" type="date" id="hiredateInput" />
                </div>
              </div>

              <div class="form-group">
                <label>美容師圖片</label>
                <input
                  type="file"
                  class="form-control-file"
                  id="modalImageFile"
                  accept="image/*"
                  onchange="previewImage()"
                />
                <div class="mt-2">
                  <img
                    id="modalImagePreview"
                    src=""
                    style="max-width: 200px; display: none"
                    class="img-thumbnail"
                  />
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-dismiss="modal"
            >
              取消
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="submitInfo()"
            >
              儲存

    <!-- Page specific script -->
    <script>
      $(function () {
        initDataTable();
        loadAllData();
        initDatePickers();
        handleStatusButtonClick();

        // 新增美容師時，Email 輸入同步帶入密碼
        $("#modalGroomerEmail").on("input", function () {
          // 判斷隱藏欄位 ID 是否為空，空代表是新增模式
          if (!$("#modalGroomerId").val()) {
            $("#modalGroomerPassword").val($(this).val());
          }
        });
      });

      const GROOMER_API = "/groomers";
      const GROOMER_SEARCH_API = `${GROOMER_API}/search`;
      const IMAGE_BASE_URL = "";

      // 初始化 DataTables 設定
      function initDataTable() {
        if ($.fn.DataTable.isDataTable("#example2")) {
          $("#example2").DataTable().destroy();
        }
        $("#example2").DataTable({
          paging: true,
          lengthChange: false,
          searching: false,
          ordering: true,
          info: true,
          autoWidth: true,
          responsive: true,
          // 設定 DataTables 的 DOM 結構，控制搜尋框和分頁位置
          dom: '<"row"<"col-sm-12"t>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7 d-flex justify-content-end"p>>',
        });
      }

      // 載入所有美容師資料
      function loadAllData() {
        $.ajax({
          url: `${GROOMER_API}`,
          type: "GET",
          dataType: "json",
          success: function (data) {
            renderTable(data);
          },
          error: function (xhr) {
            console.error("Error:", xhr);
            Swal.fire({
              icon: "error",
              title: "失敗",
              text: "無法載入資料，請確認後端 Server 是否啟動！",
            });
          },
        });
      }

      // 渲染表格內容
      function renderTable(dataList) {
        let currentPage = 0;
        // 若表格已存在，先記住當前頁碼
        if ($.fn.DataTable.isDataTable("#example2")) {
          currentPage = $("#example2").DataTable().page();
          $("#example2").DataTable().destroy();
        }

        const tbody = $("#example2 tbody");
        tbody.empty();

        dataList.forEach(function (g) {
          let isRemove = g.isActive == 0;
          
          // 設定按鈕固定寬度樣式
          const btnStyle = 'width: 80px;';

          let fireBtnHtml = "";

          // 根據在職狀態渲染不同按鈕
          if (isRemove) {
            fireBtnHtml = `
   	                <button class="btn btn-secondary btn-sm put-btn" style="${btnStyle}" disabled>
   	                  已開除
   	                </button>`;
          } else {
            fireBtnHtml = `
                    <button class="btn btn-danger btn-sm remove-btn" data-id="${g.groomerId}" style="${btnStyle}">
                      開除
                    </button>`;
          }

          let editBtnDisabled = isRemove ? "disabled" : "";

          const tr = `
                         <tr>
                            <td>${g.groomerId}</td>
                             <td>
                                <img src="${g.picture ? g.picture : '../../dist/img/default-150x150.png'}" 
                                     alt="avatar" 
                                     style="width:40px; height:40px; border-radius:50%; object-fit:cover;"
                                     onerror="this.src='../../dist/img/default-150x150.png'">
                             </td>
							<td>${g.groomerName}</td>
                            <td>${g.phone}</td>
                            <td>${g.email}</td>
							<td>*****</td>
                            <td>${g.hiredate}</td>				
							<td>${g.isActive ? "在職" : "離職"}</td>
                            <td class="text-center">
								<div class="d-flex justify-content-center align-items-center" style="gap: 5px;">
									<button class="btn btn-secondary btn-sm" onclick="openEditModal(${
						g.groomerId
					})"${editBtnDisabled} style="${btnStyle}">
											<i class="fas fa-edit"></i> 修改
									</button>	
									${fireBtnHtml}
								</div>
                            </td>
                        </tr>
                    `;
          // 插入資料列
          tbody.append(tr);
        });

        // 重新初始化 DataTable
        initDataTable();

        // 恢復到之前的頁碼
        if (currentPage > 0) {
            $("#example2").DataTable().page(currentPage).draw('page');
        }
      }

      // 綁定搜尋按鈕事件
      $("#btnSearch").click(function () {
        doGroomerSearch();
      });

      // 綁定重置按鈕事件
      $("#btnReset").click(function () {
        $("#searchName").val("");
        $("#searchStatus").val("");
        $("#hireDateRange").val("");
        loadAllData();
      });

      // 初始化日期選擇器 (daterangepicker)
      function initDatePickers() {
        const pickerOptions = {
          autoUpdateInput: false,
          locale: {
            cancelLabel: "清除",
            applyLabel: "確定",
            format: "YYYY-MM-DD",
          },
        };

        $("#hireDateRange").daterangepicker(pickerOptions);

        $("#hireDateRange").on("apply.daterangepicker", function (ev, picker) {
          $(this).val(
            picker.startDate.format("YYYY-MM-DD") +
              " - " +
              picker.endDate.format("YYYY-MM-DD")
          );
        });

        $("#hireDateRange").on("cancel.daterangepicker", function (ev, picker) {
          $(this).val("");
        });
      }

      // --- 執行複合搜尋 ---
      function doGroomerSearch() {
        let name = $("#searchName").val().trim();
        let status = $("#searchStatus").val();
        let dateRange = $("#hireDateRange").val();

        let params = {};

        if (name) params.name = name;
        if (status) params.isActive = status;

        if (dateRange) {
          let dates = dateRange.split(" - ");
          params.startDate = dates[0];
          params.endDate = dates[1];
        }

        $.ajax({
          url: GROOMER_SEARCH_API,
          type: "GET",
          data: params,
          dataType: "json",
          success: function (data) {
            if (data.length === 0) {
              Swal.fire({
                icon: "error",
                title: "失敗",
                text: "查無符合條件的資料！",
              });
              renderTable([]); // 清空表格
            } else {
              renderTable(data);
            }
          },
          error: function (xhr) {
            console.error("搜尋失敗:", xhr);
            Swal.fire({
              icon: "error",
              title: "失敗",
              text: "搜尋發生錯誤！",
            });
          },
        });
      }

      // 開啟修改彈窗 (先從後端撈取詳細資料)
      function openEditModal(id) {
        $.ajax({
          url: GROOMER_API + "/" + id, // GET /groomers/{id}
          type: "GET",
          success: function (g) {
            // 填入資料到表單
            $("#modalGroomerId").val(g.groomerId);
            $("#modalGroomerName").val(g.groomerName);
            $("#modalGroomerPhone").val(g.phone);
            $("#modalGroomerEmail").val(g.email);
            // $("#modalGroomerPassword").val(g.password); // 原本是顯示雜湊
            $("#modalGroomerPassword").val("******"); // 改為顯示6個星號 (假密碼)
            $("#hiredateInput").val(g.hiredate).prop("disabled", true);

            // 處理圖片預覽
            $("#modalImageFile").val(""); // 清空檔案選擇器

            if (g.picture) {
              $("#modalImagePreview")
                .attr("src", IMAGE_BASE_URL + g.picture)
                .show();
            } else {
              $("#modalImagePreview").hide();
            }

            $("#modalTitle").text("修改美容師資料");
            $("#Modal").modal("show");
          },
          error: function (err) {
            Swal.fire({
              icon: "error",
              title: "失敗",
              text: "請查詢後端 Server 是否啟動！",
            });
          },
        });
      }

      // 開啟新增彈窗
      function openCreateModal() {
        $("#Form")[0].reset();
        $("#modalGroomerId").val("");
        $("#modalTitle").text("新增美容師");

        $("#modalImageFile").val(""); // 清空檔案欄位
        $("#modalImagePreview").attr("src", "").hide(); 

        let today = moment().format("YYYY-MM-DD");
        $("#hiredateInput").val(today).prop("disabled", false);

        $("#Modal").modal("show");
      }

      // 提交表單 (新增或修改)
      function submitInfo() {
        // --- 1. 表單驗證 Logic ---
        let name = $("#modalGroomerName").val().trim();
        let phone = $("#modalGroomerPhone").val().trim();
        let email = $("#modalGroomerEmail").val().trim();
        let pwd = $("#modalGroomerPassword").val().trim();
        let hDate = $("#hiredateInput").val();

        // 統一檢查必填欄位 (不分新增或修改)
        if (!name || !phone || !email || !hDate) {
             Swal.fire("錯誤", "請確實填寫所有資料 (姓名, 電話, Email, 入職日)", "warning");
             return; // 阻止送出
        }

        // 驗證手機格式 (台灣手機: 09開頭，共10碼)
        const phoneRegex = /^09\d{8}$/;
        if (!phoneRegex.test(phone)) {
            Swal.fire("錯誤", "手機號碼格式錯誤", "warning");
            return;
        }

        // 驗證 Email 格式
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            Swal.fire("錯誤", "Email 格式錯誤", "warning");
            return;
        }

        let id = $("#modalGroomerId").val();
        
        // 如果是新增模式 (沒有 ID)，必須檢查密碼與圖片
        if (!id) {
            if (!pwd) {
                Swal.fire("錯誤", "新增時請輸入密碼", "warning");
                return;
            }
        }
        // -------------------------

        // 1. 建立 FormData 物件以支援檔案上傳
        let formData = new FormData();

        // 2. 塞入欄位資料
        formData.append("groomerName", name);
        formData.append("phone", phone);
        formData.append("email", email);
        
        // 檢查密碼欄位，如果是 "******" (假密碼) 則不傳送，避免後端誤以為要修成該字串
        if (pwd !== "******") {
            formData.append("password", pwd);
        }

        formData.append("hiredate", hDate);

        // 處理圖片檔案
        const fileInput = $("#modalImageFile")[0];
        if (fileInput.files && fileInput.files[0]) {
          formData.append("file", fileInput.files[0]);
        }

        // 檢查 id 是否存在 (已在上方宣告並賦值)
        if (id) {
           formData.append("groomerId", id);
        }

        // 決定 API 路徑 (有無 ID 區分新增或修改)
        // 注意：GroomerController 的 save 邏輯可能統一處理了 insert/update
        let url = id ? GROOMER_API + "/update/" + id : GROOMER_API + "/insert";

        $.ajax({
          url: url,
          type: "POST", // 這裡使用 POST 配合 MultipartFile
          data: formData,
          processData: false, // 必須設為 false，避免 jQuery 處理 FormData
          contentType: false, // 必須設為 false，讓 Browser 自動加 Boundary
          success: function (res) {
            let msg = id ? "修改成功！" : "新增成功！";
            Swal.fire({
              icon: "success",
              title: "成功",
              text: msg,
            });

            $("#Modal").modal("hide");
            loadAllData();
          },
          error: function (xhr) {
            console.error(xhr);
            Swal.fire({
              icon: "error",
              title: "失敗",
              text: "儲存失敗：" + (xhr.responseText || "未知錯誤！"),
            });
          },
        });
      }

      // 圖片預覽功能
      function previewImage() {
        const fileInput = $("#modalImageFile")[0];
        const preview = $("#modalImagePreview");

        if (fileInput.files && fileInput.files[0]) {
          const reader = new FileReader();

          reader.onload = function (e) {
            preview.attr("src", e.target.result);
            preview.show(); 
          };

          reader.readAsDataURL(fileInput.files[0]);
        } else {
          preview.hide(); 
        }
      }

      // 綁定列表中的按鈕事件 (使用事件委派)
      function handleStatusButtonClick() {
        $(document).on("click", ".remove-btn", function (e) {
          e.preventDefault();
          let id = $(this).data("id");
          updateStatus(id, false); // false 代表停權/離職
        });
      }

      //呼叫後端更新狀態 API
      function updateStatus(id, isActive) {
        let actionText = isActive ? "復職" : "開除";

        Swal.fire({
          title: `確定要${actionText}這位美容師嗎？`,
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "確定",
          cancelButtonText: "取消",
        }).then((result) => {
          if (result.isConfirmed) {
            $.ajax({
              url: `${GROOMER_API}/${id}/status`,
              type: "PATCH",
              data: { isActive: false },
              success: function (res) {
                Swal.fire({
                  icon: "success",
                  title: "成功",
                  text: `${actionText}成功！`,
                });
                loadAllData();
              },
              error: function (xhr) {
                Swal.fire({
                  icon: "error",
                  title: "失敗",
                  text: "儲存失敗：" + (xhr.responseText || "未知錯誤！"),
                });

                console.error("Status Update Error:", xhr);
              },
            });
          }
        });
      }

      // ========== 美容師行為日誌 Modal ==========
      function openActionLogModal() {
        $('#actionLogModal').modal('show');
        loadActionLogs();

        // 綁定篩選器事件（只綁定一次）
        $('#actionTypeFilter').off('change').on('change', function() {
          loadActionLogs($(this).val());
        });
      }

      async function loadActionLogs(actionType = '') {
        try {
          let url = '/api/audit/actions';
          if (actionType) {
            url = `/api/audit/actions/type/${actionType}`;
          }

          const res = await $.getJSON(url);
          const tbody = $('#actionLogTable');
          tbody.empty();

          if (!res || res.length === 0) {
            tbody.html('<tr><td colspan="6" class="text-center text-muted">尚無操作日誌</td></tr>');
            return;
          }

          // 按時間倒序排列，取最近 50 筆
          const sorted = res.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 50);

          sorted.forEach(log => {
            const time = log.timestamp ? log.timestamp.replace('T', ' ').substring(0, 19) : '-';
            const groomerId = log.groomerId || '-';
            const groomerName = log.groomerName || '未知';
            // CHECK_IN 由管理員操作，不顯示美容師
            const groomer = log.actionType === 'CHECK_IN' ? '管理員操作' : `${groomerId}: ${groomerName}`;
            const actionBadge = getActionBadge(log.actionType);
            const ip = log.ipAddress || '-';
            const desc = log.details?.description || '-';

            // 組合對象資訊（會員/預約）- CHECK_IN, START, COMPLETE 都需要顯示
            let target = '-';
            if (log.actionType === 'CHECK_IN' || log.actionType === 'START' || log.actionType === 'COMPLETE') {
              const memberId = log.targetMemberId || log.details?.memberId || '-';
              const memberName = log.targetMemberName || log.details?.memberName || '未知';
              const petId = log.details?.petId || '-';
              const petName = log.details?.petName || '';
              const appointmentId = log.targetAppointmentId || log.details?.appointmentId || '-';
              target = `會員: ${memberName} (ID:${memberId})`;
              if (petName) target += `<br><small class="text-muted">寵物: ${petName} (ID:${petId}), 預約ID:${appointmentId}</small>`;
            }

            tbody.append(`
              <tr>
                <td>${time}</td>
                <td>${groomer}</td>
                <td>${actionBadge}</td>
                <td>${target}</td>
                <td><code>${ip}</code></td>
                <td>${desc}</td>
              </tr>
            `);
          });
        } catch (e) {
          console.error('loadActionLogs error:', e);
          $('#actionLogTable').html('<tr><td colspan="6" class="text-center text-danger">載入失敗</td></tr>');
        }
      }

      function getActionBadge(actionType) {
        const badges = {
          'LOGIN': '<span class="badge badge-login">登入</span>',
          'LOGOUT': '<span class="badge badge-logout">登出</span>',
          'CHECK_IN': '<span class="badge badge-check_in">會員報到</span>',
          'START': '<span class="badge badge-start">服務開始</span>',
          'COMPLETE': '<span class="badge badge-complete">服務完成</span>'
        };
        return badges[actionType] || `<span class="badge badge-secondary">${actionType}</span>`;
      }
    </script>
  </body>
</html>
