  <script>
    // 1. 全域變數定義區
    const GROOMER_LIST_API = "/groomers";
    const LEAVERECORD_API = `${GROOMER_LIST_API}/leave-records`;
    const BATCH_API = `${LEAVERECORD_API}/batch`; // 批量請假 API
    const SEARCH_API = "/groomers/leave-records/search";
    let allLeaveRecords = [];

    // 2. 頁面載入完成後執行 (jQuery Ready)
    $(function () {
      console.log("=== 頁面載入完成 (jQuery Ready) ===");

      // 初始化
      initDataTable();
      loadAllData();
      handleToggleStatus();
      loadGroomerOptions();
      initDatePickers();

      // 確保 doComplexSearch 已定義，移除重複呼叫
      // doComplexSearch(); 


      $("#btnSave").on("click", function () {
        console.log(">> 儲存按鈕被點擊了！");
        submitInfo();
      });

      $('#btnSearch').click(function () {
        doComplexSearch();
      });


      $('#btnReset').click(function () {
        // 清空所有欄位
        $('#idSearchInput').val('');
        $('#leaveDateRange').val('');
        $('#createDateRange').val('');
        // 重新載入全部
        loadAllData();
      });
    });


    // --- 載入美容師選單 (只顯示在職人員) ---
    function loadGroomerOptions() {
      $.ajax({
        url: GROOMER_LIST_API,
        type: "GET",
        success: function (list) {
          console.log("美容師選單載入成功");
          let options =
            '<option value="" disabled selected>請選擇美容師</option>';
          // 過濾掉離職人員 (isActive = false 或 0)
          list.filter(g => g.isActive === true || g.isActive === 1).forEach((g) => {
            options += `<option value="${g.groomerId}">${g.groomerId}: ${g.groomerName}</option>`;
          });
          $("#modalGroomerId").html(options);
        },
        error: function (xhr) {
          console.error("無法載入美容師列表", xhr);
        },
      });
    }

    // --- 送出新增表單 ---
    function submitInfo() {
      console.log("=== 進入 submitInfo 函式 ===");
      let leaveId = $("#modalLeaveId").val(); // 保留但不一定用到
      let groomerId = $("#modalGroomerId").val();
      let dateRange = $("#modalLeaveDateRange").val();
      let reason = $("#modalReason").val();

      if (!groomerId) {
        Swal.fire({
          icon: 'error',
          title: '錯誤',
          text: '請選擇美容師！',
        });
        return;
      }

      if (!dateRange) {
        Swal.fire({
          icon: 'error',
          title: '錯誤',
          text: '請選擇日期範圍！',
        });
        return;
      }

      if (!reason) {
        Swal.fire({
          icon: 'error',
          title: '錯誤',
          text: '請填寫原因！',
        });
        return;
      }
      
      // 解析日期範圍
      let dates = dateRange.split(' - ');
      let startDate = dates[0];
      let endDate = dates[1];

      // 構建 DTO 對象
      let requestData = {
        groomerId: parseInt(groomerId),
        startDate: startDate,
        endDate: endDate,
        reason: reason
      };

      // 這裡假設後端有提供批量新增的 API，或者單筆 API
      // 為了支援多天請假，我們使用批量 API
      $.ajax({
        url: BATCH_API, // 改用 BATCH_API
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify(requestData),
        success: function (res) {
          Swal.fire({
            icon: 'success',
            title: '成功',
            text: '新增成功！',
          });
          $("#Modal").modal("hide");
          loadAllData();
        },
        error: function (xhr) {
          console.error("AJAX 失敗:", xhr);
          Swal.fire({
            icon: 'error',
            title: '錯誤',
            text: '儲存失敗：' + (xhr.responseText || "未知錯誤"),
          });
        },
      });
    }

    // --- 初始化 DataTable ---
    function initDataTable() {
      if ($.fn.DataTable.isDataTable("#example2")) {
        $("#example2").DataTable().destroy();
      }
      $("#example2").DataTable({
        paging: true,
        lengthChange: false,
        searching: false,
        ordering: true,
        info: true,
        autoWidth: true,
        responsive: true,
        dom: '<"row"<"col-sm-12"t>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7 d-flex justify-content-end"p>>',
      });
    }

    // --- 載入所有資料 (加上 cache: false) ---
    function loadAllData() {
      $.ajax({
        url: LEAVERECORD_API,
        type: "GET",
        dataType: "json",
        cache: false, // ★ 防止快取導致畫面沒更新
        success: function (data) {
          console.log("資料載入成功，筆數:", data.length);
          allLeaveRecords = data;
          renderTable(data);
        },
        error: function (xhr) {
          console.error("無法載入列表:", xhr);
        },
      });
    }

    // --- 渲染表格 ---
    function renderTable(dataList) {
      let currentPage = 0;
      if ($.fn.DataTable.isDataTable("#example2")) {
        currentPage = $("#example2").DataTable().page();
        $("#example2").DataTable().destroy();
      }
      const tbody = $("#example2 tbody");
      tbody.empty();

      dataList.forEach(function (l) {
        let isChecked =
          l.isActive == 1 ? "checked" : "";
        let isDisabled =
          l.isActive == 0 ? "disabled" : "";
        let statusText =
          l.isActive == 1 ? "通過" : "駁回";
        let statusColor =
          l.isActive == 1
            ? "text-success"
            : "text-muted";
        let statusMainText =
          l.isActive == 1 ? "有效" : "無效"; // 用來顯示在表格前方的文字

        const switchHtml = `
            <div class="custom-control custom-switch">
                <input type="checkbox" class="custom-control-input toggle-status-btn" 
                       id="switch_${l.leaveId}" data-id="${l.leaveId}" ${isChecked}${isDisabled}>
                <label class="custom-control-label ${statusColor}" for="switch_${l.leaveId}">
                    ${statusText}
                </label>
            </div>`;

        // 修正：使用 startDate 和 endDate
        // 如果 startDate 和 endDate 相同，只顯示一天，否則顯示範圍
        let dateDisplay = l.startDate;
        if (l.endDate && l.startDate !== l.endDate) {
          dateDisplay = `${l.startDate} ~ ${l.endDate}`;
        }

        const tr = `<tr>
                <td>${l.leaveId}</td>
                <td>${l.groomerId}</td>
                <td>${l.groomerName || ""}</td>
                <td>${dateDisplay}</td>
                <td>${calculateDays(l.startDate, l.endDate)}</td>
                <td>${l.reason}</td>
                <td>${statusMainText}</td> 
                <td>${l.createdAt || ""}</td>                
                <td class="text-center">${switchHtml}</td>
            </tr>`;
        tbody.append(tr);
      });
      initDataTable();

      // 若原本不在第一頁，則切換回該頁
      if (currentPage > 0) {
        $("#example2").DataTable().page(currentPage).draw('page');
      }
    }

    // 計算天數 (startDate, endDate 若為 null 則回傳 1)
    function calculateDays(start, end) {
      if (!start) return 0;
      if (!end) return 1;
      const s = moment(start);
      const e = moment(end);
      return e.diff(s, 'days') + 1;
    }

    // --- 切換狀態 (同步更新文字) ---
    function handleToggleStatus() {
      $(document).on("change", ".toggle-status-btn", function (e) {
        e.preventDefault();
        let $input = $(this);
        let leaveId = $input.data("id");
        let newStatus = $input.is(":checked") ? true : false;

        // 抓取同一列的狀態文字欄位 (第6格, index 5)
        let $tr = $input.closest("tr");
        let $statusTd = $tr.find("td:eq(5)");

        $.ajax({
          url: `${LEAVERECORD_API}/${leaveId}`,
          type: "PUT",
          contentType: "application/json",
          data: JSON.stringify({ isActive: newStatus }),
          success: function (response) {
            let $label = $input.siblings("label");
            if (newStatus === true) {
              $label
                .text("通過")
                .removeClass("text-muted")
                .addClass("text-success");
              $statusTd.text("有效"); // 同步更新前方文字
            } else {
              $label
                .text("駁回")
                .removeClass("text-success")
                .addClass("text-muted");
              $statusTd.text("無效"); // 同步更新前方文字
            }
            console.log("狀態更新成功");
            loadAllData(); // 重新載入確保資料一致
          },
          error: function (xhr) {
            console.error("更新失敗:", xhr);
            alert("更新失敗");
            $input.prop("checked", !newStatus);
          },
        });
      });
    }

    // --- 開啟 Modal ---
    function openCreateModal() {
      $("#Form")[0].reset();
      $("#modalLeaveId").val("");
      $("#modalGroomerId").val("");
      $("#modalLeaveDateRange").val(""); // 清空日期範圍
      $("#modalTitle").text("新增請假單");
      $("#Modal").modal("show");
    }

    function initDatePickers() {
      // 共用的設定
      const pickerOptions = {
        autoUpdateInput: false, // 預設不填入值，讓使用者看 placeholder
        locale: {
          cancelLabel: '清除',
          applyLabel: '確定',
          format: 'YYYY-MM-DD'
        }
      };

      // 1. 查詢用：請假日期
      $('#leaveDateRange').daterangepicker(pickerOptions);

      // 2. 查詢用：創建日期
      $('#createDateRange').daterangepicker(pickerOptions);

      // 3. 新增用：請假日期範圍
      $('#modalLeaveDateRange').daterangepicker({
        ...pickerOptions,
        minDate: moment().format('YYYY-MM-DD') // 只能選今天以後的
      });

      // 當使用者選好日期按「確定」時，把值填入 input
      $('.form-control').on('apply.daterangepicker', function (ev, picker) {
        $(this).val(picker.startDate.format('YYYY-MM-DD') + ' - ' + picker.endDate.format('YYYY-MM-DD'));
      });

      // 當使用者按「清除」時，把 input 清空
      $('.form-control').on('cancel.daterangepicker', function (ev, picker) {
        $(this).val('');
      });
    }

    // --- 執行綜合查詢 ---
    function doComplexSearch() {
      let groomerId = $('#idSearchInput').val().trim();
      let leaveRange = $('#leaveDateRange').val();
      let createRange = $('#createDateRange').val();

      // 準備參數物件
      let params = {};

      if (groomerId) params.groomerId = groomerId;

      if (leaveRange) {
        let dates = leaveRange.split(' - ');
        params.leaveStartDate = dates[0];
        params.leaveEndDate = dates[1];
      }

      if (createRange) {
        let dates = createRange.split(' - ');
        params.createStartDate = dates[0];
        params.createEndDate = dates[1];
      }

      // 發送 AJAX
      $.ajax({
        url: SEARCH_API,
        type: "GET",
        data: params,
        dataType: "json",
        success: function (data) {
          if (data.length === 0) {
            Swal.fire({
              icon: 'warning',
              title: '注意',
              text: '目前無美容師請假紀錄',
            });
          }
          renderTable(data);
        },
        error: function (xhr) {
          console.error("查詢失敗:", xhr);
          Swal.fire({
            icon: 'error',
            title: '錯誤',
            text: '查詢發生錯誤',
          });
        }
      });
    }
    // ============ 班表 Modal 行事曆邏輯 ============
    let scheduleCalendar = null;
    let allScheduleEvents = { appointments: [], leaves: [] }; // 儲存班表資料供篩選
    const colorPalette = [
      { bg: "#ff5583", border: "#ff5583" },
      { bg: "#03bd9e", border: "#03bd9e" },
      { bg: "#bbdc00", border: "#bbdc00" },
      { bg: "#9e5fff", border: "#9e5fff" },
      { bg: "#00a9ff", border: "#00a9ff" },
      { bg: "#ffbb3b", border: "#ffbb3b" },
    ];

    // 綁定 Modal 顯示事件
    $("#scheduleModal").on("shown.bs.modal", function () {
      if (!scheduleCalendar) {
        initScheduleCalendar(); // 初始化月曆
      } else {
        scheduleCalendar.render(); // 重新渲染
      }
      loadScheduleData(); // 載入資料

      // 載入 Modal 內的下拉選單 (這裡重用載入邏輯)
      loadScheduleGroomerFilter();
    });

    // 載入 Modal 內的美容師篩選選單
    function loadScheduleGroomerFilter() {
      $.ajax({
        url: "/groomers",
        type: "GET",
        dataType: "json",
        success: function (list) {
          let $select = $("#scheduleGroomerFilter");
          $select.empty().append('<option value="">全部美容師</option>');
          list.forEach((g) => {
            $select.append(
              `<option value="${g.groomerId}">${g.groomerName}</option>`,
            );
          });
        },
      });
    }

    function initScheduleCalendar() {
      const Calendar = tui.Calendar;
      const container = document.getElementById("scheduleCalendar");

      scheduleCalendar = new Calendar(container, {
        defaultView: "week",
        isReadOnly: true,
        week: {
          startDayOfWeek: 1,
          hourStart: 7,
          hourEnd: 22,
          taskView: false,
        },
        theme: {
          week: {
            timeGridHalfHourLine: { borderBottom: "1px dotted #e5e5e5" },
          },
        },
        template: {
          time: function (event) {
            const appt = event.raw;
            return `<span style="font-weight: bold;">${appt.startTime || ""}</span><br>
							<span style="font-size: 11px;">${appt.groomerName || ""}</span>`;
          },
          allday: function (event) {
            return `<span>${event.title}</span>`;
          },
        },
        calendars: [],
      });

      // 綁定懸停 Tooltip
      scheduleCalendar.on("mouseEnter", function (info) {
        showEventTooltip(info);
      }); // 注意：Toast UI 新版事件不同，這裡以自訂 bindCalendarEventHover 為主
      // 按鈕事件
      $("#schedule-btn-prev").click(function () {
        scheduleCalendar.prev();
        updateScheduleDateRange();
      });
      $("#schedule-btn-next").click(function () {
        scheduleCalendar.next();
        updateScheduleDateRange();
      });
      $("#schedule-btn-today").click(function () {
        scheduleCalendar.today();
        updateScheduleDateRange();
      });
    }

    function updateScheduleDateRange() {
      const start = scheduleCalendar.getDateRangeStart();
      const end = scheduleCalendar.getDateRangeEnd();
      $("#schedule-date-range").text(
        `${moment(start.getTime()).format("YYYY/MM/DD")} ~ ${moment(end.getTime()).format("YYYY/MM/DD")}`,
      );
    }

    function loadScheduleData() {
      // 1. 取得美容師清單 (產生顏色 Key)
      $.ajax({
        url: "/groomers",
        type: "GET",
        dataType: "json",
        success: function (groomerList) {
          const calendarList = groomerList.map((g, i) => {
            const colorSet = colorPalette[i % colorPalette.length];
            return {
              id: String(g.groomerId),
              name: g.groomerName,
              color: "#ffffff",
              backgroundColor: colorSet.bg,
              borderColor: colorSet.border,
            };
          });
          scheduleCalendar.setCalendars(calendarList);

          // 2. 平行載入預約 與 假單
          Promise.all([
            $.ajax({ url: "/appointments", type: "GET", dataType: "json" }),
            $.ajax({
              url: "/groomers/leave-records",
              type: "GET",
              dataType: "json",
              cache: false,
            }),
          ]).then(function ([appointments, leaves]) {
            // 儲存原始資料供篩選
            allScheduleEvents.appointments = appointments;
            allScheduleEvents.leaves = leaves;
            // 渲染
            filterScheduleEvents();
            updateScheduleDateRange();
          });
        },
      });
    }

    // 篩選班表事件
    $(document).on("change", "#scheduleGroomerFilter", function () {
      filterScheduleEvents();
    });

    function filterScheduleEvents() {
      let selectedGroomerId = $("#scheduleGroomerFilter").val();
      let filteredAppts = allScheduleEvents.appointments;
      let filteredLeaves = allScheduleEvents.leaves;

      if (selectedGroomerId) {
        filteredAppts = filteredAppts.filter(
          (a) => String(a.groomerId) === selectedGroomerId,
        );
        filteredLeaves = filteredLeaves.filter(
          (l) => String(l.groomerId) === selectedGroomerId,
        );
      }
      renderScheduleEvents(filteredAppts, filteredLeaves);
    }

    function renderScheduleEvents(appointments, leaves) {
      let events = [];

      appointments.forEach((appt) => {
        if (appt.appointmentStatus !== "已取消") {
          events.push({
            id: "appt-" + appt.appointmentId,
            calendarId: String(appt.groomerId),
            title: appt.groomerName,
            category: "time",
            start: `${appt.appointmentDate}T${appt.startTime}:00`,
            end: `${appt.appointmentDate}T${appt.endTime}:00`,
            raw: appt, // 綁定原始資料供 Tooltip 用
          });
        }
      });

      leaves.forEach((leave) => {
        if (leave.isActive) {
          events.push({
            id: "leave-" + leave.leaveId,
            calendarId: String(leave.groomerId),
            title: `${leave.groomerName} (休假)`,
            category: "allday",
            start: leave.startDate,
            end: leave.endDate,
            isAllday: true,
            backgroundColor: "#666666",
            borderColor: "#666666",
            raw: leave,
          });
        }
      });

      scheduleCalendar.clear();
      scheduleCalendar.createEvents(events);

      // 建立索引供 Tooltip 快速查找
      window.calendarEventMap = {};
      events.forEach((e) => {
        window.calendarEventMap[e.id] = e;
      });

      // 重新綁定 Tooltip 事件
      setTimeout(bindCalendarEventHover, 500);
    }

    // Tooltip 滑鼠事件綁定
    function bindCalendarEventHover() {
      $(document).off(
        "mouseenter.caltooltip mouseleave.caltooltip mousemove.caltooltip",
      );
      // 針對 Calendar 內部的事件區塊綁定
      $(document).on(
        "mouseenter.caltooltip",
        "#scheduleCalendar .toastui-calendar-event-time, #scheduleCalendar .toastui-calendar-weekday-event",
        function (e) {
          var $el = $(this);
          var eventId = findEventId($el);
          if (
            eventId &&
            window.calendarEventMap &&
            window.calendarEventMap[eventId]
          ) {
            showEventTooltipFromData(window.calendarEventMap[eventId]);
          }
        },
      );
      $(document).on(
        "mouseleave.caltooltip",
        "#scheduleCalendar .toastui-calendar-event-time, #scheduleCalendar .toastui-calendar-weekday-event",
        function () {
          hideEventTooltip();
        },
      );
      $(document).on(
        "mousemove.caltooltip",
        "#scheduleCalendar",
        function (e) {
          $("#calendarTooltip").css({
            left: e.pageX + 15,
            top: e.pageY + 15,
          });
        },
      );
    }

    // 輔助：從 DOM 元素找回 Event ID
    function findEventId($el) {
      var id = $el.attr("data-event-id");
      if (id) return id;
      // 若無 data ID (ToastUI 有時不直接給)，則嘗試用文字匹配 (Fallback)
      var text = $el.text().replace(/\s+/g, " ").trim();
      if (window.calendarEventMap) {
        for (var key in window.calendarEventMap) {
          var evt = window.calendarEventMap[key];
          var raw = evt.raw;
          if (key.startsWith("appt-") && raw) {
            if (
              (raw.startTime && text.includes(raw.startTime)) ||
              (raw.groomerName && text.includes(raw.groomerName))
            )
              return key;
          }
          if (key.startsWith("leave-") && evt.title) {
            if (text.includes(evt.title.substring(0, 5))) return key;
          }
        }
      }
      return null;
    }

    function showEventTooltipFromData(eventData) {
      if (!eventData || !eventData.raw) return;
      var raw = eventData.raw;
      var html = "";

      if (eventData.id.startsWith("appt-")) {
        html = `<strong>📅 預約 #${raw.appointmentId}</strong>
					<div class="tooltip-row"><span class="tooltip-label">寵物:</span>${raw.petName || "-"}</div>
					<div class="tooltip-row"><span class="tooltip-label">美容師:</span>${raw.groomerName || "-"}</div>
					<div class="tooltip-row"><span class="tooltip-label">時間:</span>${raw.startTime} ~ ${raw.endTime}</div>
					<div class="tooltip-row"><span class="tooltip-label">狀態:</span>${raw.appointmentStatus}</div>
					<div class="tooltip-row"><span class="tooltip-label">價格:</span>$${raw.price || 0}</div>`;
      } else if (eventData.id.startsWith("leave-")) {
        html = `<strong>🏖️ 休假</strong>
					<div class="tooltip-row"><span class="tooltip-label">美容師:</span>${raw.groomerName}</div>
					<div class="tooltip-row"><span class="tooltip-label">日期:</span>${raw.startDate} ~ ${raw.endDate}</div>
					<div class="tooltip-row"><span class="tooltip-label">原因:</span>${raw.reason || "無"}</div>`;
      }
      if (html) $("#calendarTooltip").html(html).show();
    }

    function hideEventTooltip() {
      $("#calendarTooltip").hide();
    }
  </script>
</body>

</html>
