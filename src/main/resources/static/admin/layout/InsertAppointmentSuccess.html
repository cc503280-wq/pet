	<!-- Site wrapper -->
	<div class="wrapper">
		<!-- Content Wrapper. Contains page content -->
		<div class="content-wrapper">
			<!-- Content Header (Page header) -->
			<section class="content-header">
				<div class="container-fluid">
					<div class="row mb-2">
						<div class="col-sm-12 box1">
							<h1>預約訂單管理</h1>
						</div>
						<div class="col-sm-6"></div>
					</div>
				</div>
				<!-- /.container-fluid -->
			</section>

			<!-- Main content -->
			<section class="content">
				<div class="container-fluid">
					<div class="row">
						<div class="col-12">
							<div class="card">
								<!-- /.card-header -->
								<!-- Horizontal Form -->
								<div class="card card-info">
									<div class="card-header">
										<h3 class="card-title">新增預約訂單</h3>
									</div>
									<!-- /.card-header -->
									<div class="alert alert-success mx-4 mt-3 py-2">
										<i class="icon fas fa-check-circle"></i> <strong>新增成功!</strong>
									</div>
									<!-- form start -->

									<form class="form-horizontal" id="appointmentForm">
										<input type="hidden" name="action" value="insert">
										<div class="card-body">
											<!--會員和寵物區域-->

											<div class="form-group row">
												<label class="col-sm-2 col-form-label">會員姓名:</label>

												<div class="col-sm-10">
													<input type="text" class="form-control" id="res_memberName"
														readonly>
												</div>
											</div>

											<div class="form-group row">
												<label class="col-sm-2 col-form-label">寵物:</label>
												<div class="col-sm-10">
													<input type="text" class="form-control" id="res_petName" readonly>
												</div>
											</div>

											<!--.會員和寵物區域-->

											<!--選擇日期區域-->
											<div class="form-group row">
												<label class="col-sm-2 col-form-label">選擇日期:</label>
												<div class="col-sm-10">
													<input type="text" class="form-control" id="res_appointmentDate"
														readonly>
												</div>
											</div>
											<!--.選擇日期區域-->

											<!--服務項目區域-->
											<div class="form-group row">
												<label class="col-sm-2 col-form-label">服務項目:</label>
												<div class="col-sm-10">
													<div id="serviceListContainer" class="p-2"
														style="background-color: #e9ecef; border-radius: 5px;">
													</div>
												</div>
											</div>


											<div class="form-group row">
												<label class="col-sm-2 col-form-label">服務時長(min) :</label>
												<div class="col-sm-10">
													<input type="text" class="form-control" id="res_durationMinutes"
														readonly>
												</div>
											</div>

											<div class="form-group row">
												<label class="col-sm-2 col-form-label">總價 :</label>
												<div class="col-sm-10">
													<input type="text" class="form-control" id="res_totalPrice"
														readonly>
												</div>
											</div>
											<!--.服務項目區域-->


											<!--選擇美容師和時段區域-->
											<div class="form-group row">
												<label class="col-sm-2 col-form-label">選擇美容師:</label>
												<div class="col-sm-10">
													<input type="text" class="form-control" id="res_groomerName"
														readonly>
												</div>
											</div>

											<div class="form-group row">
												<label class="col-sm-2 col-form-label">選擇時段:</label>
												<div class="col-sm-10">
													<input type="text" class="form-control" id="res_timeSlot" readonly>
												</div>
											</div>

											<!--.選擇美容師和時段區域-->

											<div class="form-group row">
												<label class="col-sm-2 col-form-label">備註 :</label>
												<div class="col-sm-10">
													<textarea class="form-control" id="res_notes" rows="2"
														readonly></textarea>
												</div>
											</div>


											<!-- /.card-body -->
											<div class="card-footer">
												<button type="button" id="list-btn"
													class="btn btn-secondary">返回列表</button>
											</div>
											<!-- /.card-footer -->

								</div>
								<!-- /.card-body -->

							<!-- /.card -->

            <script src="/dist/js/demo.js"></script> -->
	<!-- Page specific script -->
	<script>

		$(document).ready(function () {
			let dataStr = sessionStorage.getItem('appointmentSuccessData');

			if (!dataStr) {
				Swal.fire({
					icon: 'error',
					title: '錯誤',
					text: '查無預約資料，將返回新增頁面。',
				});
				window.location.href = "InsertAppointment.html";
				return;
			}

			let data = JSON.parse(dataStr);
			console.log(data.petName);
			$('#res_memberName').val(data.memberName);
			$('#res_petName').val(data.petName.trim());
			$('#res_appointmentDate').val(data.appointmentDate);
			$('#res_durationMinutes').val(data.durationMinutes);
			$('#res_totalPrice').val("$" + data.totalPrice);
			$('#res_groomerName').val(data.groomerName);
			$('#res_notes').val(data.notes);
			$('#res_timeSlot').val(data.timeSlot);

			let servicesHtml = '';

			if (data.serviceNames) {
				// 你的分隔符號是頓號 '、'，所以我們用它來切割
				let serviceArray = data.serviceNames.split('、');

				// 建立一個無序清單 (ul)
				servicesHtml += '<ul class="list-unstyled mb-0">';

				// 跑迴圈，把每一個服務變成一個項目 (li)
				serviceArray.forEach(function (item) {
					servicesHtml += `
                    	<li class="mb-1">
                        <i class="fas fa-check-circle text-success mr-2"></i>
                        <span style="font-size: 1.1em; color: #495057;">${item.trim()}</span>
                    </li>`;
				});

				servicesHtml += '</ul>';
			} else {
				servicesHtml = '<span class="text-muted">無服務項目</span>';
			}

			$('#serviceListContainer').html(servicesHtml);

			//返回列表
			$('#list-btn').click(function () {
				// 設定要跳轉的網址
				window.location.href = 'GetAllAppointments.html';
			});

		});

	</script>
