<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新增優惠券 | 管理中心</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../../dist/css/adminlte.min.css">
    
    <link rel="stylesheet" href="../../plugins/select2/css/select2.min.css">
    <link rel="stylesheet" href="../../plugins/select2-bootstrap4-theme/select2-bootstrap4.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />

    <link rel="stylesheet" href="../../dist/css/admin-custom.css">

    <style>
        /* 標題區塊排版 */
        .box1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 頁面專屬微調 */
        .form-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .input-group-text {
            background-color: #f4f6f9;
            border-color: #ced4da;
            color: #6c757d;
            min-width: 45px;
            justify-content: center;
        }

        /* 輸入框聚焦時的顏色 */
        .form-control:focus + .input-group-append .input-group-text, 
        .form-control:focus ~ .input-group-prepend .input-group-text {
            border-color: #be8754;
            color: #be8754;
        }
        
        .select2-container .select2-selection--single {
            height: calc(2.5rem + 2px) !important;
        }
    </style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
    <div class="wrapper">
        
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-12 box1">
                            <h1>新增優惠券</h1>
                            <a href="CouponQueryAll.html" class="btn btn-default btn-sm shadow-sm border">
                                <i class="fas fa-arrow-left mr-1"></i> 回列表
                            </a>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    <div class="row justify-content-center"> 
                        <div class="col-md-10 form-container">
                            
                            <div class="card card-outline card-primary shadow-lg">
                                <div class="card-header">
                                    <h3 class="card-title" style="font-weight: 700;">
                                        <i class="fas fa-ticket-alt mr-2" style="color: #be8754;"></i>請填寫優惠券資料
                                    </h3>
                                </div>
                                
                                <form id="createCouponForm" class="form-horizontal" enctype="multipart/form-data">
                                    <div class="card-body">
                                        
                                        <div class="form-group row">
                                            <label for="code" class="col-sm-2 col-form-label text-right">折扣碼</label>
                                            <div class="col-sm-9">
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i class="fas fa-barcode"></i></span>
                                                    </div>
                                                    <input type="text" class="form-control" id="code" placeholder="請輸入折扣碼" autocomplete="off">
                                                </div>
                                            </div>
                                        </div>

                                        <div class="form-group row">
                                            <label for="discountType" class="col-sm-2 col-form-label text-right">折扣類型</label>
                                            <div class="col-sm-9">
                                                <select class="form-control select2" style="width: 100%;" id="discountType">
                                                    <option value="amount">固定金額 (Amount)</option>
                                                    <option value="percent" selected>百分比 (Percent)</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div class="form-group row">
                                            <label for="discountValue" class="col-sm-2 col-form-label text-right">折扣數值</label>
                                            <div class="col-sm-9">
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i class="fas fa-tags"></i></span>
                                                    </div>
                                                    <input type="number" step="0.05" min="0" max="1" class="form-control" id="discountValue"
                                                         placeholder="請輸入 0.0 ~ 1.0（例如六折=0.6）" autocomplete="off">
                                                </div>
                                            </div>
                                        </div>

                                        <div class="form-group row">
                                            <label class="col-sm-2 col-form-label text-right">是否限量</label>
                                            <div class="col-sm-9">
                                                <select class="form-control select2" style="width: 100%;" id="isLimited">
                                                    <option value="0" selected>不限量</option>
                                                    <option value="1">限量</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div class="form-group row">
                                            <label for="totalAmount" class="col-sm-2 col-form-label text-right">總發放量</label>
                                            <div class="col-sm-9">
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i class="fas fa-layer-group"></i></span>
                                                    </div>
                                                    <input type="text" class="form-control" id="totalAmount" placeholder="若限量請輸入數量" autocomplete="off">
                                                </div>
                                            </div>
                                        </div>

                                        <div class="form-group row">
                                            <label for="minPurchase" class="col-sm-2 col-form-label text-right">使用門檻</label>
                                            <div class="col-sm-9">
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i class="fas fa-coins"></i></span>
                                                    </div>
                                                    <input type="text" class="form-control" id="minPurchase" placeholder="最低消費金額" autocomplete="off">
                                                </div>
                                            </div>
                                        </div>

                                        <div class="form-group row">
                                            <label for="issueRange" class="col-sm-2 col-form-label text-right">發放區間</label>
                                            <div class="col-sm-9">
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i class="far fa-calendar-alt"></i></span>
                                                    </div>
                                                    <input type="text" class="form-control" id="issueRange" placeholder="選擇發放起訖日" autocomplete="off">
                                                    <input type="hidden" id="issueStartAt" name="issueStartAt">
                                                    <input type="hidden" id="issueEndAt" name="issueEndAt">
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="form-group row">
                                            <label for="useRange" class="col-sm-2 col-form-label text-right">使用區間</label>
                                            <div class="col-sm-9">
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i class="far fa-calendar-check"></i></span>
                                                    </div>
                                                    <input type="text" class="form-control" id="useRange" placeholder="選擇使用起訖日" autocomplete="off">
                                                    <input type="hidden" id="useStartAt" name="useStartAt">
                                                    <input type="hidden" id="useEndAt" name="useEndAt">
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                    
                                    <div class="card-footer d-flex justify-content-center pt-4 pb-4">
                                        <button type="submit" class="btn btn-theme-action px-5 mr-3">
                                            <i class="fas fa-save mr-1"></i> 確認新增
                                        </button>
                                        
                                        <button type="reset" class="btn btn-default px-5">
                                            <i class="fas fa-undo mr-1"></i> 清除重填
                                        </button>
                                    </div>
                                    
                                </form>
                            </div>
                            </div>
                    </div>
                </div>
            </section>
        </div>

    </div>

    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../plugins/select2/js/select2.full.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    
    <script src="../../dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script src="../../dist/js/admin-layout.js"></script>

    <script>
        $(function () {
            // 初始化 Select2
            $('.select2').select2({
                theme: 'bootstrap4',
                minimumResultsForSearch: Infinity
            });

            // 限量控管
            function toggleQuantityInputs() {
                if ($('#isLimited').val() === "0") {
                    $('#totalAmount').val('').prop('disabled', true);
                } else {
                    $('#totalAmount').prop('disabled', false);
                }
            }

            toggleQuantityInputs();
            $('#isLimited').change(toggleQuantityInputs);
            
            // 發放區間
            $('#issueRange').daterangepicker({
                autoUpdateInput: false,
                locale: {
                    format: 'YYYY-MM-DD',
                    cancelLabel: '清除'
                }
            });

            $('#issueRange').on('apply.daterangepicker', function(ev, picker) {
                $(this).val(picker.startDate.format('YYYY-MM-DD') + ' ~ ' + picker.endDate.format('YYYY-MM-DD'));
                $('#issueStartAt').val(picker.startDate.format('YYYY-MM-DD'));
                $('#issueEndAt').val(picker.endDate.format('YYYY-MM-DD'));
            });

            $('#issueRange').on('cancel.daterangepicker', function(ev, picker) {
                $(this).val('');
                $('#issueStartAt').val('');
                $('#issueEndAt').val('');
            });

            // 使用區間
            $('#useRange').daterangepicker({
                autoUpdateInput: false,
                locale: {
                    format: 'YYYY-MM-DD',
                    cancelLabel: '清除'
                }
            });

            $('#useRange').on('apply.daterangepicker', function(ev, picker) {
                $(this).val(picker.startDate.format('YYYY-MM-DD') + ' ~ ' + picker.endDate.format('YYYY-MM-DD'));
                $('#useStartAt').val(picker.startDate.format('YYYY-MM-DD'));
                $('#useEndAt').val(picker.endDate.format('YYYY-MM-DD'));
            });

            $('#useRange').on('cancel.daterangepicker', function(ev, picker) {
                $(this).val('');
                $('#useStartAt').val('');
                $('#useEndAt').val('');
            });
         	
            $('#discountType').change(function () {
                const type = $(this).val();
                const input = $('#discountValue');

                if (type === 'percent') {
                    // 百分比折扣：使用 0.0~1.0
                    input.attr({
                        'type': 'number',
                        'min': '0',
                        'max': '1',
                        'step': '0.05',
                        'placeholder': '請輸入 0.0 ~ 1.0（例如六折=0.6）'
                    });
                    input.val(''); 
                } else {
                    // 金額折扣
                    input.attr({
                        'type': 'number',
                        'min': '0',
                        'max': null,
                        'step': '50',
                        'placeholder': '請輸入折抵金額（例如 100）'
                    });
                    input.val('');
                }
            });
            
            function validateCouponFront(discountType, discountValue, minPurchase, issueStartAt, useStartAt) {
                // 折扣金額 vs 最低消費 
                if (discountType === 'amount') {
                    if (!isNaN(minPurchase) && discountValue > minPurchase) {
                        return "折抵金額不可大於最低消費金額";
                    }
                }

                // 日期驗證
                if (issueStartAt && useStartAt) {
                    const issueStart = new Date(issueStartAt);
                    const useStart = new Date(useStartAt);

                    if (useStart < issueStart) {
                        return "使用開始日期不能早於發放開始日期";
                    }
                }
                return null; 
            }

            $('form').on('submit', function (e) {
                e.preventDefault();

                const couponData = {
                    code: $('#code').val().trim(),
                    discountType: $('#discountType').val().trim(),
                    discountValue: parseFloat($('#discountValue').val()),
                    isLimited: parseInt($('#isLimited').val()),
                    totalAmount: $('#isLimited').val() === "1" ? parseInt($('#totalAmount').val()) : null,
                    minPurchase: parseInt($('#minPurchase').val()),
                    issueStartAt: $('#issueStartAt').val(),
                    issueEndAt: $('#issueEndAt').val(),
                    useStartAt: $('#useStartAt').val(),
                    useEndAt: $('#useEndAt').val()
                };

                const err = validateCouponFront(couponData.discountType, couponData.discountValue, couponData.minPurchase, couponData.issueStartAt, couponData.useStartAt);
                
                // 改用 SweetAlert 提示錯誤
                if (err) return Swal.fire('資料錯誤', err, 'warning');

                // 顯示 Loading
                Swal.fire({
                    title: '新增中...',
                    text: '請稍候',
                    allowOutsideClick: false,
                    didOpen: () => { Swal.showLoading(); }
                });

                $.ajax({
                    url: '/coupon', 
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(couponData),
                    success: function(res) {
                        sessionStorage.setItem('lastCreatedCoupon', JSON.stringify(res));
                        
                        Swal.fire({
                            icon: 'success',
                            title: '新增成功！',
                            text: '即將跳轉至完成頁面',
                            timer: 1500,
                            showConfirmButton: false
                        }).then(() => {
                            window.location.href = 'CouponCreateDone.html';
                        });
                    },
                    error: function(xhr) {
                        const msg = (xhr.responseJSON ? xhr.responseJSON.error : '資料格式有誤');
                        Swal.fire('新增失敗', msg, 'error');
                    }
                });
            });
        });
    </script>
</body>

</html>
