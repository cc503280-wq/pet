<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新增完成 | 管理中心</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../../dist/css/adminlte.min.css">
    
    <link rel="stylesheet" href="../../dist/css/admin-custom.css">

    <style>
        /* 標題區塊排版 */
        .box1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 成功頁面專屬樣式 */
        .success-icon {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 1rem;
        }
        
        .data-row {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .data-row:last-child {
            border-bottom: none;
        }
        
        .data-label {
            font-weight: 600;
            color: #6c757d;
        }
        
        .data-value {
            font-weight: 500;
            color: #343a40;
            word-break: break-all; /* 防止長內容撐開 */
        }

        /* 大頭貼樣式 */
        .profile-img {
            width: 120px; 
            height: 120px; 
            object-fit: cover; 
            border: 4px solid #fff; /* 白邊 */
            box-shadow: 0 3px 10px rgba(0,0,0,0.15); /* 陰影 */
        }
    </style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
    <div class="wrapper">
        
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-12 box1">
                            <h1>新增會員</h1>
                            <a href="MemberQueryAll.html" class="btn btn-default btn-sm shadow-sm border">
                                <i class="fas fa-arrow-left mr-1"></i> 回列表
                            </a>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    <div class="row justify-content-center"> 
                        <div class="col-md-6"> <div class="card card-outline card-success shadow-lg">
                                <div class="card-body text-center pt-5 pb-5">
                                    
                                    <div class="mb-4">
                                        <i class="fas fa-check-circle success-icon"></i>
                                        <h3 class="text-success font-weight-bold">新增成功！</h3>
                                        <p class="text-muted">該會員資料已建立完成。</p>
                                    </div>

                                    <div class="text-left bg-light p-4 rounded mb-5 mx-auto" style="max-width: 450px;">
                                        
                                        <div class="text-center mb-4">
                                            <img id="show-picture" src="../../dist/img/default-avatar.png" alt="大頭貼" class="rounded-circle profile-img">
                                        </div>

                                        <div class="row data-row">
                                            <div class="col-4 data-label">會員 ID</div>
                                            <div class="col-8 data-value" id="show-id">Loading...</div>
                                        </div>
                                        <div class="row data-row">
                                            <div class="col-4 data-label">姓名</div>
                                            <div class="col-8 data-value" id="show-name">Loading...</div>
                                        </div>
                                        <div class="row data-row">
                                            <div class="col-4 data-label">Email</div>
                                            <div class="col-8 data-value" id="show-email">Loading...</div>
                                        </div>
                                        <div class="row data-row">
                                            <div class="col-4 data-label">電話</div>
                                            <div class="col-8 data-value" id="show-phone">Loading...</div>
                                        </div>
                                        <div class="row data-row">
                                            <div class="col-4 data-label">性別</div>
                                            <div class="col-8 data-value" id="show-gender">Loading...</div>
                                        </div>
                                        <div class="row data-row">
                                            <div class="col-4 data-label">生日</div>
                                            <div class="col-8 data-value" id="show-birthday">Loading...</div>
                                        </div>
                                        <div class="row data-row">
                                            <div class="col-4 data-label">地址</div>
                                            <div class="col-8 data-value" id="show-address">Loading...</div>
                                        </div>
                                    </div>

                                    <div>
                                        <a href="MemberCreate.html" class="btn btn-theme-action px-5 shadow-sm">
                                            <i class="fas fa-plus mr-1"></i> 繼續新增下一筆
                                        </a>
                                    </div>

                                </div>
                            </div>
                            
                        </div>
                    </div>
                </div>
            </section>
        </div>

    </div>

    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    
    <script src="../../dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script src="../../dist/js/admin-layout.js"></script>

    <script>
        $(function () {
            const memberJson = sessionStorage.getItem('newMember');
            
            if (memberJson) {
                const member = JSON.parse(memberJson);
                
                // 填入資料
                $('#show-id').text(member.memberId);
                $('#show-name').text(member.name);
                $('#show-email').text(member.email);
                $('#show-phone').text(member.phone || '無');
                $('#show-gender').text(member.gender === 'M' ? '男' : '女');
                $('#show-birthday').text(member.birthday || '未設定');
                $('#show-address').text(member.address || '無');
                
                // 處理大頭貼 (如果有 Base64 或 URL 就顯示，否則維持預設圖)
                // 這裡假設後端回傳的是可以直接放在 src 的字串 (Base64 或路徑)
                // 如果後端沒回傳，可以放一個預設圖路徑
                if (member.picture) { 
                    // 如果 member.picture 是 Base64，記得加上 data:image/... 前綴，除非後端已經加了
                    // 這裡假設 member.picture 是完整的 URL 或 Base64 字串
                    $('#show-picture').attr('src', member.picture); 
                } else {
                     // 預設圖 (可改為你的預設圖路徑)
                    $('#show-picture').attr('src', 'https://via.placeholder.com/150?text=No+Image');
                }

            } else {
                Swal.fire({
                    icon: 'warning',
                    title: '無資料',
                    text: '查無資料，即將返回列表',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'MemberQueryAll.html';
                });
            }
        });
    </script>
</body>

</html>
