  <!-- Appointment Details Modal -->
  <div class="modal fade" id="appointmentDetailModal" tabindex="-1" role="dialog" aria-labelledby="appointmentDetailLabel" aria-hidden="true">

                <label class="col-sm-4 col-form-label">訂單編號</label>

  <script src="../../dist/js/adminAuth.js"></script>

  <!-- AdminLTE for demo purposes-->
  <!-- Page specific script -->
  <script>
    $(function () {
      initDataTable();
      loadAllServices();
      handleViewButtonClick();
      handleQueryAllButtonClick();
    });

    const APPOINTMENTDETAIL_API = "/appointments/details";

    //初始化畫面
    function initDataTable() {
      if ($.fn.DataTable.isDataTable("#example2")) {
        $("#example2").DataTable().destroy();
      }
      $("#example2").DataTable({
        paging: true,
        lengthChange: false,
        searching: false,
        ordering: true,
        info: true,
        autoWidth: true,
        responsive: true,
        dom: '<"row"<"col-sm-12"t>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7 d-flex justify-content-end"p>>',

        columnDefs: [
          {
            targets: [0], // 指定第 0 欄
            visible: false,
          },
        ],
      });
    }

    //呼叫後端，獲取資料
    function loadAllServices() {
      $.ajax({
        url: `${APPOINTMENTDETAIL_API}`,
        type: "GET",
        dataType: "json",
        success: function (data) {
          allServiceItems = data;
          renderTable(data);
        },
        error: function (xhr) {
          console.error("Error:", xhr);
          Swal.fire({
            icon: "error",
            title: "失敗",
            text: "無法載入資料，請確認後端 Server 是否啟動！",
          });
        },
      });
    }



    //渲染表格
    function renderTable(dataList) {
      if ($.fn.DataTable.isDataTable("#example2")) {
        $("#example2").DataTable().destroy();
      }

      const tbody = $("#example2 tbody");
      tbody.empty();

      dataList.forEach(function (ad) {
        const tr = `
                         <tr>
							<td>${ad.detailId}</td>
                            <td>${ad.appointmentId}</td>
                            <td>${ad.serviceName}</td>
                            <td>${ad.isAddon ? "加購服務" : "主要服務"}</td>
							<td>${ad.durationMinutes}</td>	
                            <td>${ad.price}</td>	
							<td>${ad.createdAt}</td>                         
                        </tr>
                    `;
        //載入表格資料
        tbody.append(tr);
      });

      initDataTable();
    }

    //點擊查看按鈕，彈出Modal並顯示預約資訊
    function handleViewButtonClick() {
      // 處理預約ID點擊事件
      $(document).on("click", ".appointment-link", function (e) {
        e.preventDefault();
        let appointmentId = $(this).data("id");
        
        // 呼叫後端 API 取得預約詳情 (使用 AppointmentList 資料)
        $.ajax({
            url: `/appointments/${appointmentId}`, // GET /appointments/{id}
            type: "GET",
            dataType: "json",
            success: function(appt) {
                if(appt) {
                    $("#modal-appt-id").val(appt.appointmentId);
                    $("#modal-member-name").val(appt.memberName);
                    $("#modal-pet-name").val(appt.petName);
                    $("#modal-pet-type").val(`${appt.petType} (${appt.petSize})`); // 組合顯示
                    $("#modal-appt-time").val(`${appt.appointmentDate} ${appt.startTime} ~ ${appt.endTime}`);
                    
                    // 組合服務項目與加購項目
                    let services = appt.mainService;
                    if(appt.addonItem) {
                        services += `\n加購項目: ${appt.addonItem}`;
                    }
                    if(appt.notes) {
                         services += `\n備註: ${appt.notes}`;
                    }

                    $("#modal-services").val(services);
                    $("#modal-total-price").val(appt.price);
                    
                    $("#appointmentDetailModal").modal("show");
                }
            },
            error: function(err) {
                console.error(err);
                Swal.fire({
                    icon: "error",
                    title: "失敗",
                    text: "無法載入資料，請確認後端 Server 是否啟動！",
                });
            }
        });
      });
    }

    //依 ID 查詢
    $('#idSearchBtn').on('click', function (e) {
      e.preventDefault();
      const id = $('#idSearchInput').val().trim();
        if (!id) {
             renderTable([]); // 沒輸入就當作查不到，顯示無資料
             return;
        }

      $.ajax({
        url: `${APPOINTMENTDETAIL_API}/${id}`,
        method: 'GET',
        dataType: 'json',
        success: function (data) {
          if (data) {
             const list = Array.isArray(data) ? data : [data];
             renderTable(list);
          } else {
             renderTable([]); // 清空表格，讓 DataTables 顯示預設的「查無資料」
          }
        }
      });
    });

    function handleQueryAllButtonClick() {
      $(document).on("click", ".btn-query-all", function (e) {
        e.preventDefault();

        $('#idSearchInput').val('');

        $.ajax({
          url: APPOINTMENTDETAIL_API,
          type: "GET",
          dataType: "json",
          success: function (data) {
            allAppointments = data;
            renderTable(data);
          },
          error: function (xhr) {
            console.error("Search Error:", xhr);
            Swal.fire({
              icon: "error",
              title: "失敗",
              text: "無法載入資料，請確認後端 Server 是否啟動！",
            });
          }
        });
      });
    }

    //重新定義 renderTable 以覆蓋舊的 (因tab/space混用導致無法取代)
    function renderTable(dataList) {
      if ($.fn.DataTable.isDataTable("#example2")) {
        $("#example2").DataTable().destroy();
      }

      const tbody = $("#example2 tbody");
      tbody.empty();

      dataList.forEach(function (ad) {
        const tr = `
                         <tr>
 							             <td>${ad.detailId}</td>
                           <td>
                              <a href="#" class="appointment-link" data-id="${ad.appointmentId}" style="text-decoration: underline; color: blue;">
                                ${ad.appointmentId}
                              </a>
                           </td>
                           <td>${ad.serviceName}</td>
                           <td>${ad.isAddon ? "加購服務" : "主要服務"}</td>
 							             <td>${ad.durationMinutes}</td>	
                           <td>${ad.price}</td>	
 							             <td>${ad.createdAt}</td>                         
                        </tr>
                    `;
        //載入表格資料
        tbody.append(tr);
      });

      initDataTable();
    }
  </script>
