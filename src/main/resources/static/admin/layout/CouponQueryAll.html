<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>優惠券總覽 | 管理中心</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../../dist/css/adminlte.min.css">
    
    <link rel="stylesheet" href="../../plugins/datatables-bs4/css/dataTables.bootstrap4.min.css">
    <link rel="stylesheet" href="../../plugins/datatables-responsive/css/responsive.bootstrap4.min.css">
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />

    <link rel="stylesheet" href="../../dist/css/admin-custom.css">

    <style>
        .box1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .disabled-btn {
            pointer-events: none !important;
            opacity: 0.5;
            cursor: not-allowed !important;
        }
        
        /* 強制不換行，配合水平捲軸 */
        #example2 td, #example2 th {
            white-space: nowrap; 
            vertical-align: middle !important; /* 確保垂直置中 */
            text-align: center !important;     /* 確保水平置中 */
        }

        /* --- 關鍵修正：消除標題與資料間的縫隙 --- */
        .dataTables_scrollHeadInner {
            width: 100% !important;
        }
        .dataTables_scrollHeadInner table {
            width: 100% !important;
            margin-bottom: 0 !important; /* 消除標題下方的留白 */
        }
    </style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
    <div class="wrapper">
        
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-12 box1">
                            <h1>會員管理</h1>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-12">
                            <div class="card card-outline card-primary">
                                <div class="card-header d-flex flex-wrap align-items-center">
                                    <h3 class="card-title me-auto mb-2 mb-md-0">優惠券列表</h3>

                                    <div class="d-flex flex-wrap align-items-center ml-auto" style="gap: 0.5rem;">
                                        <a href="CouponCreate.html" class="btn btn-theme-action mr-2 btn-add">
                                            <i class="fas fa-plus"></i> 新增資料
                                        </a>
                                        
                                        <div class="input-group mr-2" style="width: 150px;">
                                            <select id="statusSelect" class="form-control">
                                                <option value="all">查詢全部</option>
                                                <option value="active">查詢啟用中</option>
                                                <option value="disabled">查詢停用</option>
                                            </select>
                                        </div>

                                        <div class="input-group mr-2" style="width: 160px;">
                                            <input id="idSearchInput" type="text" class="form-control" placeholder="依ID查詢">
                                            <div class="input-group-append">
                                                <button id="idSearchBtn" class="btn btn-default">
                                                    <i class="fas fa-search"></i>
                                                </button>
                                            </div>
                                        </div>

                                        <div class="input-group mr-2" style="width: 240px;"> 
                                            <input type="text" id="issueRange" class="form-control float-right" placeholder="查詢發放區間" />
                                            <div class="input-group-append">
                                                <button id="issueSearchBtn" class="btn btn-default">
                                                    <i class="fas fa-search"></i>
                                                </button>
                                            </div>
                                        </div>

                                        <div class="input-group mr-2" style="width: 240px;"> 
                                            <input type="text" id="useRange" class="form-control float-right" placeholder="查詢使用區間" />
                                            <div class="input-group-append">
                                                <button id="useSearchBtn" class="btn btn-default">
                                                    <i class="fas fa-search"></i>
                                                </button>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                                <div class="card-body">
                                    <table id="example2" class="table table-bordered table-hover" style="width:100% !important;">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>折扣碼</th>
                                                <th>類型</th>
                                                <th>面額</th>
                                                <th>限量</th>
                                                <th>總量</th>
                                                <th>已發</th>
                                                <th>發放起日</th>
                                                <th>發放迄日</th>
                                                <th>使用起日</th>
                                                <th>使用迄日</th>
                                                <th>門檻</th>
                                                <th>狀態</th>
                                                <th class="text-center">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    
    <script src="../../plugins/datatables/jquery.dataTables.min.js"></script>
    <script src="../../plugins/datatables-bs4/js/dataTables.bootstrap4.min.js"></script>
    <script src="../../plugins/datatables-responsive/js/dataTables.responsive.min.js"></script>
    <script src="../../plugins/datatables-responsive/js/responsive.bootstrap4.min.js"></script>
    
    <script src="../../plugins/moment/moment.min.js"></script>
    <script src="../../plugins/daterangepicker/daterangepicker.js"></script>
    
    <script src="../../dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script src="../../dist/js/admin-layout.js"></script>

    <script>
        $(function () {
            // 初始化 DataTable
            const dataTableConfig = {
                "paging": true,
                "lengthChange": false,
                "searching": false,
                "ordering": true,
                "info": true,
                "autoWidth": false,
                "responsive": false, 
                "scrollX": true, 
                "language": { "url": "https://cdn.datatables.net/plug-ins/1.11.3/i18n/zh_Hant.json" },
                "dom": '<"row"<"col-sm-12"t>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7 d-flex justify-content-end"p>>'
            };

            $('#example2').DataTable(dataTableConfig);

            // 清空其他搜尋欄位的函式
            function clearOthers(currentId) {
                const inputs = {
                    'idSearchInput': $('#idSearchInput'),
                    'issueRange': $('#issueRange'),
                    'useRange': $('#useRange'),
                    'statusSelect': $('#statusSelect')
                };

                Object.keys(inputs).forEach(key => {
                    if (key !== currentId) {
                        if (key === 'statusSelect') {
                            inputs[key].val('all'); 
                        } else {
                            inputs[key].val(''); 
                        }
                    }
                });
            }
         
            // DateRangePicker 設定
            const drpConfig = {
                autoUpdateInput: false,
                locale: {
                    format: 'YYYY-MM-DD',
                    separator: ' ~ ',
                    applyLabel: '確定',
                    cancelLabel: '清除',
                    fromLabel: '從',
                    toLabel: '到',
                    daysOfWeek: ['日', '一', '二', '三', '四', '五', '六'],
                    monthNames: ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月']
                }
            };

            $('#issueRange, #useRange').daterangepicker(drpConfig);

            $('#issueRange, #useRange').on('apply.daterangepicker', function (ev, picker) {
                $(this).val(picker.startDate.format('YYYY-MM-DD') + ' ~ ' + picker.endDate.format('YYYY-MM-DD'));
            });

            $('#issueRange, #useRange').on('cancel.daterangepicker', function (ev, picker) {
                $(this).val('');
            });

            // 查詢狀態
            $('#statusSelect').on('change', function () {
            	clearOthers('statusSelect');
                loadCoupons($(this).val());
            });

            function loadCoupons(status = 'all') {
                const url = (status === 'all') ? '/coupon' : `/coupon?status=${status}`;
                $.ajax({
                    url: url,
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        renderTable(data);
                    },
                    error: function (xhr) {
                        Swal.fire('錯誤', '資料載入失敗', 'error');
                    }
                });
            }

            // 依 ID 查詢
            $('#idSearchBtn').on('click', function (e) {
                e.preventDefault();
                const id = $('#idSearchInput').val().trim();
                if (!id) return Swal.fire('提示', '請輸入 ID', 'info');
	
                clearOthers('idSearchInput');
                $.ajax({
                    url: `/coupon/${id}`,
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        if (data && data.couponId) {
                            renderTable([data]);
                        } else {
                            Swal.fire('提示', '找不到該 ID', 'info');
                            loadCoupons(); 
                        }
                    },
                    error: function() {
                        Swal.fire('提示', '找不到該 ID', 'info');
                    }
                });
            });

            // 修改
            $(document).on('click', '.btn-edit', function (e) {
                e.preventDefault();
                const couponId = $(this).data("id");
                window.location.href = `CouponUpdate.html?couponId=${couponId}`;
            });

            // 停用啟用
            $(document).on('click', '.btn-toggle-status', function (e) {
                e.preventDefault();
                const id = $(this).data('id');
                const currentStatus = $(this).data('status');
                const newStatus = currentStatus == 'active' ? 'disabled' : 'active';
                const actionText = newStatus == 'disabled' ? '停用' : '啟用';
                
                Swal.fire({
                    title: `確定要${actionText}嗎？`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#be8754',
                    cancelButtonColor: '#d33',
                    confirmButtonText: '確定',
                    cancelButtonText: '取消'
                }).then((result) => {
                    if (result.isConfirmed) {
                        $.ajax({
                            url: `/coupon/${id}/toggle`,
                            method: 'PATCH',
                            success: function () {
                                Swal.fire('成功', '狀態已更新', 'success');
                                const status = $('#statusSelect').val();
                                loadCoupons(status);
                            },
                            error: function (xhr) {
                                Swal.fire('失敗', '切換失敗', 'error');
                            }
                        });
                    }
                });
            });

            // 發放區間查詢
            $('#issueSearchBtn').on('click', function () {
                const range = $('#issueRange').val().trim();
                if (!range) return Swal.fire('提示', '請選擇發放區間', 'info');
                clearOthers('issueRange');
                const dates = range.split(' ~ ');
                
                $.ajax({
                    url: `/coupon/search/issue?start=${dates[0]}&end=${dates[1]}`,
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        renderTable(data);
                    },
                    error: function() {
                        Swal.fire('錯誤', '查詢失敗', 'error');
                    }
                });
            });

            // 使用區間查詢
            $('#useSearchBtn').on('click', function () {
                const range = $('#useRange').val().trim();
                if (!range) return Swal.fire('提示', '請選擇使用區間', 'info');
                clearOthers('useRange');
                const dates = range.split(' ~ ');

                $.ajax({
                    url: `/coupon/search/use?start=${dates[0]}&end=${dates[1]}`,
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        renderTable(data);
                    },
                    error: function (xhr) {
                        Swal.fire('錯誤', '查詢失敗', 'error');
                    }
                });
            });

            // 更新表格
            function renderTable(list) {
                const table = $('#example2');
                if ($.fn.DataTable.isDataTable(table)) {
                    table.DataTable().clear().destroy();
                }
                const tbody = $('#example2 tbody');
                tbody.empty();

                if(list && list.length > 0) {
                    list.forEach(item => {
                        const actionText = item.status === 'active' ? '停用' : '啟用';
                        const btnClass = item.status === 'active' ? 'btn-danger' : 'btn-success';
                        const isLimitedText = (item.isLimited === 1) ? '限量' : '不限量';
                        const totalAmountText = (item.isLimited === 0) ? '-' : item.totalAmount;
                        const issuedAmountText = (item.issuedAmount == null) ? 0 : item.issuedAmount;

                        tbody.append(`
                            <tr>
                                <td>${item.couponId}</td>
                                <td>${item.code}</td>
                                <td>${item.discountType}</td>
                                <td>${item.discountValue}</td>
                                <td>${isLimitedText}</td> 
                                <td>${totalAmountText}</td> 
                                <td>${issuedAmountText}</td> 
                                <td>${formatDate(item.issueStartAt)}</td>
                                <td>${formatDate(item.issueEndAt)}</td>
                                <td>${formatDate(item.useStartAt)}</td>
                                <td>${formatDate(item.useEndAt)}</td>
                                <td>${item.minPurchase}</td>
                                <td>
                                    <span class="badge ${item.status === 'active' ? 'badge-success' : 'badge-secondary'}">
                                        ${item.status}
                                    </span>
                                </td>
                                <td class="text-center">
                                    <button class="btn btn-info btn-sm btn-edit mr-1" data-id="${item.couponId}" title="修改">
                                        <i class="fas fa-pencil-alt"></i>
                                    </button>
                                    <button class="btn ${btnClass} btn-sm btn-toggle-status" data-id="${item.couponId}" data-status="${item.status}" title="${actionText}">
                                        <i class="fas fa-power-off"></i>
                                    </button>
                                </td>
                            </tr>
                        `);
                    });
                }

                table.DataTable(dataTableConfig);
            }

            function formatDate(dateStr) {
                if (!dateStr) return '';
                return moment(dateStr).format('YYYY-MM-DD');
            }

            // 初始載入
            loadCoupons();
        });
    </script>
</body>

</html>
