<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CouponUpdateDone</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../../dist/css/adminlte.min.css">
    <style type="text/css">
        .brand-link { display: flex; align-items: center; justify-content: flex-start; padding: 0.5rem 1rem; }
        .sidebar-collapse .brand-link { justify-content: center; }
        .brand-link i { width: 1.5rem; text-align: center; }
        .sidebar-collapse .brand-text { display: none; }
        .box1 { display: flex; justify-content: space-between; align-items: center; }
        .form-control-static { padding-top: 7px; margin-bottom: 0; font-weight: bold; color: #333; }
        .box2 { display: flex; justify-content: center; align-items: center; }
    </style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
    <div class="wrapper">
        <nav class="main-header navbar navbar-expand navbar-white navbar-light">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
                </li>
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a href="../../AdminLogoutServlet" class="btn btn-secondary btn-sm"><i class="fas fa-sign-out-alt"></i> 登出</a>
                </li>
            </ul>
        </nav>

        <aside class="main-sidebar sidebar-dark-primary elevation-4">
            <a href="../../index3.html" class="brand-link">
                <i class="fas fa-paw" style="color: #FFD43B; font-size: 1.5rem;"></i>
                <span class="brand-text font-weight-light">後台管理系統</span>
            </a>
            <div class="sidebar">
                <nav class="mt-2">
                    <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
                        <li class="nav-item">
                            <a href="CouponQueryAll.html" class="nav-link">
                                <i class="nav-icon fas fa-edit"></i>
                                <p>優惠券總覽</p>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </aside>

        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-12 box1">
                            <h1>會員管理</h1>
                            <a href="CouponQueryAll.html" class="btn btn-secondary btn-sm">回列表</a>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid d-flex justify-content-center">
                    <div class="row w-100 box2">
                        <div class="col-md-6">
                            <div class="card card-info">
                                <div class="card-header">
                                    <h3 class="card-title">修改資料檢視</h3>
                                </div>
                                
                                <div class="alert alert-success mx-4 mt-3 py-2">
                                    <i class="icon fas fa-check-circle"></i>
                                    <strong>修改成功!</strong>
                                </div>

                                <div class="card-body">
								    <div class="form-group row">
								        <label class="col-sm-4 col-form-label">ID:</label>
								        <div class="col-sm-8"><p class="form-control-static" id="view-couponId"></p></div>
								    </div>
								    <div class="form-group row">
								        <label class="col-sm-4 col-form-label">折扣碼:</label>
								        <div class="col-sm-8"><p class="form-control-static" id="view-code"></p></div>
								    </div>
								    <div class="form-group row">
								        <label class="col-sm-4 col-form-label">折扣類型:</label>
								        <div class="col-sm-8"><p class="form-control-static" id="view-discountType"></p></div>
								    </div>
								    <div class="form-group row">
								        <label class="col-sm-4 col-form-label">折扣值:</label>
								        <div class="col-sm-8"><p class="form-control-static" id="view-discountValue"></p></div>
								    </div>
								    <div class="form-group row">
								        <label class="col-sm-4 col-form-label">總發放量:</label>
								        <div class="col-sm-8"><p class="form-control-static" id="view-totalAmount"></p></div>
								    </div>
								    <div class="form-group row">
								        <label class="col-sm-4 col-form-label">已發放數量:</label>
								        <div class="col-sm-8"><p class="form-control-static" id="view-issuedAmount"></p></div>
								    </div>
								    <div class="form-group row">
								        <label class="col-sm-4 col-form-label">發放期間:</label>
								        <div class="col-sm-8">
								            <p class="form-control-static">
								                <span id="view-issueStartAt"></span> ~ <span id="view-issueEndAt"></span>
								            </p>
								        </div>
								    </div>
								    <div class="form-group row">
								        <label class="col-sm-4 col-form-label">使用期間:</label>
								        <div class="col-sm-8">
								            <p class="form-control-static">
								                <span id="view-useStartAt"></span> ~ <span id="view-useEndAt"></span>
								            </p>
								        </div>
								    </div>
								    <div class="form-group row">
								        <label class="col-sm-4 col-form-label">最低消費:</label>
								        <div class="col-sm-8"><p class="form-control-static" id="view-minPurchase"></p></div>
								    </div>
								</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="main-footer">
            <strong>Copyright &copy; 2026 Pet Admin.</strong>
        </footer>
    </div>

    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../dist/js/adminlte.min.js"></script>

    <script>
        $(function () {
            // 從 sessionStorage 讀取資料 (這是從 CouponUpdate.html 傳過來的)
            const couponDataString = sessionStorage.getItem('lastUpdatedCoupon');
            
            if (couponDataString) {
                const coupon = JSON.parse(couponDataString);
                
                // 填入資料
                $('#view-couponId').text(coupon.couponId || 'N/A');
                $('#view-code').text(coupon.code || 'N/A');
                $('#view-discountType').text(coupon.discountType || 'N/A');
                $('#view-discountValue').text(coupon.discountValue || '0');
                $('#view-totalAmount').text(coupon.isLimited === 0 ? '不限量' : coupon.totalAmount);
                $('#view-issuedAmount').text((coupon.issuedAmount == null) ? '0' : coupon.issuedAmount);
                $('#view-issueStartAt').text(coupon.issueStartAt || '');
                $('#view-issueEndAt').text(coupon.issueEndAt || '');
                $('#view-useStartAt').text(coupon.useStartAt || '');
                $('#view-useEndAt').text(coupon.useEndAt || '');
                $('#view-minPurchase').text(coupon.minPurchase || '0');

            } else {
                alert("找不到更新資料，將返回列表");
                window.location.href = 'CouponQueryAll.html';
            }
        });
    </script>
</body>

</html>
