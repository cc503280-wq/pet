<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>會員持有優惠券 | 管理中心</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../../dist/css/adminlte.min.css">
    
    <link rel="stylesheet" href="../../plugins/datatables-bs4/css/dataTables.bootstrap4.min.css">
    <link rel="stylesheet" href="../../plugins/datatables-responsive/css/responsive.bootstrap4.min.css">
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />

    <link rel="stylesheet" href="../../dist/css/admin-custom.css">

    <style>
        .box1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .disabled-btn {
            pointer-events: none !important;
            opacity: 0.5;
            cursor: not-allowed !important;
        }
        
        /* 關鍵修正：強制不換行，避免「到期」兩個字變兩行 */
        #example2 td, #example2 th {
            white-space: nowrap !important; 
            vertical-align: middle !important;
            text-align: center !important;
        }

        /* 微調捲軸模式下的邊框與間距，盡量減少標題與內容的縫隙 */
        .dataTables_scrollHeadInner {
            width: 100% !important;
        }
        .dataTables_scrollHeadInner table {
            width: 100% !important;
            margin-bottom: 0 !important;
        }
        .dataTables_scrollBody {
            border-bottom: none !important;
        }
    </style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
    <div class="wrapper">
        
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-12 box1">
                            <h1>會員管理</h1>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-12">
                            <div class="card card-outline card-primary">
                                <div class="card-header d-flex flex-wrap align-items-center">
                                    <h3 class="card-title me-auto mb-2 mb-md-0">會員持有優惠券列表</h3>

                                    <div class="d-flex flex-wrap align-items-center ml-auto" style="gap: 0.5rem;">
                                        <a href="CouponUsersQueryAll.html" class="btn btn-theme-action btn-sm mr-2">
                                            <i class="fas fa-sync-alt"></i> 查詢全部
                                        </a>

                                        <div class="input-group mr-2" style="width: 180px;">
                                            <input id="couponIdInput" type="text" class="form-control" placeholder="依優惠券ID">
                                            <div class="input-group-append">
                                                <button id="couponIdSearchBtn" class="btn btn-default">
                                                    <i class="fas fa-search"></i>
                                                </button>
                                            </div>
                                        </div>

                                        <div class="input-group mr-2" style="width: 180px;">
                                            <input id="memberIdInput" type="text" class="form-control" placeholder="依會員ID">
                                            <div class="input-group-append">
                                                <button id="memberIdSearchBtn" class="btn btn-default">
                                                    <i class="fas fa-search"></i>
                                                </button>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                                <div class="card-body">
                                    <table id="example2" class="table table-bordered table-hover" style="width:100% !important;">
                                        <thead>
                                            <tr>
                                                <th>編號</th>
                                                <th>會員ID</th>
                                                <th>券ID</th>
                                                <th>折扣碼</th>
                                                <th>類型</th>
                                                <th>面額</th>
                                                <th>門檻</th>
                                                <th>發放起日</th>
                                                <th>發放迄日</th>
                                                <th>使用起日</th>
                                                <th>使用迄日</th>
                                                <th>狀態</th>
                                                <th>領取日</th>
                                                <th>使用日</th>
                                                <th>到期</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    
    <script src="../../plugins/datatables/jquery.dataTables.min.js"></script>
    <script src="../../plugins/datatables-bs4/js/dataTables.bootstrap4.min.js"></script>
    <script src="../../plugins/datatables-responsive/js/dataTables.responsive.min.js"></script>
    <script src="../../plugins/datatables-responsive/js/responsive.bootstrap4.min.js"></script>
    
    <script src="../../plugins/moment/moment.min.js"></script>
    
    <script src="../../dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script src="../../dist/js/admin-layout.js"></script>

    <script>
        $(function () {
            // 初始化 DataTable
            const dataTableConfig = {
                "paging": true,
                "lengthChange": false,
                "searching": false,
                "ordering": true,
                "info": true,
                "autoWidth": false,
                "responsive": false, // 關閉響應式，強制全顯示
                "scrollX": true,     // 開啟水平捲軸
                "language": { "url": "https://cdn.datatables.net/plug-ins/1.11.3/i18n/zh_Hant.json" },
                "dom": '<"row"<"col-sm-12"t>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7 d-flex justify-content-end"p>>'
            };

            $('#example2').DataTable(dataTableConfig);

            function clearOthers(currentId) {
                if (currentId !== 'couponIdInput') $('#couponIdInput').val('');
                if (currentId !== 'memberIdInput') $('#memberIdInput').val('');
            }
            
            // 優惠券 ID 查詢
            $('#couponIdSearchBtn').on('click', function (e) {
                e.preventDefault();
                const couponId = $('#couponIdInput').val().trim();
                if (!couponId) return Swal.fire('提示', '請輸入優惠券 ID', 'info');

                clearOthers('couponIdInput');
                $.ajax({
                    url: `/couponUsers/coupon/${couponId}`,
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        renderTable(data);
                    },
                    error: function (xhr) {
                        Swal.fire('錯誤', '查詢失敗，請檢查ID是否正確', 'error');
                    }
                });
            });

            // 會員 ID 查詢
            $('#memberIdSearchBtn').on('click', function (e) {
                e.preventDefault();
                const memberId = $('#memberIdInput').val().trim();
                if (!memberId) return Swal.fire('提示', '請輸入會員 ID', 'info');

                clearOthers('memberIdInput');
                $.ajax({
                    url: `/couponUsers/member/${memberId}`,
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        renderTable(data);
                    },
                    error: function (xhr) {
                        Swal.fire('錯誤', '查詢失敗，請檢查 ID 是否正確', 'error');
                    }
                });
            });


            // 更新表格
            function renderTable(list) {
                const table = $('#example2');
                if ($.fn.DataTable.isDataTable(table)) {
                    table.DataTable().clear().destroy();
                }
                const tbody = $('#example2 tbody');
                tbody.empty();

                if(list && list.length > 0){
                    list.forEach(item => {
                        // 狀態徽章
                        let statusBadge = '';
                        if(item.status === 'unused') statusBadge = '<span class="badge badge-success">未使用</span>';
                        else if(item.status === 'used') statusBadge = '<span class="badge badge-secondary">已使用</span>';
                        else statusBadge = `<span class="badge badge-warning">${item.status}</span>`;

                        // 到期徽章
                        let expiredBadge = item.isExpired ? '<span class="badge badge-danger">是</span>' : '<span class="badge badge-success">否</span>';

                        tbody.append(`
                            <tr>
                                <td>${item.id}</td>
                                <td>${item.memberId}</td>
                                <td>${item.couponId}</td>
                                <td>${item.code}</td>
                                <td>${item.discountType === 'amount' ? '金額' : '百分比'}</td>
                                <td>${item.discountValue}</td>
                                <td>${item.minPurchase}</td>
                                <td>${formatDate(item.issueStartAt)}</td>
                                <td>${formatDate(item.issueEndAt)}</td>
                                <td>${formatDate(item.useStartAt)}</td>
                                <td>${formatDate(item.useEndAt)}</td>
                                <td>${statusBadge}</td>
                                <td>${formatDate(item.assignedAt)}</td>
                                <td>${item.usedAt ? formatDate(item.usedAt) : '-'}</td>
                                <td>${expiredBadge}</td>
                            </tr>
                        `);
                    });
                }

                table.DataTable(dataTableConfig);
            }

            // 格式化日期 (只顯示日期)
            function formatDate(dateStr) {
                if (!dateStr) return '';
                return moment(dateStr).format('YYYY-MM-DD');
            }

            // 頁面載入就查詢全部
            function loadAllCouponUsers() {
                $.ajax({
                    url: '/couponUsers',
                    method: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        renderTable(data);
                    },
                    error: function (xhr) {
                        console.error("載入失敗:", xhr.responseText);
                    }
                });
            }

            loadAllCouponUsers();
        });
    </script>
</body>

</html>
