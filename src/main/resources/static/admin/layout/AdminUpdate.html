              <div class="card card-info">
                <div class="card-header"><h3 class="card-title">修改管理員資料</h3></div>
                <form class="form-horizontal" id="updateForm">
                  <div class="card-body">
                    <div class="form-group row">
                      <label class="col-sm-2 col-form-label">ID:</label>
                      <div class="col-sm-10">
                        <input type="text" class="form-control" id="adminId" readonly>
                      </div>
                    </div>
                    <div class="form-group row">
                      <label class="col-sm-2 col-form-label">姓名:</label>
                      <div class="col-sm-10">
                        <input type="text" class="form-control" id="name">
                      </div>
                    </div>
                    <div class="form-group row">
                      <label class="col-sm-2 col-form-label">Email:</label>
                      <div class="col-sm-10">
                        <input type="text" class="form-control" id="email">
                      </div>
                    </div>
                    <div class="form-group row">
                      <label class="col-sm-2 col-form-label">電話:</label>
                      <div class="col-sm-10">
                        <input type="text" class="form-control" id="phone">
                      </div>
                    </div>
                    <div class="form-group row">
                      <label class="col-sm-2 col-form-label">權限:</label>
                      <div class="col-sm-10">
                        <select class="form-control" id="role">
                          <option value="admin">Admin</option>
                          <option value="super_admin">Super Admin</option>
                        </select>
                      </div>
                    </div>
                  </div>
                  <div class="card-footer">
                      <button type="submit" class="btn btn-info">送出</button>
                      <button type="reset" class="btn btn-default float-right">清除</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

  <script src="../../plugins/jquery/jquery.min.js"></script>

  <script src="../../dist/js/adminlte.min.js"></script>
  <script src="../../dist/js/adminAuth.js"></script>

  <script>
    $(function () {
      function isValidEmail(email) {
          const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          return regex.test(email);
      }

      const urlParams = new URLSearchParams(window.location.search);
      const adminId = urlParams.get('adminId');
      
      if (!adminId) {
          alert('無效的識別碼');
          window.location.href = 'AdminQueryAll.html';
          return;
      }
      
      $('#adminId').val(adminId);

      $.ajax({
          url: `/admins/${adminId}`, 
          method: 'GET',
          dataType: 'json',
          success: function(admin) {
              if (admin) {
                  $('#name').val(admin.name);
                  $('#email').val(admin.email);
                  $('#phone').val(admin.phone);
                  $('#role').val(admin.role);
              } else {
                  alert('找不到該資料');
                  window.location.href = 'AdminQueryAll.html';
              }
          },
          error: function() {
              alert('載入資料失敗');
          }
      });

      $('#updateForm').submit(function(e) {
          e.preventDefault();
          
          const email = $('#email').val().trim();
          if (email === '') { alert('Email不得為空白'); return; }
          if (!isValidEmail(email)) { alert('Email 格式不正確'); return; }

          const updateData = {
              adminId: $('#adminId').val(),
              name: $('#name').val().trim(),
              email: email,
              phone: $('#phone').val().trim(),
              role: $('#role').val()
          };

          $.ajax({
              url: `/admins/${adminId}`, 
              method: 'PUT',             
              contentType: 'application/json',
              data: JSON.stringify(updateData),
              dataType: 'json',
              success: function(res) {
                  if (res) {
                      sessionStorage.setItem('updatedAdmin', JSON.stringify(res));
                      window.location.href = 'AdminUpdateDone.html';
                  } else {
                      alert('更新失敗');
                  }
              },
              error: function(xhr) {
                  alert('更新失敗：' + xhr.responseText);
              }
          });
      });
    });
  </script>
