<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新增管理員 | 管理中心</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../../dist/css/adminlte.min.css">

    <link rel="stylesheet" href="../../plugins/select2/css/select2.min.css">
    <link rel="stylesheet" href="../../plugins/select2-bootstrap4-theme/select2-bootstrap4.min.css">

    <link rel="stylesheet" href="../../dist/css/admin-custom.css">

    <style>
        /* 標題區塊排版 */
        .box1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 頁面專屬微調 */
        .form-container {
            max-width: 1000px;
            /* 維持加寬 */
            margin: 0 auto;
        }

        .input-group-text {
            background-color: #f4f6f9;
            border-color: #ced4da;
            color: #6c757d;
            min-width: 45px;
            justify-content: center;
        }

        /* 輸入框聚焦時的顏色 (配合主題色) */
        .form-control:focus+.input-group-append .input-group-text,
        .form-control:focus~.input-group-prepend .input-group-text {
            border-color: #be8754;
            color: #be8754;
        }

        .select2-container .select2-selection--single {
            height: calc(2.5rem + 2px) !important;
        }
    </style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
    <div class="wrapper">

        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-12 box1">
                            <h1>新增管理員</h1>
                            <a href="AdminQueryAll.html" class="btn btn-default btn-sm shadow-sm border">
                                <i class="fas fa-arrow-left mr-1"></i> 回列表
                            </a>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    <div class="row justify-content-center">
                        <div class="col-md-10 form-container">

                            <div class="card card-outline card-primary shadow-lg">
                                <div class="card-header">
                                    <h3 class="card-title" style="font-weight: 700;">
                                        <i class="fas fa-user-plus mr-2" style="color: #be8754;"></i>請填寫資料
                                        <button type="button" class="btn btn-sm btn-link text-muted p-0 ml-2"
                                            onclick="demoFill()" style="font-size: 0.8rem; opacity: 0.5;">
                                            (Demo)
                                        </button>
                                    </h3>
                                </div>

                                <form id="createAdminForm" class="form-horizontal">
                                    <div class="card-body">

                                        <div class="form-group row">
                                            <label for="name" class="col-sm-2 col-form-label text-right">姓名 </label>
                                            <div class="col-sm-9">
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i
                                                                class="fas fa-user"></i></span>
                                                    </div>
                                                    <input type="text" class="form-control" id="name"
                                                        placeholder="請輸入姓名">
                                                </div>
                                            </div>
                                        </div>

                                        <div class="form-group row">
                                            <label for="email" class="col-sm-2 col-form-label text-right">Email </label>
                                            <div class="col-sm-9">
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i
                                                                class="fas fa-envelope"></i></span>
                                                    </div>
                                                    <input type="email" class="form-control" id="email"
                                                        placeholder="example@mail.com" autocomplete="off">
                                                </div>
                                            </div>
                                        </div>

                                        <div class="form-group row">
                                            <label for="password" class="col-sm-2 col-form-label text-right">密碼 </label>
                                            <div class="col-sm-9">
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i
                                                                class="fas fa-lock"></i></span>
                                                    </div>
                                                    <input type="password" class="form-control" id="password"
                                                        placeholder="8碼以上，需含英文與數字" autocomplete="new-password">
                                                </div>
                                            </div>
                                        </div>

                                        <div class="form-group row">
                                            <label for="phone" class="col-sm-2 col-form-label text-right">電話</label>
                                            <div class="col-sm-9">
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i
                                                                class="fas fa-phone"></i></span>
                                                    </div>
                                                    <input type="text" class="form-control" id="phone"
                                                        placeholder="09xx-xxx-xxx" autocomplete="off">
                                                </div>
                                            </div>
                                        </div>

                                        <div class="form-group row">
                                            <label for="role" class="col-sm-2 col-form-label text-right">權限設定</label>
                                            <div class="col-sm-9">
                                                <select class="form-control select2" id="role" style="width: 100%;">
                                                    <option value="admin" selected>一般管理員 (Admin)</option>
                                                    <option value="super_admin">超級管理員 (Super Admin)</option>
                                                </select>
                                            </div>
                                        </div>

                                    </div>

                                    <div class="card-footer d-flex justify-content-center pt-4 pb-4">
                                        <button type="submit" class="btn btn-theme-action px-5 mr-3">
                                            <i class="fas fa-save mr-1"></i> 確認新增
                                        </button>

                                        <button type="reset" class="btn btn-default px-5">
                                            <i class="fas fa-undo mr-1"></i> 清除重填
                                        </button>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

    </div>

    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../plugins/select2/js/select2.full.min.js"></script>

    <script src="../../dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script src="../../dist/js/admin-layout.js"></script>

    <script>
        $(function () {
            $('.select2').select2({
                theme: 'bootstrap4',
                minimumResultsForSearch: Infinity
            });

            window.demoFill = function () {
                $('#name').val('測試管理員');
                $('#email').val('demo_admin@gmail.com');
                $('#password').val('admin1234');
                $('#phone').val('0912-345-678');
                $('#role').val('admin').trigger('change');

                // 視覺效果
                $('#name, #email, #password, #phone').focus().blur();

                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'info',
                    title: '已帶入 Demo 資料',
                    showConfirmButton: false,
                    timer: 1500
                });
            };

            function isValidEmail(email) {
                const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return regex.test(email);
            }

            function validatePassword(pwd) {
                if (pwd.length < 8) {
                    Swal.fire('密碼太短', '密碼不得小於 8 碼', 'warning');
                    return false;
                }
                if (!/[0-9]/.test(pwd)) {
                    Swal.fire('密碼過於簡單', '密碼必須包含數字', 'warning');
                    return false;
                }
                if (!/[A-Za-z]/.test(pwd)) {
                    Swal.fire('密碼過於簡單', '密碼必須包含英文字母', 'warning');
                    return false;
                }
                return true;
            }

            $('#createAdminForm').on('submit', function (e) {
                e.preventDefault();

                const email = $('#email').val().trim();
                const pwd = $('#password').val().trim();
                const name = $('#name').val().trim();
                const phone = $('#phone').val().trim();
                const role = $('#role').val();

                if (!name) { return Swal.fire('欄位未填', '請輸入姓名', 'warning'); }
                if (!email) { return Swal.fire('欄位未填', '請輸入 Email', 'warning'); }
                if (!isValidEmail(email)) { return Swal.fire('格式錯誤', 'Email 格式不正確', 'warning'); }
                if (!pwd) { return Swal.fire('欄位未填', '請輸入密碼', 'warning'); }
                if (!validatePassword(pwd)) { return; }

                const data = {
                    name: name,
                    email: email,
                    password: pwd,
                    phone: phone,
                    role: role
                };

                Swal.fire({
                    title: '新增中...',
                    text: '請稍候',
                    allowOutsideClick: false,
                    didOpen: () => { Swal.showLoading(); }
                });

                $.ajax({
                    url: '/admins',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    dataType: 'json',
                    success: function (res) {
                        sessionStorage.setItem('newAdmin', JSON.stringify(res));

                        Swal.fire({
                            icon: 'success',
                            title: '新增成功！',
                            text: '即將跳轉至完成頁面',
                            timer: 1500,
                            showConfirmButton: false
                        }).then(() => {
                            window.location.href = 'AdminCreateDone.html';
                        });
                    },
                    error: function (xhr) {
                        let msg = '新增失敗，請稍後再試';
                        if (xhr.status === 409 || (xhr.responseText && xhr.responseText.includes('Duplicate'))) {
                            msg = '該 Email 已被註冊';
                        }
                        Swal.fire('新增失敗', msg, 'error');
                    }
                });
            });
        });
    </script>
</body>

</html>
