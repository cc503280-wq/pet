<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>queryAll.html</title>

	<!-- Google Font: Source Sans Pro -->
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
	<!-- Font Awesome -->
	<link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
	<!-- Theme style -->
	<link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
	<link rel="stylesheet" th:href="@{/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css}">
	<link rel="stylesheet" th:href="@{/plugins/datatables-responsive/css/responsive.bootstrap4.min.css}">
	<link rel="stylesheet" href="../dist/css/admin-custom.css">
	<style type="text/css">
		/* 調整 sidebar logo 排版 */
		.brand-link {
			display: flex;
			align-items: center;
			justify-content: flex-start;
			/* 展開時靠左 */
			padding: 0.5rem 1rem;
		}

		/* 收起 sidebar 時，icon 置中 */
		.sidebar-collapse .brand-link {
			justify-content: center;
		}

		/* 調整 icon 與文字間距 */
		.brand-link i {
			width: 1.5rem;
			/* 固定寬度讓文字距離固定 */
			text-align: center;
		}

		/* 收起 sidebar 時文字隱藏 */
		.sidebar-collapse .brand-text {
			display: none;
		}

		.box1 {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
	</style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
	<!-- Site wrapper -->
	<div class="wrapper">
		
		<!-- Content Wrapper. Contains page content -->
		<div class="content-wrapper">
			<!-- Content Header (Page header) -->
			<section class="content-header">
				<div class="container-fluid">
					<div class="row mb-2">
						<div class="col-sm-12 box1">
							<h1>訂單管理</h1>
							<a href="link" class="btn btn-secondary btn-sm"> 回列表 </a>
						</div>
						<div class="col-sm-6"></div>
					</div>
				</div>
				<!-- /.container-fluid -->
			</section>

			<!-- Main content -->
			<section class="content">
				<div class="container-fluid">
					<div class="row">
						<div class="col-12">
							<div class="card">
								<div class="card-header d-flex align-items-center">

									<h3 class="card-title">訂單列表</h3>

									<div class="d-flex align-items-center ml-auto">
									<a id="exportOrdersCsvBtn" href="#" class="btn btn-success btn-sm ml-2">匯出訂單 CSV</a>
									<a id="exportOrdersJsonBtn" href="#" class="btn btn-info btn-sm ml-2">匯出訂單 JSON</a>

										<div class="input-group input-group-sm mr-2" style="width: 150px;">
											<input id="idSearchInput" type="text" class="form-control"
												placeholder="依 會員ID 查詢">
											<div class="input-group-append">
												<a href="" id="idSearchBtn" type="button" class="btn btn-secondary"> <i
														class="fas fa-search"></i>
												</a>
											</div>
										</div>


									</div>
								</div>
								<!-- /.card-header -->
								<div class="card-body">
									<table id="example2" class="table table-bordered table-hover">
										<thead>
											<tr>
												<th>訂單編號</th>
												<th>會員編號</th>
												<th>成立日期</th>
												<th>當前狀態(點擊修改)</th>
												<th>商品總價</th>
												<th>優惠券</th>
												<th>券後總價</th>
												<th>使用點數</th>
												<th>點數折價後價錢</th>
												<th>得到點數</th>
												<th class="text-center">變更</th>
											</tr>
										</thead>
										<tbody>
											<tr th:each="o : ${orders}">
												<td th:text="${o.orderId}"></td>
												<td th:text="${o.memberId}"></td>
												<td th:text="${o.orderDate}"></td>
												<td th:text="${o.status}" class="status-cell"
													th:attr="data-orderid=${o.orderId}"></td>
												<td th:text="${o.totalAmountUndiscount}"></td>
												<td th:text="${o.couponId}"></td>
												<td th:text="${o.totalAmountDiscount}"></td>
												<td th:text="${o.usePoints}"></td>
												<td th:text="${o.totalAmountDiscountPoints}"></td>
												<td th:text="${o.getPoints}"></td>
												<td class="text-center">
													<button class="btn btn-primary btn-sm cancel-btn"
														th:attr="data-orderid=${o.orderId}">取消訂單</button>
												</td>
											</tr>

										</tbody>




									</table>

								</div>
								<!-- /.card-body -->
							</div>
							<!-- /.card -->
						</div>
					</div>
				</div>
			</section>
			<!-- /.content -->
		</div>
		<!-- /.content-wrapper -->
	</div>
	<!-- ./wrapper -->

	<!-- jQuery -->
	<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
	<!-- Bootstrap 4 -->
	<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
	<!-- DataTables & Plugins -->
	<script th:src="@{/plugins/datatables/jquery.dataTables.min.js}"></script>
	<script th:src="@{/plugins/datatables-bs4/js/dataTables.bootstrap4.min.js}"></script>
	<script th:src="@{/plugins/datatables-responsive/js/dataTables.responsive.min.js}"></script>
	<script th:src="@{/plugins/datatables-responsive/js/responsive.bootstrap4.min.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/dataTables.buttons.min.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/buttons.bootstrap4.min.js}"></script>
	<script th:src="@{/plugins/jszip/jszip.min.js}"></script>
	<script th:src="@{/plugins/pdfmake/pdfmake.min.js}"></script>
	<script th:src="@{/plugins/pdfmake/vfs_fonts.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/buttons.html5.min.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/buttons.print.min.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/buttons.colVis.min.js}"></script>
	 <script src="../dist/js/admin-layout.js"></script>
	<!-- AdminLTE App -->
	<script th:src="@{/dist/js/adminlte.min.js}"></script>
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
	<script src="../../dist/js/adminAuth.js"></script>
	<!-- AdminLTE for demo purposes
            <script src="${pageContext.request.contextPath}/dist/js/demo.js"></script> -->
	<!-- Page specific script -->
	<script>
		$(function () {

			$('#example2')
				.DataTable(
					{
						"paging": true,
						"lengthChange": false, // 關閉每頁筆數選項
						"searching": false, // 關閉搜索框
						"ordering": true,
						"info": true, // 顯示資訊文字
						"autoWidth": true,
						"responsive": true,

						// **【關鍵修正】使用 dom 屬性強制分頁 (p) 靠右 (col-md-7)**
						// 結構: 表格本體(t) / 新的一行: [資訊(i) - 左 5 欄] [分頁(p) - 右 7 欄]
						"dom": '<"row"<"col-sm-12"t>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7 d-flex justify-content-end"p>>'
					});
			$("#idSearchBtn").click(
				function () {
					let id = $("#idSearchInput").val();
					if (!id)
						return;

					// 把 ID 塞進 a 標籤的 href 當 GET 參數
					let url = "/orders/memberId?memberId="
						+ encodeURIComponent(id);
					$(this).attr("href", url);
				});
			$(".status-cell").click(function () {
				let $cell = $(this);

				// 如果已經是 input，就不處理
				if ($cell.find("input").length > 0)
					return;

				let oldValue = $cell.text().trim();
				let orderId = $cell.data("orderid");

				// 建立 input
				let $input = $("<input>", {
					type: "text",
					value: oldValue,
					css: {
						width: "80px"
					}
				});

				$cell.empty().append($input);
				$input.focus();

				// 按 Enter 送出
				$input.keypress(function (e) {
					if (e.which === 13) { // Enter
						let newValue = $input.val();

						$.post("/orders/updateOrderStatus", { orderId: orderId, status: newValue })
							.done(function () {
								$cell.text(newValue);
							}).fail(function () {
								alert("更新失敗");
								$cell.text(oldValue);
							});
					}
				});

				// 失焦還原原值
				$input.blur(function () {
					if ($cell.find("input").length > 0) {
						$cell.text(oldValue);
					}
				});
			});
			$(document).on("click", ".cancel-btn", function () {
				let orderId = $(this).data("orderid");

				if (!confirm("確定要取消訂單嗎？")) return;

				$.post("/orders/cancel", {
					orderId: orderId
				})
					.done(function () {
						alert("訂單已取消");
						location.reload(); // 或之後改成只更新這一列
					})
					.fail(function () {
						alert("取消失敗");
					});
			});
			$(document).on("click", "#exportOrdersCsvBtn", function(e) {
			    e.preventDefault();

			    const memberId = new URLSearchParams(window.location.search).get("memberId");
			    let url = "/orders/csv";
			    if (memberId) url += "?memberId=" + encodeURIComponent(memberId);

			    const link = document.createElement("a");
			    link.href = url;
			    link.download = "orders.csv";
			    document.body.appendChild(link);
			    link.click();
			    document.body.removeChild(link);
			});
			$(document).on("click", "#exportOrdersJsonBtn", function(e) {
			    e.preventDefault();

			    const memberId = new URLSearchParams(window.location.search).get("memberId");
			    let url = "/orders/json";
			    if (memberId) url += "?memberId=" + encodeURIComponent(memberId);

			    const link = document.createElement("a");
			    link.href = url;
			    link.download = "orders.json";
			    document.body.appendChild(link);
			    link.click();
			    document.body.removeChild(link);
			});
		});
	</script>
</body>

</html>
