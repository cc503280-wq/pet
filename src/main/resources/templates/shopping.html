<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>insert.html</title>

	<!-- Google Font -->
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">

	<!-- Font Awesome -->
	<link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">

	<!-- Theme style -->
	<link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">

	<!-- DataTables -->
	<link rel="stylesheet" th:href="@{/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css}">
	<link rel="stylesheet" th:href="@{/plugins/datatables-responsive/css/responsive.bootstrap4.min.css}">

	<!-- Select2 -->
	<link rel="stylesheet" th:href="@{/plugins/select2/css/select2.min.css}">
	<link rel="stylesheet" th:href="@{/plugins/select2-bootstrap4-theme/select2-bootstrap4.min.css}">

	<!-- Tempus Dominus -->
	<link rel="stylesheet" th:href="@{/plugins/tempusdominus-bootstrap-4/css/tempusdominus-bootstrap-4.min.css}">
	<link rel="stylesheet" href="../dist/css/admin-custom.css">
	<style type="text/css">
		/* 調整 sidebar logo 排版 */
		.brand-link {
			display: flex;
			align-items: center;
			justify-content: flex-start;
			/* 展開時靠左 */
			padding: 0.5rem 1rem;
		}

		/* 收起 sidebar 時，icon 置中 */
		.sidebar-collapse .brand-link {
			justify-content: center;
		}

		/* 調整 icon 與文字間距 */
		.brand-link i {
			width: 1.5rem;
			/* 固定寬度讓文字距離固定 */
			text-align: center;
		}

		/* 收起 sidebar 時文字隱藏 */
		.sidebar-collapse .brand-text {
			display: none;
		}

		.box1 {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
	</style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
	<!-- Site wrapper -->
	<div class="wrapper">
		<!-- Navbar -->
		<!-- Content Wrapper. Contains page content -->
		<div class="content-wrapper">
			<!-- Content Header (Page header) -->
			<section class="content-header">
				<div class="container-fluid">
					<div class="row mb-2">
						<div class="col-sm-12 box1">
							<h1>xx管理</h1>
							<a href="link" class="btn btn-secondary btn-sm"> 回列表 </a>
						</div>
						<div class="col-sm-6"></div>
					</div>
				</div>
				<!-- /.container-fluid -->
			</section>

			<!-- Main content -->
			<section class="content">
				<div class="container-fluid">
					<div class="row">
						<div class="col-12">
							<div class="card">
								<!-- /.card-header -->
								<!-- Horizontal Form -->
								<div class="card card-info">
									<div class="card-header">
										<h3 class="card-title">新增資料</h3>
									</div>
									<!-- /.card-header -->
									<!-- form start -->
									<div id="product_row_template" style="display: none;">

										<div class="form-group row product_row">
											<label class="col-sm-2 col-form-label">購買商品:</label>

											<div class="col-sm-8">
												<select name="product[]" class="form-control product-select" required>
													<option value="">請選擇商品</option>
													<option th:each="p : ${products}" th:value="${p.productId}"
														th:text="${p.productName}" th:data-name="${p.productName}"
														th:data-price="${p.price}"></option>
												</select>
												<input type="hidden" name="productName[]" class="productName-input">
												<input type="hidden" name="price[]" class="productPrice-input">
											</div>
											<div class="col-sm-2">
												<button type="button" class="btn btn-danger remove_row">刪除</button>
											</div>
										</div>

										<div class="form-group row product_row">
											<label class="col-sm-2 col-form-label">數量:</label>
											<div class="col-sm-10">
												<input type="number" name="qty[]" class="form-control" value="1" min="1"
													required>
											</div>
										</div>


									</div>
									<form class="form-horizontal" action="/Cart/step1" method="post">
										<div class="card-body">



										</div>
										<!-- /.card-body -->
										<div class="card-footer">
											<button type="button" id="add_row" class="btn btn-primary">新增商品列</button>
											<button type="submit" class="btn btn-info">送出</button>

										</div>
										<!-- /.card-footer -->
									</form>
								</div>
								<!-- /.card-body -->
							</div>
							<!-- /.card -->
						</div>
					</div>
				</div>
			</section>
			<!-- /.content -->
		</div>
		<!-- /.content-wrapper -->

	</div>
	<!-- ./wrapper -->

	<!-- jQuery -->
	<script th:src="@{/plugins/jquery/jquery.min.js}"></script>

	<!-- Bootstrap 4 -->
	<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>

	<!-- DataTables & Plugins -->
	<script th:src="@{/plugins/datatables/jquery.dataTables.min.js}"></script>
	<script th:src="@{/plugins/datatables-bs4/js/dataTables.bootstrap4.min.js}"></script>
	<script th:src="@{/plugins/datatables-responsive/js/dataTables.responsive.min.js}"></script>
	<script th:src="@{/plugins/datatables-responsive/js/responsive.bootstrap4.min.js}"></script>

	<script th:src="@{/plugins/datatables-buttons/js/dataTables.buttons.min.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/buttons.bootstrap4.min.js}"></script>
	<script th:src="@{/plugins/jszip/jszip.min.js}"></script>
	<script th:src="@{/plugins/pdfmake/pdfmake.min.js}"></script>
	<script th:src="@{/plugins/pdfmake/vfs_fonts.js}"></script>

	<script th:src="@{/plugins/datatables-buttons/js/buttons.html5.min.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/buttons.print.min.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/buttons.colVis.min.js}"></script>

	<script th:src="@{/plugins/moment/moment.min.js}"></script>
	<script th:src="@{/plugins/tempusdominus-bootstrap-4/js/tempusdominus-bootstrap-4.min.js}"></script>

	<script th:src="@{/plugins/select2/js/select2.full.min.js}"></script>
	<script src="../dist/js/admin-layout.js"></script>

	<!-- AdminLTE App -->
	<script th:src="@{/dist/js/adminlte.min.js}"></script>
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
	<script src="../../dist/js/adminAuth.js"></script>
	<!-- AdminLTE for demo purposes
            <script src="../../dist/js/demo.js"></script> -->
	<!-- Page specific script -->
	<script>
		$(function () {

			$('#example2')
				.DataTable(
					{
						"paging": true,
						"lengthChange": false, // 關閉每頁筆數選項
						"searching": false, // 關閉搜索框
						"ordering": true,
						"info": true, // 顯示資訊文字
						"autoWidth": true,
						"responsive": true,

						// **【關鍵修正】使用 dom 屬性強制分頁 (p) 靠右 (col-md-7)**
						// 結構: 表格本體(t) / 新的一行: [資訊(i) - 左 5 欄] [分頁(p) - 右 7 欄]
						"dom": '<"row"<"col-sm-12"t>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7 d-flex justify-content-end"p>>'
					});

			// 啟用 DatePicker (日期時間選擇器)
			$('#reservationdate').datetimepicker({
				format: 'L' // 這裡使用 'L' 代表當地短日期格式，例如 2025/11/29
			});

			$('#add_row').click(function () {
				// 複製現有的商品ID row
				let row = $('#product_row_template').html();
				$('.card-body').append(row);
			});
			$('form').on('change', '.product-select', function () {
				let name = $(this).find('option:selected').data('name');
				let price = $(this).find('option:selected').data('price')
				$(this).siblings('.productName-input').val(name);
				$(this).siblings('.productPrice-input').val(price);
			});

			// 刪除功能
			$('.card-body').on('click', '.remove_row', function () {
				// 找到商品ID那一列（含刪除鈕）
				let productRow = $(this).closest('.product_row');

				// 下一列是數量
				let qtyRow = productRow.next('.product_row');

				// 一次刪掉兩列
				productRow.remove();
				qtyRow.remove();
			});


		});
	</script>
</body>

</html>
