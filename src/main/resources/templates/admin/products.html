<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>商品管理 | 管理中心</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
    <link rel="stylesheet" th:href="@{/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css}">
    <link rel="stylesheet" th:href="@{/plugins/datatables-responsive/css/responsive.bootstrap4.min.css}">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" th:href="@{/dist/css/admin-custom.css}">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .box1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            cursor: zoom-in; /* 讓滑鼠變成放大鏡圖示 */
            transition: transform 0.1s;
        }

        /* 滑鼠經過小圖時稍微縮放一下，增加互動感 */
        .table-img:hover {
            transform: scale(1.1);
            filter: brightness(1.1);
        }

        /* 🟢 新增：懸浮預覽大圖的樣式 */
        #imagePreview {
            position: fixed; /* 固定在螢幕上，不受表格捲軸影響 */
            display: none;   /* 預設隱藏 */
            width: 300px;    /* 大圖寬度 */
            height: 300px;   /* 大圖高度 */
            object-fit: cover;
            z-index: 10000;  /* 保證在最上層 */
            border: 4px solid #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); /* 陰影讓它更有立體感 */
            border-radius: 8px;
            pointer-events: none; /* 讓滑鼠事件穿透，避免閃爍 */
            background-color: #fff; /* 避免透明圖背景亂掉 */
        }

        /* 🟢 新增：頂部工具列優化 */
        .toolbar-container {
            display: flex;
            align-items: center;
            flex-wrap: wrap; /* 允許換行，避免視窗縮小時破版 */
            gap: 8px; /* 按鈕之間的間距 (現代瀏覽器支援) */
        }
        
        /* 針對舊版瀏覽器的備用方案 (如果 gap 沒生效) */
        .toolbar-container > * {
            margin-right: 5px;
            margin-bottom: 5px; /* 換行時保持垂直間距 */
        }
        
        /* 搜尋框與下拉選單的寬度優化 */
        .search-group {
            width: auto;
            min-width: 150px;
        }

        /* 🟢 新增：表格操作按鈕優化 */
        .action-btn-group {
            display: flex;
            justify-content: center;
            gap: 5px; /* 按鈕間距 */
        }
        
        /* 讓操作欄位寬度固定，避免被擠壓 */
        .col-action {
            width: 160px; 
            min-width: 160px;
        }
    </style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
    <div class="wrapper">
        
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-12 box1">
                            <h1>商品管理</h1>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="card card-danger shadow-sm">
                                <div class="card-header">
                                    <h3 class="card-title"><i class="fas fa-exclamation-triangle"></i> 庫存告急商品 (Top 5)</h3>
                                    <div class="card-tools">
                                        <button type="button" class="btn btn-tool" data-card-widget="collapse"><i class="fas fa-minus"></i></button>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <div class="chart-container">
                                        <canvas id="stockChart" style="min-height: 250px; height: 250px; max-height: 250px; max-width: 100%;"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <div class="card card-primary shadow-sm">
                                <div class="card-header">
                                    <h3 class="card-title"><i class="fas fa-chart-pie"></i> 商品分類佔比</h3>
                                    <div class="card-tools">
                                        <button type="button" class="btn btn-tool" data-card-widget="collapse"><i class="fas fa-minus"></i></button>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <div class="chart-container">
                                        <canvas id="categoryChart" style="min-height: 250px; height: 250px; max-height: 250px; max-width: 100%;"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header d-flex flex-wrap align-items-center py-3">
								    <h3 class="card-title mr-auto mb-2 mb-md-0">商品列表</h3>
								
								    <div class="toolbar-container ml-auto">
								        
								        <button onclick="openCreateModal()" class="btn btn-success btn-sm shadow-sm">
								            <i class="fas fa-plus"></i> 新增
								        </button>
								        <button onclick="exportToExcel()" class="btn btn-outline-success btn-sm shadow-sm">
								            <i class="fas fa-file-excel"></i> 匯出
								        </button>
								        <button onclick="saveBatchStock()" class="btn btn-primary btn-sm shadow-sm">
								            <i class="fas fa-save"></i> 儲存庫存
								        </button>
								
								        <div class="btn-group btn-group-sm shadow-sm">
								            <button onclick="loadAllProducts()" class="btn btn-info">
								                <i class="fas fa-list"></i> 全部
								            </button>
								            <button onclick="loadInactiveProducts()" class="btn btn-warning">
								                <i class="fas fa-archive"></i> 未上架
								            </button>
								        </div>
								
								        <div class="search-group">
								            <select id="categorySelect" class="form-control form-control-sm" onchange="filterByCategory()">
								                <option value="" disabled selected>選擇分類</option>
								            </select>
								        </div>
								
								        <div class="input-group input-group-sm search-group">
								            <input type="text" id="searchInput" class="form-control" placeholder="搜尋商品...">
								            <div class="input-group-append">
								                <button class="btn btn-secondary" onclick="searchProducts()">
								                    <i class="fas fa-search"></i>
								                </button>
								            </div>
								        </div>
								    </div>
								</div>

                                <div class="card-body">
                                    <table id="productTable" class="table table-bordered table-hover">
                                        <thead>
                                            <tr>
                                                <th style="width: 50px;">ID</th>
                                                <th style="width: 80px;">圖片</th>
                                                <th>名稱</th>

                                                <th style="width: 100px;">庫存</th>
                                                <th style="width: 120px;">類別</th>
                                                <th style="width: 100px;">狀態</th>
                                                <th class="text-center" style="width: 200px;">操作</th>

                                        </thead>

                                        </tbody>
                                    </table>

                                            共 <span id="totalRecords">0</span> 筆資料

                                        <ul class="pagination pagination-sm m-0 float-right" id="paginationContainer">
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <div class="modal fade" id="productModal" tabindex="-1" role="dialog">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">新增商品</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="modalProductId">
                        <div class="form-group">
                            <label>商品名稱 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="modalProductName" required>
                            <div class="invalid-feedback">請輸入商品名稱</div>
                        </div>
                        <div class="form-group">
						    <label>商品描述</label>
						    <textarea class="form-control" id="modalDescription" rows="5" 
						              style="height: 120px !important; min-height: 120px; resize: vertical;"></textarea>
						</div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>價格 <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="modalPrice" required min="0">
                                <div class="invalid-feedback">請輸入有效的價格</div>
                            </div>
                            <div class="form-group col-md-6">
                                <label>庫存 <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="modalStock" required min="0">
                                <div class="invalid-feedback">請輸入有效的庫存數量</div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>類別 <span class="text-danger">*</span></label>
                            <select class="form-control" id="modalCategoryId">
                                <option value="" disabled selected>請選擇分類</option>
                            </select>
                            <div class="invalid-feedback">請選擇一個分類</div>
                        </div>
                        <div class="form-group">
						    <label>倒數日期 (YYYY/MM/DD)</label>
						    <input type="date" class="form-control" id="modalExpireDate">
						</div>
                        <div class="form-group">
                            <label>商品圖片</label>
                            <input type="file" class="form-control-file" id="modalImageFile" accept="image/*" onchange="previewImage()">
                            <div class="mt-2">
                                <img id="modalImagePreview" src="" style="max-width: 200px; display: none;" class="img-thumbnail">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-warning mr-auto" onclick="fillDemoData()">
                        <i class="fas fa-magic mr-1"></i> 一鍵輸入
                    </button>
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="submitProduct()">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="viewModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">單筆資料檢視</h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group row"><label class="col-sm-2 col-form-label">ID:</label><div class="col-sm-10"><p class="form-control-static font-weight-bold" id="viewId"></p></div></div>
                        <div class="form-group row"><label class="col-sm-2 col-form-label">名稱:</label><div class="col-sm-10"><p class="form-control-static" id="viewName"></p></div></div>
                        <div class="form-group row"><label class="col-sm-2 col-form-label">價格:</label><div class="col-sm-10"><p class="form-control-static text-danger" id="viewPrice"></p></div></div>

                        <div class="form-group row"><label class="col-sm-2 col-form-label">商品描述:</label><div class="col-sm-10"><p class="form-control-static" id="viewDescription"></p></div></div>
                        <div class="form-group row"><label class="col-sm-2 col-form-label">創建日期:</label><div class="col-sm-10"><p class="form-control-static small text-muted" id="viewCreatedAt"></p></div></div>

            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title">管理附圖 - <span id="galleryProductName" class="font-weight-bold"></span></h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">

	<img id="imagePreview" src="" alt="Image Preview">
    <script th:src="@{/plugins/jquery/jquery.min.js}"></script>
    <script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/dist/js/adminAuth.js}"></script>
    <script th:src="@{/dist/js/adminlte.min.js}"></script>
    <script th:src="@{/dist/js/admin-layout.js}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.0.0/dist/markdown-it.min.js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/

        const API_BASE = /*[[@{/products}]]*/ '/products';
        const API_CATEGORY = /*[[@{/categories}]]*/ '/categories';
        const IMAGE_BASE_URL = '';

        let currentPage = 0; 
        const pageSize = 10; 
        
        $(document).ready(function () {
            loadCategories();   
            loadAllProducts();  
            loadCreateCategories();
            loadCharts();
            $('#searchInput').keypress(function (e) {
                if (e.which == 13) searchProducts();
            });
         	// ==========================================
            // 🟢 新增：圖片懸浮預覽邏輯
            // ==========================================
            const preview = $('#imagePreview');

            // 1. 當滑鼠移入圖片時
            $(document).on('mouseenter', '.table-img', function (e) {
                const src = $(this).attr('src');
                
                // 如果是預設圖就不放大 (看您需求，這行可選)
                if (src.includes('placeholder')) return; 

                preview.attr('src', src).fadeIn(100);
            });

            // 2. 當滑鼠移動時，預覽圖跟著跑
            $(document).on('mousemove', '.table-img', function (e) {
                // 設定位置在滑鼠右下方一點點
                preview.css({
                    top: e.clientY + 15 + 'px',
                    left: e.clientX + 15 + 'px'
                });
            });

            // 3. 當滑鼠離開時，隱藏預覽圖
            $(document).on('mouseleave', '.table-img', function () {
                preview.hide();
            });
         	// 🟢 新增：解決 aria-hidden 警告
            $('.modal').on('shown.bs.modal', function () {
                $(this).removeAttr('aria-hidden');
            });
        });

        function loadData(url) {
            $('#tableBody').html('<tr><td colspan="8" class="text-center">載入中...</td></tr>');
            $.ajax({
                url: url, type: 'GET', dataType: 'json',
                success: function (data) {
                    if (data.content && Array.isArray(data.content)) {
                        renderTable(data.content);
                        $('#totalRecords').text(data.totalElements);
                        renderPagination(data.totalPages, data.number);
                    } else if (Array.isArray(data)) {
                        renderTable(data);
                        $('#totalRecords').text(data.length); 
                        $('#paginationContainer').html('');   
                    } else {
                        console.error("未知的資料格式:", data);
                        $('#tableBody').html('<tr><td colspan="8" class="text-center text-danger">資料格式錯誤</td></tr>');
                    }
                },
                error: function (xhr) {
                    console.error(xhr);
                    $('#tableBody').html('<tr><td colspan="8" class="text-center text-danger">載入失敗</td></tr>');
                }
            });
        }

        // ==========================================
        // 🟢 修正後的 renderTable (含文字換行)
        // ==========================================
        function renderTable(products) {
            let html = '';
            if (products.length === 0) {
                html = '<tr><td colspan="8" class="text-center">沒有找到相關資料</td></tr>';
            } else {
                $.each(products, function (index, p) {
                    let categoryName = (p.category && p.category.categoryName) ? p.category.categoryName : '未分類';
                    let imgUrl = p.imageUrl ? p.imageUrl : 'https://via.placeholder.com/50';
                    let statusBadge = p.isActive ? '<span class="badge badge-success">上架中</span>' : '<span class="badge badge-secondary">已下架</span>';
                    let btnClass = p.isActive ? 'btn-danger' : 'btn-success';
                    let btnIcon = p.isActive ? 'fa-arrow-down' : 'fa-arrow-up';
                    let btnText = p.isActive ? '下架' : '上架';

                    html += `
                        <tr>
                            <td class="align-middle">
                                <a href="javascript:void(0)" onclick="viewProduct(${p.productId})" class="font-weight-bold text-primary">${p.productId}</a>
                            </td>
                            <td class="align-middle"><img src="${imgUrl}" class="table-img"></td>
                            
                            <td class="text-left align-middle" style="max-width: 250px; min-width: 200px; white-space: normal; overflow-wrap: break-word;">
                                ${p.productName}
                            </td>
                            
                            <td class="align-middle">$${p.price}</td>
                            <td class="align-middle">
                                <input type="number" class="form-control form-control-sm stock-input mx-auto" 
                                       data-id="${p.productId}" value="${p.stock}" style="width: 80px;" min="0">
                            </td>
                            <td class="align-middle">${categoryName}</td>
                            <td class="align-middle">${statusBadge}</td>
                            
                            <td class="text-center align-middle">
                                <button class="btn btn-warning btn-sm mr-1" onclick="openGalleryModal(${p.productId}, '${p.productName}')" title="圖庫">
                                    <i class="fas fa-images"></i>
                                </button>
                                <button class="btn btn-secondary btn-sm mr-1" onclick="openEditModal(${p.productId})" title="修改">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn ${btnClass} btn-sm" onclick="toggleStatus(${p.productId})" title="${btnText}">
                                    <i class="fas ${btnIcon}"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }
            $('#tableBody').html(html);
        }

        // --- 以下所有 alert 已更換為 Swal ---
        
        function loadCreateCategories() {
            $.ajax({
                url: API_CATEGORY, type: 'GET',
                success: function (categories) {
                    const select = $('#modalCategoryId');
                    select.empty();
                    select.append('<option value="" disabled selected>請選擇分類</option>');
                    $.each(categories, function (index, category) {
                        select.append(`<option value="${category.categoryId}">${category.categoryName}</option>`);
                    });
                }
            });
        }

        function openEditModal(id) {
            $.ajax({
                url: API_BASE + '/' + id,
                type: 'GET',
                success: function (p) {
                    $('#modalProductId').val(p.productId);
                    $('#modalProductName').val(p.productName);
                    $('#modalDescription').val(p.description);
                    $('#modalPrice').val(p.price);
                    $('#modalStock').val(p.stock);
                    
                    // 🟢 日期讀取邏輯
                    if (p.expireDate) {
                        // 不管資料庫是 "2026-05-01" 還是 "2026-05-01T20:00"
                        // 我們只取前 10 個字元 "2026-05-01"
                        let dateStr = p.expireDate.substring(0, 10);
                        $('#modalExpireDate').val(dateStr);
                    } else {
                        $('#modalExpireDate').val('');
                    }

                    if (p.category) $('#modalCategoryId').val(p.category.categoryId);
                    
                    $('#modalImageFile').val('');
                    if (p.imageUrl) {
                        $('#modalImagePreview').attr('src', IMAGE_BASE_URL + p.imageUrl).show();
                    } else {
                        $('#modalImagePreview').hide();
                    }
                    
                    $('#modalTitle').text('修改商品');
                    $('#productModal').modal('show');
                },
                error: function () { 
                    Swal.fire({ icon: 'error', title: '錯誤', text: '無法載入商品資料' });
                }
            });
        }

        function loadAllProducts(page = 0) {
            currentPage = page;
            $('#categorySelect').val('');
            $('#searchInput').val('');
            $.ajax({
                url: API_BASE + '/admin/all?page=' + page + '&size=' + pageSize, type: 'GET', dataType: 'json',
                success: function (data) {
                    renderTable(data.content);
                    $('#totalRecords').text(data.totalElements);
                    renderPagination(data.totalPages, data.number);
                },
                error: function (xhr) { console.error(xhr); $('#tableBody').html('<tr><td colspan="8" class="text-center text-danger">載入失敗</td></tr>'); }
            });
        }

        function loadInactiveProducts() { loadData(API_BASE + '/admin/inactive'); }

        function searchProducts() {
            let keyword = $('#searchInput').val().trim();
            let catId = $('#categorySelect').val();
            if (keyword === '') {
                if (catId) filterByCategory();
                else loadAllProducts();
                return;
            }
            let url = API_BASE + '/search?keyword=' + encodeURIComponent(keyword);
            if (catId) url += '&categoryId=' + catId;
            loadData(url);
        }

        function filterByCategory() {
            let catId = $('#categorySelect').val();
            if (catId) loadData(API_BASE + '/category/' + catId);
        }

        // 🟢 上下架狀態：使用 Swal 確認框
        function toggleStatus(id) {
            Swal.fire({
                title: '確定要變更狀態嗎？',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#be8754',
                confirmButtonText: '確定',
                cancelButtonText: '取消'
            }).then((result) => {
                if (result.isConfirmed) {
                    $.ajax({
                        url: API_BASE + '/' + id + '/status', type: 'PUT',
                        success: function () {
                            // 狀態變更成功，用 Toast 提示
                            Swal.fire({
                                icon: 'success',
                                title: '更新成功！',
                                toast: true,
                                position: 'top-end',
                                showConfirmButton: false,
                                timer: 2000
                            });
                            loadAllProducts(currentPage);
                        },
                        error: function (xhr) { 
                            Swal.fire('錯誤', '更新失敗：' + (xhr.responseJSON ? xhr.responseJSON.message : '未知錯誤'), 'error'); 
                        }
                    });
                }
            });
        }

        function loadCategories() {
            $.ajax({
                url: API_CATEGORY, type: 'GET', dataType: 'json',
                success: function (cats) {
                    let options = '<option value="" disabled selected>選擇分類</option>';
                    $.each(cats, function (i, cat) { options += '<option value="' + cat.categoryId + '">' + cat.categoryName + '</option>'; });
                    $('#categorySelect').html(options);
                }
            });
        }

        function openCreateModal() {
            $('#productForm')[0].reset();
            $('#modalProductId').val('');
            $('#modalTitle').text('新增商品');
            $('#modalImageFile').val('');
            $('#modalImagePreview').attr('src', '').hide();
            $('#productModal').modal('show');
            $('#productForm input, #productForm select').on('input change', function() { $(this).removeClass('is-invalid'); });
        }

        async function fillDemoData() {
            // 1. 設定文字欄位
            $('#modalProductName').val("【新品推薦】頂級無穀深海魚貓糧");
            $('#modalDescription').val("這是一筆由系統自動生成的測試資料。\n富含豐富 Omega-3，保護毛孩心血管健康。");
            $('#modalPrice').val(1580);
            $('#modalStock').val(99);

            // 2. 設定分類
            let firstCategoryVal = $('#modalCategoryId option:eq(1)').val();
            if (firstCategoryVal) $('#modalCategoryId').val(firstCategoryVal);

            // 3. 設定日期
            let now = new Date();
            now.setMonth(now.getMonth() + 1);
            let year = now.getFullYear();
            let month = String(now.getMonth() + 1).padStart(2, '0');
            let day = String(now.getDate()).padStart(2, '0');
            $('#modalExpireDate').val(`${year}-${month}-${day}`);

            // 4. 移除錯誤紅框
            $('#productForm .form-control').removeClass('is-invalid');

            // 🟢 5. 自動填入預設圖片 (關鍵程式碼)
            // 這裡是用一張 Unsplash 的免費貓咪圖當範例，您可以換成任何 "公開" 的圖片網址
            const imageUrl = 'https://res.cloudinary.com/dwzbhnqmq/image/upload/v1769834690/dog-food_lossul.png'; 
            
            try {
                // A. 讓按鈕顯示 "處理中..."
                let btn = $(event.target); // 抓取點擊的按鈕
                let originalText = btn.html();
                btn.html('<i class="fas fa-spinner fa-spin"></i> 抓取圖片中...');
                
                // B. 下載圖片並轉成檔案物件
                let response = await fetch(imageUrl);
                let blob = await response.blob();
                // 這裡的 "demo.jpg" 是模擬的檔名
                let file = new File([blob], "demo-cat.jpg", { type: "image/jpeg" });

                // C. 使用 DataTransfer 模擬使用者選檔
                let container = new DataTransfer();
                container.items.add(file);
                
                // D. 塞進 input[type="file"]
                document.getElementById('modalImageFile').files = container.files;
                
                // E. 觸發預覽 (讓您看到圖片)
                $('#modalImagePreview').attr('src', URL.createObjectURL(blob)).show();
                
                // 復原按鈕文字
                btn.html(originalText);
                
            } catch (error) {
                console.error("無法載入預設圖片", error);
                alert("預設圖片載入失敗，請檢查網路或網址");
            }
        }

        // 🟢 新增/修改：使用 Timer Swal
        function submitProduct() {
            let isValid = true;
            let nameInput = $('#modalProductName');
            let priceInput = $('#modalPrice');
            let stockInput = $('#modalStock');
            let categoryInput = $('#modalCategoryId');
            $('#productForm .form-control').removeClass('is-invalid');

            if (nameInput.val().trim() === '') { nameInput.addClass('is-invalid'); isValid = false; }
            if (priceInput.val() === '' || parseFloat(priceInput.val()) < 0) { priceInput.addClass('is-invalid'); isValid = false; }
            if (stockInput.val() === '' || parseInt(stockInput.val()) < 0) { stockInput.addClass('is-invalid'); isValid = false; }
            if (categoryInput.val() === null || categoryInput.val() === '') { categoryInput.addClass('is-invalid'); isValid = false; }

            if (!isValid) {
                $('.modal-content').addClass('animate__animated animate__shakeX');
                setTimeout(() => $('.modal-content').removeClass('animate__animated animate__shakeX'), 500);
                return; 
            }

            let formData = new FormData();
            formData.append('productName', nameInput.val());
            formData.append('description', $('#modalDescription').val());
            formData.append('price', priceInput.val());
            formData.append('stock', stockInput.val());
            formData.append('categoryId', categoryInput.val());
            let expireDate = $('#modalExpireDate').val();
            if (expireDate) formData.append('expireDate', expireDate);
            const fileInput = $('#modalImageFile')[0];
            if (fileInput.files && fileInput.files[0]) formData.append('file', fileInput.files[0]);

            let id = $('#modalProductId').val();
            let url = (id) ? (API_BASE + '/update/' + id) : (API_BASE + '/create');

            // 按鈕 loading 效果
            let btn = $(event.target);
            let originalText = btn.html();
            btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> 處理中...');

            $.ajax({
                url: url, type: 'POST', data: formData, processData: false, contentType: false,
                success: function () {
                    // 成功：自動消失的彈窗
                    Swal.fire({
                        icon: 'success',
                        title: (id ? '修改成功！' : '新增成功！'),
                        showConfirmButton: false,
                        timer: 1500
                    });
                    $('#productModal').modal('hide');
                    loadAllProducts();
                },
                error: function (xhr) { 
                    Swal.fire('失敗', '儲存失敗：' + (xhr.responseText || '未知錯誤'), 'error'); 
                },
                complete: function() {
                    btn.prop('disabled', false).html(originalText);
                }
            });
        }

        function viewProduct(id) {
            $.ajax({
                url: API_BASE + '/' + id, type: 'GET',
                success: function (p) {
                    $('#viewId').text(p.productId);
                    $('#viewName').text(p.productName);
                    $('#viewPrice').text('$' + p.price);
                    $('#viewStock').text(p.stock);
                    $('#viewDescription').text(p.description || '無描述');
                    $('#viewCreatedAt').text(p.createdAt || p.updatedAt || '未知');
                    $('#viewCategory').text(p.category ? p.category.categoryName : '未分類');
                    if (p.imageUrl) { $('#viewImage').attr('src', p.imageUrl).show(); $('#noImageText').hide(); }
                    else { $('#viewImage').hide(); $('#noImageText').show(); }
                    $('#viewModal').modal('show');
                },
                error: function () { Swal.fire('錯誤', '無法讀取資料', 'error'); }
            });
        }

        function previewImage() {
            const fileInput = $('#modalImageFile')[0];
            const preview = $('#modalImagePreview');
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) { preview.attr('src', e.target.result).show(); }
                reader.readAsDataURL(fileInput.files[0]);
            } else { preview.hide(); }
        }

        // Gallery Functions
        let currentGalleryProductId = null;
        function openGalleryModal(productId, productName) {
            currentGalleryProductId = productId;
            $('#galleryProductName').text(productName);
            $('#galleryFileInput').val('');
            loadGalleryImages();
            $('#galleryModal').modal('show');
        }

        function loadGalleryImages() {
            $.ajax({
                url: '/api/product-images/' + currentGalleryProductId, type: 'GET',
                success: function(images) {
                    let container = $('#galleryContainer');
                    container.empty();
                    if (images.length === 0) { container.append('<div class="col-12 text-center text-muted py-3">暫無其他圖片</div>'); return; }
                    $.each(images, function(index, img) {
                        let card = `
                            <div class="col-md-3 col-6 mb-3">
                                <div class="card h-100 shadow-sm">
                                    <div style="position: relative;">
                                        <img src="${img.imageUrl}" class="card-img-top" style="height: 120px; object-fit: cover;">
                                    </div>
                                    <div class="card-body text-center p-2">
                                        <button class="btn btn-danger btn-sm w-100" onclick="deleteGalleryImage(${img.imageId})">
                                            <i class="fas fa-trash-alt"></i> 刪除
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.append(card);
                    });
                },
                error: function() { 
                    // 這裡其實可以安靜處理，或者用 Toast
                    Swal.fire({icon: 'error', title: '無法載入圖片列表', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000}); 
                }
            });
        }

        function uploadGalleryImages() {
            let fileInput = $('#galleryFileInput')[0];
            if (fileInput.files.length === 0) { Swal.fire('提示', '請先選擇至少一張圖片', 'warning'); return; }
            let formData = new FormData();
            for (let i = 0; i < fileInput.files.length; i++) formData.append('files', fileInput.files[i]);
            
            let uploadBtn = $(event.target);
            let originalText = uploadBtn.html();
            uploadBtn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> 上傳中...');

            $.ajax({
                url: '/api/product-images/upload/' + currentGalleryProductId, type: 'POST', data: formData, processData: false, contentType: false,
                success: function() {
                    Swal.fire({
                        icon: 'success',
                        title: '上傳成功！',
                        showConfirmButton: false,
                        timer: 1500
                    });
                    $('#galleryFileInput').val('');
                    loadGalleryImages();
                },
                error: function(xhr) { Swal.fire('失敗', '上傳失敗', 'error'); },
                complete: function() { uploadBtn.prop('disabled', false).html(originalText); }
            });
        }

        function deleteGalleryImage(imageId) {
            Swal.fire({
                title: '確定要刪除嗎？', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: '刪除', cancelButtonText: '取消'
            }).then((result) => {
                if (result.isConfirmed) {
                    $.ajax({
                        url: '/api/product-images/' + imageId, type: 'DELETE',
                        success: function() { 
                            // 刪除成功，重整列表
                            loadGalleryImages(); 
                        },
                        error: function() { Swal.fire('錯誤', '刪除失敗', 'error'); }
                    });
                }
            });
        }

        function saveBatchStock() {
            let stockList = [];
            $('.stock-input').each(function() {
                let val = $(this).val();
                if (val !== '' && val >= 0) stockList.push({ productId: $(this).data('id'), stock: parseInt(val) });
            });
            if (stockList.length === 0) { Swal.fire('提示', '沒有資料可更新', 'info'); return; }

            let btn = $(event.target);
            let originalText = btn.html();
            btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> 儲存中...');

            $.ajax({
                url: API_BASE + '/batch-stock', type: 'POST', contentType: 'application/json', data: JSON.stringify(stockList),
                success: function() {
                    Swal.fire({
                        icon: 'success',
                        title: '庫存批量更新成功！',
                        showConfirmButton: false,
                        timer: 1500
                    });
                    loadAllProducts();
                },
                error: function() { Swal.fire('錯誤', '更新失敗', 'error'); },
                complete: function() { btn.prop('disabled', false).html(originalText); }
            });
        }

        function renderPagination(totalPages, currentPage) {
            if (totalPages <= 1) { $('#paginationContainer').html(''); return; }
            let html = '';
            let prevDisabled = (currentPage === 0) ? 'disabled' : '';
            html += `<li class="page-item ${prevDisabled}"><a class="page-link" href="javascript:void(0)" onclick="loadAllProducts(${currentPage - 1})">«</a></li>`;
            for (let i = 0; i < totalPages; i++) {
                let activeClass = (i === currentPage) ? 'active' : '';
                html += `<li class="page-item ${activeClass}"><a class="page-link" href="javascript:void(0)" onclick="loadAllProducts(${i})">${i + 1}</a></li>`;
            }
            let nextDisabled = (currentPage === totalPages - 1) ? 'disabled' : '';
            html += `<li class="page-item ${nextDisabled}"><a class="page-link" href="javascript:void(0)" onclick="loadAllProducts(${currentPage + 1})">»</a></li>`;
            $('#paginationContainer').html(html);
        }

        function loadCharts() {
            $.ajax({
                url: API_BASE + '/stats', type: 'GET', dataType: 'json',
                success: function (data) {
                    renderStockChart(data.lowStock);
                    renderCategoryChart(data.categories);
                },
                error: function (err) { console.error('無法載入圖表數據', err); }
            });
        }

        function renderStockChart(chartData) {
            var ctx = document.getElementById('stockChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartData.labels,
                    datasets: [{
                        label: '剩餘庫存',
                        data: chartData.data,
                        backgroundColor: 'rgba(220, 53, 69, 0.8)',
                        borderColor: 'rgba(220, 53, 69, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { beginAtZero: true } }
                }
            });
        }

        function renderCategoryChart(chartData) {
            var ctx = document.getElementById('categoryChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: chartData.labels,
                    datasets: [{
                        data: chartData.data,
                        backgroundColor: ['#f56954', '#00a65a', '#f39c12', '#00c0ef', '#3c8dbc', '#d2d6de'],
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'right' } }
                }
            });
        }

        /*]]>*/
    </script>
</body>
</html>
