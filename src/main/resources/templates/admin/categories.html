<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>分類管理 | 管理中心</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
    <link rel="stylesheet" th:href="@{/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css}">
    <link rel="stylesheet" th:href="@{/plugins/datatables-responsive/css/responsive.bootstrap4.min.css}">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/dist/css/admin-custom.css}">
    
    

    <style>
        /* 頁面專屬樣式 */
        .box1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
    <div class="wrapper">
        
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1 class="m-0">分類管理</h1>
                        </div>
                        <div class="col-sm-6">
                            <button onclick="openCreateModal()" class="btn btn-success float-sm-right">
                                <i class="fas fa-plus"></i> 新增分類
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    <div class="card">
                        <div class="card-body">
                            <table id="categoriesTable" class="table table-bordered table-hover">
                                <thead>
                                    <tr>
                                        <th style="width: 10%">ID</th>
                                        <th>分類名稱</th>
                                        <th style="width: 20%">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        </div>
    <div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">新增分類</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm">
                        <input type="hidden" id="modalCategoryId">

                        <div class="form-group">
                            <label>分類名稱</label> 
                            <input type="text" class="form-control" id="modalCategoryName" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="submitCategory()">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/plugins/jquery/jquery.min.js}"></script>
    <script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/dist/js/adminAuth.js}"></script>
    <script th:src="@{/dist/js/adminlte.min.js}"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.0.0/dist/markdown-it.min.js"></script>
    <script th:src="@{/dist/js/admin-layout.js}"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        // API 路徑 (對應 CategoryController)
        const API_BASE = /*[[@{/categories}]]*/ '/categories';

        $(function () {
            loadAllCategories();
        });

        // 1. 載入列表
        function loadAllCategories() {
            $.ajax({
                url: API_BASE, // GET /categories
                type: 'GET',
                success: function (data) {
                    const tableBody = $('#tableBody');
                    tableBody.empty();

                    if(data.length === 0) {
                        tableBody.html('<tr><td colspan="3" class="text-center">尚無分類資料</td></tr>');
                        return;
                    }

                    $.each(data, function (index, c) {
                        let row = `
                        <tr>
                            <td>${c.categoryId}</td>
                            <td>${c.categoryName}</td>
                            <td>
                                <button class="btn btn-secondary btn-sm mr-1" onclick="openEditModal(${c.categoryId})">
                                    <i class="fas fa-edit"></i> 修改
                                </button>
                            </td>
                        </tr>
                    `;
                        tableBody.append(row);
                    });
                },
                error: function (err) {
                    console.error(err);
                    // 如果您有引用 SweetAlert2，可以用 Swal.fire 代替 alert
                    if(typeof Swal !== 'undefined') {
                        Swal.fire('錯誤', '無法載入分類資料', 'error');
                    } else {
                        alert('無法載入分類資料');
                    }
                }
            });
        }

        // 2. 打開新增視窗
        function openCreateModal() {
            $('#categoryForm')[0].reset();
            $('#modalCategoryId').val(''); // 清空 ID
            $('#modalTitle').text('新增分類');
            $('#categoryModal').modal('show');
        }

        // 3. 打開修改視窗
        function openEditModal(id) {
            $.ajax({
                url: API_BASE + '/' + id, // 假設後端有 GET /categories/{id}
                type: 'GET',
                success: function (c) {
                    $('#modalCategoryId').val(c.categoryId);
                    $('#modalCategoryName').val(c.categoryName);

                    $('#modalTitle').text('修改分類');
                    $('#categoryModal').modal('show');
                },
                error: function(err) {
                    console.error(err);
                    alert('無法讀取該分類資料');
                }
            });
        }

        // 4. 送出資料 (新增或修改)
        function submitCategory() {
            let formData = new FormData();
            formData.append('categoryName', $('#modalCategoryName').val());

            let id = $('#modalCategoryId').val();
            let url = id ? (API_BASE + '/update/' + id) : (API_BASE + '/create');

            $.ajax({
                url: url,
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function () {
                    // 使用 SweetAlert2 (如果有引入)
                    if(typeof Swal !== 'undefined') {
                        Swal.fire('成功', '儲存成功！', 'success');
                    } else {
                        alert('儲存成功！');
                    }
                    
                    $('#categoryModal').modal('hide');
                    loadAllCategories();
                },
                error: function (xhr) {
                    console.error(xhr);
                    let msg = xhr.responseText || '儲存失敗';
                    
                    if(typeof Swal !== 'undefined') {
                        Swal.fire('失敗', msg, 'error');
                    } else {
                        alert(msg);
                    }
                }
            });
        }

        /*]]>*/
    </script>
</body>

</html>
