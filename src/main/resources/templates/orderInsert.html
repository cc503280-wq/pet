<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Font Awesome -->
	<link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">

	<!-- Theme style -->
	<link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">

	<!-- DataTables -->
	<link rel="stylesheet" th:href="@{/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css}">
	<link rel="stylesheet" th:href="@{/plugins/datatables-responsive/css/responsive.bootstrap4.min.css}">

	<!-- Select2 -->
	<link rel="stylesheet" th:href="@{/plugins/select2/css/select2.min.css}">
	<link rel="stylesheet" th:href="@{/plugins/select2-bootstrap4-theme/select2-bootstrap4.min.css}">

	<!-- Tempus Dominus -->
	<link rel="stylesheet" th:href="@{/plugins/tempusdominus-bootstrap-4/css/tempusdominus-bootstrap-4.min.css}">
	<link rel="stylesheet" href="../dist/css/admin-custom.css">
	<style type="text/css">
		/* 調整 sidebar logo 排版 */
		.brand-link {
			display: flex;
			align-items: center;
			justify-content: flex-start;
			/* 展開時靠左 */
			padding: 0.5rem 1rem;
		}

		/* 收起 sidebar 時，icon 置中 */
		.sidebar-collapse .brand-link {
			justify-content: center;
		}

		/* 調整 icon 與文字間距 */
		.brand-link i {
			width: 1.5rem;
			/* 固定寬度讓文字距離固定 */
			text-align: center;
		}

		/* 收起 sidebar 時文字隱藏 */
		.sidebar-collapse .brand-text {
			display: none;
		}

		.box1 {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
	</style>
</head>

<body class="hold-transition sidebar-mini sidebar-collapse">
	<!-- Site wrapper -->
	<div class="wrapper">
		

		
		<div class="content-wrapper">
			<!-- Content Header (Page header) -->
			<section class="content-header">
				<div class="container-fluid">
					<div class="row mb-2">
						<div class="col-sm-12 box1">
							<h1>xx管理</h1>
							<a href="link" class="btn btn-secondary btn-sm"> 回列表 </a>
						</div>
						<div class="col-sm-6"></div>
					</div>
				</div>
				<!-- /.container-fluid -->
			</section>

			<!-- Main content -->
			<section class="content">
				<div class="container-fluid">
					<div class="row">
						<div class="col-12">
							<div class="card">
								<!-- /.card-header -->
								<!-- Horizontal Form -->
								<div class="card">
									<div class="card-header">
										<h3 class="card-title">新增訂單</h3>
									</div>
									<!-- /.card-header -->
									<!-- form start -->
									<form class="form-horizontal" method="post" action="/Cart/insertOrder">
										<div class="card-body">
											<div th:each="item : ${session.cart}">
												<!-- 商品編號 -->
												<div class="form-group row">
													<label class="col-sm-2 col-form-label">商品編號</label>
													<div class="col-sm-10">
														<input type="text" class="form-control" name="productId[]"
															th:value="${item.productId}" readonly>
													</div>
												</div>

												<!-- 商品名稱 -->
												<div class="form-group row">
													<label class="col-sm-2 col-form-label">商品名稱</label>
													<div class="col-sm-10">
														<input type="text" class="form-control" name="productName[]"
															th:value="${item.productName}" readonly>
													</div>
												</div>
												<!-- 數量 -->
												<div class="form-group row">
													<label class="col-sm-2 col-form-label">數量</label>
													<div class="col-sm-10">
														<input type="number" class="form-control" name="quantity[]"
															th:value="${item.quantity}" min="1" readonly>
													</div>
												</div>
												<!-- 商品單價 -->
												<div class="form-group row">
													<label class="col-sm-2 col-form-label">商品價格</label>
													<div class="col-sm-10">
														<input type="number" class="form-control" name="price[]"
															th:value="${item.price}" readonly>
													</div>
												</div>
											</div>
											<hr>

											<div class="form-group row">
												<label for="inputPassword3"
													class="col-sm-2 col-form-label">目前總金額</label>
												<div class="col-sm-10">
													<input type="text" class="form-control" id="total_price"
														name="total_price" value="" readonly>

												</div>
											</div>

										</div>

										<div class="card-body">

											<div class="form-group row">
												<label class="col-sm-2 col-form-label">會員:</label>
												<div class="col-sm-10">
													<select class="form-control" id="member_id" name="member_id"
														style="width: 100%;">
														<option value="">請選擇會員</option>
														<option th:each="member:${session.members}"
															th:value="${member.memberId}" th:text="${member.name}"
															th:data-value="${member.points}">
														</option>
													</select>
												</div>
											</div>


											<div class="form-group row">
												<label class="col-sm-2 col-form-label">優惠券:</label>
												<div class="col-sm-10">
													<select class="form-control select2" id="couponSelect"
														style="width: 100%;" name="coupon_id">
														<option value="0" data-type="" data-value="0">目前無優惠券</option>
													</select>
													<input type="hidden" name="couponUserId" id="couponUserId"
														value="" />
												</div>
											</div>

											<div class="form-group row">
												<label class="col-sm-2 col-form-label">優惠價格:</label>
												<div class="col-sm-10">
													<input type="number" class="form-control" name="discountPrice"
														value="" id="discountPrice" readonly>
												</div>
											</div>
											<hr>
											<div class="form-group row">
												<label class="col-sm-2 col-form-label">持有會員幣量:</label>
												<div class="col-sm-10">
													<input type="number" class="form-control" name="" value=""
														id="memberPoint" readonly>
												</div>
											</div>

											<div class="form-group row">
												<label class="col-sm-2 col-form-label">是否使用會員幣:</label>
												<div class="col-sm-10">
													<input type="checkbox" class="form-control" id="memberPointUse">
												</div>
											</div>
											<div class="form-group row">


												<label class="col-sm-2 col-form-label">會員幣折扣後價格:</label>
												<div class="col-sm-10">
													<input type="number" class="form-control"
														name="totalAmountDiscountPoints" value=""
														id="totalAmountDiscountPoints" readonly>
													<input type="hidden" value="" id="usedPoint" name="usedPoint">
													<input type="hidden" value="" id="getPoint" name="getPoint">
												</div>
											</div>




											<hr>
											<div class="form-group row">
												<label class="col-sm-2 col-form-label">物流方式:</label>
												<div class="col-sm-10">
													<select class="form-control select2" id="method"
														style="width: 100%;" name="method">
														<option value="0" selected="selected">請選擇物流方式</option>
														<option value="7-11">7-11領貨</option>
														<option value="family">全家領貨</option>
														<option value="blackCat">黑貓宅配</option>
													</select>
												</div>
											</div>
											<div class="form-group row">
												<label for="inputPassword3" class="col-sm-2 col-form-label">運費</label>
												<div class="col-sm-10">
													<input type="text" class="form-control" id="fee" value="" readonly
														name="fee">
												</div>
											</div>
											<div class="form-group row">
												<label for="inputPassword3"
													class="col-sm-2 col-form-label">最後總金額</label>
												<div class="col-sm-10">
													<input type="text" class="form-control" id="finalAmount" value=""
														readonly name="finalAmount">
												</div>
											</div>



											<div class="form-group row">
												<label for="inputPassword3"
													class="col-sm-2 col-form-label">收貨人姓名</label>
												<div class="col-sm-10">
													<input type="text" class="form-control" id="recipinet_name"
														placeholder="收貨人姓名" name="recipientName">
												</div>
											</div>
											<div class="form-group row">
												<label for="inputPassword3"
													class="col-sm-2 col-form-label">收貨人電話</label>
												<div class="col-sm-10">
													<input type="text" class="form-control" id="recipinet_phone"
														placeholder="收貨人電話" name="recipientPhone">
												</div>
											</div>
											<div class="form-group row">
												<label for="inputPassword3"
													class="col-sm-2 col-form-label">收貨人地址(超商地址)</label>
												<div class="col-sm-10">
													<input type="text" class="form-control" id="recipinet_address"
														placeholder="地址" name="shippingAddress">
												</div>
											</div>





										</div>
										<!-- /.card-body -->
										<div class="card-footer">
											<button type="submit" class="btn btn-info">送出</button>
											<button type="remove" class="btn btn-default float-right">清除</button>
										</div>
										<!-- /.card-footer -->
									</form>
								</div>
								<!-- /.card-body -->
							</div>
							<!-- /.card -->
						</div>
					</div>
				</div>
			</section>
			<!-- /.content -->
		</div>
		<!-- /.content-wrapper -->

	</div>
	<!-- ./wrapper -->

	<!-- jQuery -->
	<script th:src="@{/plugins/jquery/jquery.min.js}"></script>

	<!-- Bootstrap 4 -->
	<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>

	<!-- DataTables & Plugins -->
	<script th:src="@{/plugins/datatables/jquery.dataTables.min.js}"></script>
	<script th:src="@{/plugins/datatables-bs4/js/dataTables.bootstrap4.min.js}"></script>
	<script th:src="@{/plugins/datatables-responsive/js/dataTables.responsive.min.js}"></script>
	<script th:src="@{/plugins/datatables-responsive/js/responsive.bootstrap4.min.js}"></script>

	<script th:src="@{/plugins/datatables-buttons/js/dataTables.buttons.min.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/buttons.bootstrap4.min.js}"></script>
	<script th:src="@{/plugins/jszip/jszip.min.js}"></script>
	<script th:src="@{/plugins/pdfmake/pdfmake.min.js}"></script>
	<script th:src="@{/plugins/pdfmake/vfs_fonts.js}"></script>

	<script th:src="@{/plugins/datatables-buttons/js/buttons.html5.min.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/buttons.print.min.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/buttons.colVis.min.js}"></script>

	<script th:src="@{/plugins/moment/moment.min.js}"></script>
	<script th:src="@{/plugins/tempusdominus-bootstrap-4/js/tempusdominus-bootstrap-4.min.js}"></script>

	<script th:src="@{/plugins/select2/js/select2.full.min.js}"></script>

	<!-- AdminLTE App -->
	<script th:src="@{/dist/js/adminlte.min.js}"></script>
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
	<script src="../../dist/js/adminAuth.js"></script>
	<!-- AdminLTE for demo purposes
            <script src="../../dist/js/demo.js"></script> -->
	<!-- Page specific script -->
	<script src="../dist/js/admin-layout.js"></script>

	<script>
		$(function () {

			$('#example2')
				.DataTable(
					{
						"paging": true,
						"lengthChange": false, // 關閉每頁筆數選項
						"searching": false, // 關閉搜索框
						"ordering": true,
						"info": true, // 顯示資訊文字
						"autoWidth": true,
						"responsive": true,

						// **【關鍵修正】使用 dom 屬性強制分頁 (p) 靠右 (col-md-7)**
						// 結構: 表格本體(t) / 新的一行: [資訊(i) - 左 5 欄] [分頁(p) - 右 7 欄]
						"dom": '<"row"<"col-sm-12"t>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7 d-flex justify-content-end"p>>'
					});
			//計算總金額
			function updateTotalPrice() {
				let total = 0;
				// 遍歷每個商品的數量和價格
				$("input[name='quantity[]'").each(function (index) {
					let qty = parseFloat($(this).val());
					let price = parseFloat($("input[name='price[]'").eq(index).val());
					if (!isNaN(qty) && !isNaN(price)) {
						total += qty * price;
					}
				});
				// 設定總金額到 total_price 欄位
				$("#total_price").val(total.toFixed(2));
				// 同時也可以同步到 discountPrice 預設為總額
				$("#discountPrice").val(total.toFixed(2));
				// 如果有最後總金額欄位，呼叫計算函式
				finalAmount();
			}

			updateTotalPrice();



			// 啟用 DatePicker (日期時間選擇器)
			$('#reservationdate').datetimepicker({
				format: 'L' // 這裡使用 'L' 代表當地短日期格式，例如 2025/11/29
			});

			function updateFee() {
				let method = $('#method').val();
				let fee = 0;

				if (method === '7-11')
					fee = 45;
				else if (method === 'family')
					fee = 50;
				else if (method === 'blackCat')
					fee = 60;
				$('#fee').val(fee);
				finalAmount()
			}
			updateFee();
			$('#method').on('change', function () {
				updateFee();
			});

			function finalAmount() {

				let discountPrice = parseFloat($("#discountPrice").val()) || 0;
				let fee = parseFloat($("#fee").val()) || 0;
				let memberPoint = parseFloat($("#memberPoint").val()) || 0;

				let finalTotal = discountPrice + fee;
				let usedPoint = 0;
				let amountAfterPoint = discountPrice;

				if ($("#memberPointUse").is(":checked")) {

					// 🔒 可用會員幣上限 = 折扣後商品金額
					usedPoint = Math.min(memberPoint, discountPrice);
					amountAfterPoint = discountPrice - usedPoint;

					finalTotal = amountAfterPoint + fee;
				}

				// 防止負數
				if (finalTotal < 0) finalTotal = 0;

				// === 設定欄位 ===
				$("#usedPoint").val(usedPoint);
				$("#totalAmountDiscountPoints").val(amountAfterPoint.toFixed(2));
				$("#finalAmount").val(finalTotal.toFixed(2));

				// === 回饋點數（5%）===
				let getPoint = Math.floor(finalTotal * 0.05);
				$("#getPoint").val(getPoint); // ← 如果你有這個欄位
			}

			finalAmount()

			$('#method').on('change', function () {
				updateFee();
			});



			// 選會員自動帶入會員優惠券以及會員持有剩餘的會員幣
			$("#member_id").change(function () {
				let memberId = $(this).val();
				if (!memberId || memberId == 0) {
					resetCouponSelect();
					return;
				}
				$.ajax({
					url: "/Cart/byMember",
					type: "GET",
					data: {
						memberId: memberId,
						totalPrice: $("#total_price").val()
					},
					success: function (coupons) {
						renderCoupons(coupons);
					},
					error: function () {
						alert("讀取失敗");
					}
				})
				$("#memberPoint").val($(this).find("option:selected").data("value"))

			});

			function renderCoupons(coupons) {
				console.log(coupons);
				let $select = $("#couponSelect");
				$select.empty();

				// 預設選項
				$select.append(`
			        <option value="0" data-type="" data-value="0">
			            目前無優惠券
			        </option>
			    `);

				if (!coupons || coupons.length === 0) {
					return;
				}

				$.each(coupons, function (i, c) {
					$select.append(`
			            <option value="${c.couponId}"
			                    data-type="${c.discountType}"
			                    data-value="${c.discountValue}"
			                    data-id="${c.id}">
			                ${c.discountType} ${c.discountValue}
			            </option>
			        `);

				});
			}

			function resetCouponSelect() {
				$("#couponSelect")
					.empty()
					.append(`<option value="0">目前無優惠券</option>`);
			}
			//優惠券設定
			$("#couponSelect").on("change", function () {
				let type = $(this).find("option:selected").data("type");
				let value = parseFloat($(this).find("option:selected").data("value")) || 0;
				let couponUserId = $(this).find("option:selected").data("id");

				let total = parseFloat($("#total_price").val()) || 0;
				let discounted = total;

				if (type === "amount") {
					discounted = Math.max(total - value, 0);
				} else if (type === "percent") {
					discounted = total * value
				}
				discounted = Math.round(discounted);

				$("#discountPrice").val(discounted.toFixed(2));
				$("#couponUserId").val(couponUserId)

				// 更新最後總金額
				finalAmount();
			});
			//會員幣使用
			$("#memberPointUse").on("change", function () {

				finalAmount();
			});







		});
	</script>
</body>

</html>
