	<!-- Page specific script -->

	<script>
		$(function() {

			$('#example2')
					.DataTable(
							{
								"paging" : true,
								"lengthChange" : false, // 關閉每頁筆數選項
								"searching" : false, // 關閉搜索框
								"ordering" : true,
								"info" : true, // 顯示資訊文字
								"autoWidth" : true,
								"responsive" : true,

								// **【關鍵修正】使用 dom 屬性強制分頁 (p) 靠右 (col-md-7)**
								// 結構: 表格本體(t) / 新的一行: [資訊(i) - 左 5 欄] [分頁(p) - 右 7 欄]
								"dom" : '<"row"<"col-sm-12"t>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7 d-flex justify-content-end"p>>'
							});
			//計算總金額
			function updateTotalPrice(){
					let total = 0;
			        // 遍歷每個商品的數量和價格
			        $("input[name='quantity[]'").each(function(index) {
			            let qty = parseFloat($(this).val());
			            let price = parseFloat($("input[name='price[]'").eq(index).val());
			            if (!isNaN(qty) && !isNaN(price)) {
			                total += qty * price;
			            }
			        });
			        // 設定總金額到 total_price 欄位
			        $("#total_price").val(total.toFixed(2));
			        // 同時也可以同步到 discountPrice 預設為總額
			        $("#discountPrice").val(total.toFixed(2));
			        // 如果有最後總金額欄位，呼叫計算函式
			        finalAmount();
				}

			updateTotalPrice();
			
			
			
			// 啟用 DatePicker (日期時間選擇器)
			$('#reservationdate').datetimepicker({
				format : 'L' // 這裡使用 'L' 代表當地短日期格式，例如 2025/11/29
			});
			
			function updateFee() {
				let method = $('#method').val();
				let fee = 0;
				
				if (method === '7-11')
					fee = 45;
				else if (method === 'family')
					fee = 50;
				else if (method === 'blackCat')
					fee = 60;
				$('#fee').val(fee);
				finalAmount()
			}
			updateFee();
			$('#method').on('change', function() {
				updateFee();
			});
			
			function finalAmount(){
				let discountPrice=parseFloat($("#discountPrice").val());
				let fee=parseFloat($("#fee").val());
				$('#finalAmount').val(fee+discountPrice);
			}
			
			finalAmount()
			
		


			// 選會員自動帶入會員編號
			$("#member_id").change(function() {
				 let memberId = $(this).val();
				 if (!memberId || memberId == 0) {
				        resetCouponSelect();
				        return;
				    }
			    $.ajax({
			    	url:"/Cart/byMember",
			    	type:"GET",
			    	data: { memberId: memberId },
			    	success: function(coupons){
			    		renderCoupons(coupons);
			    	},
			    	error:function(){
			    		alert("讀取失敗");
			    	}
			    })
			});
			
			function renderCoupons(coupons) {
				console.log(coupons);
			    let $select = $("#couponSelect");
			    $select.empty();

			    // 預設選項
			    $select.append(`
			        <option value="0" data-type="" data-value="0">
			            目前無優惠券
			        </option>
			    `);

			    if (!coupons || coupons.length === 0) {
			        return;
			    }

			    $.each(coupons, function (i, c) {
			        $select.append(`
			            <option value="${c.couponId}"
			                    data-type="${c.discountType}"
			                    data-value="${c.discountValue}">
			                ${c.discountType} ${c.discountValue}
			            </option>
			        `);
			    });
			}

			function resetCouponSelect() {
			    $("#couponSelect")
			        .empty()
			        .append(`<option value="0">目前無優惠券</option>`);
			}
			//優惠券設定
			$("#couponSelect").on("change", function() {
			    let type = $(this).find("option:selected").data("type");
			    let value = parseFloat($(this).find("option:selected").data("value")) || 0;

			    let total = parseFloat($("#total_price").val()) || 0;
			    let discounted = total;

			    if (type === "amount") {
			        discounted = Math.max(total - value, 0);
			    } else if (type === "percent") {
			        discounted = total * value
			    }
			    discounted = Math.round(discounted);

			    $("#discountPrice").val(discounted.toFixed(2));

			    // 更新最後總金額
			    finalAmount();
			});
			
			
			
			
			
			

		});
	</script>
